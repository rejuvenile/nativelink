# systemd drop-in: grant CAP_SYS_ADMIN so the in-process thread-stack
# dumper can read the passive KERNEL call chain from /proc/<tid>/stack.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS
# ---------------------------------------------------------------------------
# nativelink's stall dumper (nativelink-util/src/stall_detector.rs) captures,
# per thread: comm / state / wchan / kernel call chain / userspace backtrace.
# The userspace backtrace is obtained COOPERATIVELY — the dumper sends
# SIGRTMIN+1 and each thread's own signal handler walks its stack. A thread in
# TASK_UNINTERRUPTIBLE ("D") state (e.g. wedged in folio_wait / page-fault /
# ZFS write-back) CANNOT run a signal handler until it wakes, so it can never
# self-report a userspace backtrace. During the exact wedge you most want to
# diagnose, the cooperative path returns nothing (the 2026-07-08 dump read
# "Dump complete: 0/240 threads responded" — every wchan captured, ZERO stacks).
#
# The passive KERNEL call chain in /proc/<tid>/stack IS readable for a D-state
# thread (it is the kernel's own record of where the thread blocked, and names
# the wedged syscall: __x64_sys_pwrite64 vs __x64_sys_futex vs a page-fault
# path, etc.). BUT the kernel gates /proc/<tid>/stack behind CAP_SYS_ADMIN —
# even for a process reading its OWN threads. nativelink runs with only
# CAP_SYS_PTRACE, so without this grant every /proc/<tid>/stack read returns
# EACCES and the dumper degrades to wchan-only (it logs one warning and never
# fails the dump).
#
# ---------------------------------------------------------------------------
# SECURITY NOTE (read before deploying)
# ---------------------------------------------------------------------------
# CAP_SYS_ADMIN is a broad, powerful capability. We grant it here via
# AmbientCapabilities (per-service, inherited by the process) rather than a
# file capability (`setcap`) on the binary, so the grant is scoped to THIS
# systemd unit and is visible/auditable in one place. A narrower capability
# does NOT suffice: the kernel's proc_pid_stack handler specifically requires
# CAP_SYS_ADMIN (not CAP_SYS_PTRACE, not CAP_DAC_READ_SEARCH), confirmed
# empirically on the deploy kernel (owner-self-read of /proc/self/task/<tid>/
# stack with CAP_SYS_PTRACE only → EACCES). If the operator judges the
# diagnostic value not worth the capability, simply do NOT install this
# drop-in: the dumper still runs, still captures wchan + state + userspace
# frames for runnable threads, and logs that kernel-stack capture is degraded.
#
# ---------------------------------------------------------------------------
# INSTALL
# ---------------------------------------------------------------------------
#   sudo install -D -m 0644 nativelink-cap-sys-admin.conf \
#       /etc/systemd/system/nativelink.service.d/10-cap-sys-admin.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart nativelink
#
# Verify the process picked up both caps (CapEff should include bit 19
# CAP_SYS_PTRACE = 0x80000 AND bit 21 CAP_SYS_ADMIN = 0x200000 → 0x280000):
#   grep CapEff /proc/$(pgrep -x nativelink)/status
#
# NOTE: both capabilities must be listed together. A drop-in AmbientCapabilities=
# line REPLACES the base unit's value for the same directive only if in the same
# file; because this is a separate drop-in, systemd MERGES additive list
# directives — but to be unambiguous we restate CAP_SYS_PTRACE here so the
# effective set is explicit regardless of merge semantics.
#
# OPERATOR NOTE (hardened base units — an ambient grant can SILENTLY no-op):
# AmbientCapabilities only takes effect for a capability that is ALSO in the
# process's CapabilityBoundingSet (the kernel rule is ambient ⊆ inheritable ⊆
# bounding), and NoNewPrivileges=true blocks ambient caps entirely. If the base
# unit sets a restrictive `CapabilityBoundingSet=` that omits CAP_SYS_ADMIN — a
# common hardening pass, especially plausible here since the service already runs
# a scoped CAP_SYS_PTRACE — or sets NoNewPrivileges=true, the ambient CAP_SYS_ADMIN
# is SILENTLY dropped and the dumper stays wchan-only: the exact silent
# degradation this grant exists to kill.
#
# The CapabilityBoundingSet= line below guarantees CAP_SYS_ADMIN is in the ceiling
# so the ambient grant lands. READ THE SYSTEMD SEMANTICS BEFORE COPYING IT:
#   * `CapabilityBoundingSet=<list>` (no "~") means "include exactly these; ALL
#     OTHERS ARE REMOVED." Multiple such lines across drop-ins merge by OR. So if
#     your base unit sets NO bounding set (systemd default = full set, our live
#     unit's case), THIS LINE NARROWS the bounding set to exactly {PTRACE, ADMIN}.
#     That is fine for nativelink (it needs no other capability), and is in fact a
#     tighter, more-hardened ceiling — but if YOUR unit needs additional caps, you
#     MUST list them here too or they will be removed.
#   * If your base unit already sets `CapabilityBoundingSet=CAP_SYS_PTRACE ...`,
#     this line ORs CAP_SYS_ADMIN into it (additive) — the intended effect.
#   * A base-unit `NoNewPrivileges=true` cannot be undone by a drop-in raising the
#     bounding set; you must clear it (NoNewPrivileges=false) for ambient caps.
# The CapEff verify step above is the definitive catch either way: expect bit 21 /
# 0x280000. If you see 0x80000 (CAP_SYS_PTRACE only) the ambient CAP_SYS_ADMIN was
# clamped by a bounding-set or NoNewPrivileges= in the base unit.

[Service]
AmbientCapabilities=CAP_SYS_PTRACE CAP_SYS_ADMIN
CapabilityBoundingSet=CAP_SYS_PTRACE CAP_SYS_ADMIN
