---
name: Cargo Native

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -Dwarnings

jobs:
  cargo-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        toolchain: [stable]
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v4.2.2
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Rust toolchain
        run: rustup update && rustup default ${{ matrix.toolchain }}
        shell: bash

      - name: Rust cache
        # https://github.com/Swatinem/rust-cache/releases/tag/v2.8.1
        uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5

      - name: Build on ${{ runner.os }}
        run: cargo build --all --profile=smol

      - name: Test on ${{ runner.os }}
        run: cargo test --all --profile=smol

      - name: Test mirror durability (test-utils feature)
        # The mirror_durability / blobs_in_stable_storage / download_to_directory
        # mirror integration tests are gated on the `test-utils` feature so the
        # internal-only test hooks (`set_mirror_blobs_max_bytes_for_test`,
        # `BlobsAvailableState::new_for_test`) cannot leak into release builds.
        # The default `--all` step above does NOT pass the feature flag, so
        # these tests would otherwise be silently skipped from CI.
        run: cargo test -p nativelink-store -p nativelink-worker --features test-utils --tests

      - name: Check schema export
        run: cargo run --bin build-schema --features dev-schema --package nativelink-config
