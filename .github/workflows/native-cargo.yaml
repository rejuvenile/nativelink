---
name: Cargo Native

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -Dwarnings

jobs:
  cargo-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        toolchain: [stable]
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which breaks
      # the worker tests that use namespaces (e.g. for sandboxing).
      - name: Disable AppArmor namespace restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-24.04'

      - name: Set up Rust toolchain
        run: rustup update && rustup default ${{ matrix.toolchain }}

      - name: Rust cache
        # https://github.com/Swatinem/rust-cache/releases/tag/v2.9.1
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build on ${{ runner.os }}
        run: cargo build --all --profile=smol

      - name: Test on ${{ runner.os }}
        run: cargo test --all --profile=smol

      - name: Test mirror durability (test-utils feature)
        # The mirror_durability / blobs_in_stable_storage / download_to_directory
        # mirror / mirror_capacity_plumbing integration tests are gated on the
        # `test-utils` feature so the internal-only test hooks
        # (`set_mirror_blobs_max_bytes_for_test`, `BlobsAvailableState::new_for_test`,
        # `mirror_capacity_for_test`) cannot leak into release builds. The default
        # `--all` step above does NOT pass the feature flag, so these tests would
        # otherwise be silently skipped from CI.
        run: cargo test -p nativelink-store -p nativelink-worker -p nativelink-service --features nativelink-store/test-utils --features nativelink-worker/test-utils --features nativelink-service/test-utils --tests

      - name: Test chunked_fast_slow feature
        # The chunked_fast_slow-gated test bins (chunked_client_test,
        # chunked_grpc_eviction_test, chunked_size_cap_test,
        # memory_store_backpressure_emission_test, chunked_read_cascade_test,
        # fast_slow_str_key_skips_chunked_dispatch_test,
        # filesystem_store_247_chunked_commit_immediately_visible_test,
        # chunked_filesystem_serialization_test,
        # filesystem_store_256_duplicate_chunked_commit_test,
        # writer_termination_245_drop_fallback_test, plus chunked_p25_p27_e2e_test
        # and the chunked_stable_digests_push_test family in nativelink-service)
        # are gated `required-features = ["chunked_fast_slow"]` (some additionally
        # `"test-utils"`) so the default `cargo test --all` silently skips them.
        # Production deploys with the feature enabled; CI must exercise it.
        # Combines test-utils so chunked tests requiring both features run.
        run: cargo test -p nativelink-store -p nativelink-worker -p nativelink-service --features nativelink-store/chunked_fast_slow --features nativelink-store/test-utils --features nativelink-worker/test-utils --features nativelink-service/chunked_fast_slow --features nativelink-service/test-utils --tests

      - name: Test failpoints (failpoints feature)
        # The `failpoint_tests` suite (#268) and the `fast_slow_store_325_regression_test`
        # suite (#325) gate on the `failpoints` feature: the `fail_point!`
        # macro is a no-op stub without it, so failpoints registered via
        # `fail::cfg` never fire and the tests panic at their `expect()`
        # calls. Both bins are marked `required-features = ["failpoints"]`
        # in `nativelink-store/Cargo.toml` so the default `cargo test --all`
        # silently skips them; this step opts in.
        #
        # Run under `--test-threads=1` so each test's process-wide
        # `fail::cfg` registry mutation is fully serialized — even with
        # `serial_test::serial(failpoints)` annotations on every test,
        # multi-threaded runners exhibited a flake (#325 D.1 reviewer
        # finding) under load.
        run: |
          cargo test -p nativelink-store --features failpoints --test failpoint_tests -- --test-threads=1
          cargo test -p nativelink-store --features failpoints --test fast_slow_store_325_regression_test -- --test-threads=1
        # Also unit-test the cross-crate `SLIDING_WINDOW_EVICTION_MARKER`
        # contract (failpoints not required for this one — it exercises
        # the production code path with a tiny `max_buffer_bytes`).
        # Stays under the default `cargo test --all` step above.

      - name: Install valkey-server (Linux only, for redis-integration-tests)
        # The redis-integration-tests feature spawns a real `valkey-server` /
        # `redis-server` subprocess to exercise the keyspace-notification
        # dispatch path end-to-end (CONFIG SET notify-keyspace-events +
        # PSUBSCRIBE __keyevent@<db>__:* + DEL/PEXPIRE/maxmemory-LRU). Without
        # the binary on $PATH the test bin panics with a clear message — that
        # is intentional (silent skip = no coverage = bug ships invisibly).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valkey-server || \
          sudo apt-get install -y --no-install-recommends redis-server

      - name: Test redis keyspace dispatch (redis-integration-tests, Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p nativelink-store --features redis-integration-tests --test redis_store_notification_test

      - name: Check schema export
        run: cargo run --bin build-schema --features dev-schema --package nativelink-config
