---
name: Nix

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  nix-bazel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    name: Bazel Dev / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v4.2.2
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix

      - name: Invoke Bazel build in Nix shell
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            nix develop --impure --command \
            bash -c "bazel test ... --verbose_failures"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            nix develop --impure --command \
            bash -c "bazel test //... --verbose_failures"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi
        shell: bash

  nix-cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    name: Cargo Dev / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v4.2.2
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix

      - name: Invoke Cargo build in Nix shell
        run: >
          nix develop --impure --command
          bash -c "cargo test --all --profile=smol"

      - name: Test mirror durability (test-utils feature)
        # The mirror_durability / blobs_in_stable_storage / download_to_directory
        # mirror / mirror_capacity_plumbing / local_worker BIS-dispatch integration
        # tests are gated on the `test-utils` feature so the internal-only test
        # hooks (`set_mirror_blobs_max_bytes_for_test`,
        # `BlobsAvailableState::new_for_test`, `mirror_capacity_for_test`) cannot
        # leak into release builds. The default `--all` step above does NOT pass
        # the feature flag, so these tests would otherwise be silently skipped
        # from CI (cargo with `required-features` skips the test bin entirely
        # without erroring). Mirrors the equivalent step in native-cargo.yaml.
        # (#97 follow-up: closes silent-skip on local_worker_test.)
        run: >
          nix develop --impure --command
          bash -c "cargo test -p nativelink-store -p nativelink-worker -p nativelink-service --features nativelink-store/test-utils --features nativelink-worker/test-utils --features nativelink-service/test-utils --tests --profile=smol"

  installation:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    name: Installation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v4.2.2
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix

      - name: Test nix run
        run: |
          nix run -L .#nativelink-is-executable-test

  integration:
    name: ${{ matrix.test-name }}
    strategy:
      matrix:
          test-name: [buildstream, mongo, buck2, rbe-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: >- # v4.2.2
          actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare Worker
        uses: ./.github/actions/prepare-nix

      - name: Test ${{ matrix.test-name }} run
        run: |
          nix run -L .#${{ matrix.test-name }}-with-nativelink-test
