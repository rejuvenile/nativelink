#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-scheduler"
version = "1.6.1"

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-metric = { path = "../nativelink-metric" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-store = { path = "../nativelink-store" }
nativelink-util = { path = "../nativelink-util" }

async-lock = { version = "3.4.0", features = ["std"], default-features = false }
async-trait = { version = "0.1.88", default-features = false }
bytes = { version = "1.10.1", default-features = false }
futures = { version = "0.3.31", default-features = false }
humantime = { version = "2.3.0", default-features = false }
lru = { version = "0.16.0", default-features = false }
mock_instant = { version = "0.5.3", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-semantic-conventions = { version = "0.32.0", default-features = false, features = [
  "default",
  "semconv_experimental",
] }
parking_lot = { version = "0.12.3", default-features = false }
prost = { version = "0.14.4", default-features = false }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
redis = { version = "1.0.0", default-features = false }
scopeguard = { version = "1.2.0", default-features = false }
serde = { version = "1.0.219", features = ["rc"], default-features = false }
serde_json = { version = "1.0.140", default-features = false }
static_assertions = { version = "1.1.0", default-features = false }
tokio = { version = "1.52.2", features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "signal",
], default-features = false }
tokio-stream = { version = "0.1.17", features = [
  "fs",
], default-features = false }
tonic = { version = "0.14.5", features = [
  "tls-aws-lc",
  "transport",
], default-features = false }
tracing = { version = "0.1.41", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = [
  "serde",
  "v4",
] }
# (#task-resource-profile Phase-3 §12) Versioned snapshot (de)serialization for the
# persisted resource-profile map — the SAME serializer used by nativelink-store.
wincode = { version = "0.5.4", default-features = false, features = [
  "alloc",
  "derive",
] }

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }
nativelink-redis-tester = { path = "../nativelink-redis-tester" }
# (FINDING 3 fix-up, pair-a F1) `test-util` enables `tokio::time::pause` so the
# cooldown-expiry self-wake test drives the NAK stamps AND the wake timer on one
# paused clock (deterministic, zero wall wait). Test-only — dev-dep features do
# not reach the shipped binary. Mirrors nativelink-util's dev tokio declaration.
tokio = { version = "1.52.2", features = [
  "macros",
  "test-util",
], default-features = false }

# (#calib T2) `test-util` enables `start_paused` so the hold-counters cadence
# wiring test can advance the 15 s interval deterministically (no
# sleep-as-synchronization). Mirrors nativelink-util's dev-dep line.
tokio = { version = "1.52.2", features = ["macros", "test-util"], default-features = false }

pretty_assertions = { version = "1.4.1", features = [
  "std",
], default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }
