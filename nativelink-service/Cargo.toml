#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-service"
version = "1.0.0"

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-metric = { path = "../nativelink-metric" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-scheduler = { path = "../nativelink-scheduler" }
nativelink-store = { path = "../nativelink-store" }
nativelink-util = { path = "../nativelink-util" }

fail = { version = "0.5", optional = true }

axum = { version = "0.8.3", default-features = false }
bytes = { version = "1.10.1", default-features = false }
futures = { version = "0.3.31", default-features = false }
# h2 = direct dependency so #355 terminal-frame inspector can downcast
# `tonic::Status::source()` to `h2::Error` and pull `h2::Reason` (CANCEL,
# REFUSED_STREAM, INTERNAL_ERROR, …) out of an inbound RST_STREAM. Already
# pulled in transitively by tonic 0.14 / hyper 1, so no extra link cost.
h2 = { version = "0.4.13", default-features = false }
http = { version = "1.3.1", default-features = false }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.6.0", default-features = false }
# `h2_server::build_h2_server_builder` constructs a
# `hyper_util::server::conn::auto::Builder<TaskExecutor>` with `TokioTimer`
# so both `src/bin/nativelink.rs::inner_main` and the bench `start_v2_server`
# share one source of truth for the 10 production h2 settings sourced from
# `nativelink-config::HttpServerConfig`. Pattern-C Phase 2 extraction
# (parallels Phase 1's `build_store_manager` in nativelink-store).
hyper-util = { version = "0.1.11", default-features = false, features = [
  "server-auto",
  "tokio",
] }
opentelemetry = { version = "0.31.0", default-features = false }
opentelemetry-semantic-conventions = { version = "0.31.0", default-features = false, features = [
  "default",
  "semconv_experimental",
] }
parking_lot = { version = "0.12.3", default-features = false }
prost = { version = "0.14.3", default-features = false }
prost-types = { version = "0.14.3", default-features = false, features = [
  "std",
] }
# `sha2` is `optional` because it is only consumed by the
# `chunked_fast_slow`-gated `WriteChunked` handler (per-chunk SHA-256
# verify on `spawn_blocking`, #213 perf-opt NMA1). Default-feature
# builds do not link sha2 into nativelink-service. Already a
# dev-dependency below; the `optional = true` upgrade lets the gated
# code path use it from the lib too.
sha2 = { version = "0.10.8", default-features = false, features = ["asm"], optional = true }
# `async-trait` is required by the `chunked_fast_slow` Phase 2.7 dispatcher
# trait impl (`BazelChunkedDispatcherImpl`); already a dev-dependency below.
# Optional + gated on the same feature so default-feature builds do not
# pull it into the lib.
async-trait = { version = "0.1.88", default-features = false, optional = true }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
serde_json5 = { version = "0.2.1", default-features = false }
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "signal",
], default-features = false }
tokio-stream = { version = "0.1.17", features = [
  "fs",
], default-features = false }
tonic = { version = "0.14.5", features = [
  "gzip",
  "router",
  "tls-aws-lc",
  "transport",
  "zstd",
], default-features = false }
tower = { version = "0.5.2", default-features = false }
tracing = { version = "0.1.41", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = [
  "serde",
  "v4",
] }

[features]
failpoints = ["fail/failpoints"]
# Enables `mirror_capacity_for_test` accessor on `WorkerProxyStore` so the
# capacity-plumbing integration test can assert that BlobsAvailable
# capacity fields reach the picker. #44 fix-up B3: also forwards to
# `nativelink-util/test-utils` so the `StreamingBlobInner` Layer-A
# bypass accessors (`bytes_written_atomic`, `append_chunk_for_test`,
# `InFlightBlobMap::insert_for_test`) and the
# `ByteStreamServer::in_flight_blobs_for_test` accessor link in for
# the Layer B/C regression tests but stay OUT of production builds.
test-utils = ["nativelink-store/test-utils", "nativelink-util/test-utils"]
# #212 Phase 2.2/2.3: server-side `WriteChunked` RPC handler + per-blob
# `ChunkedDriver` behavior. Default OFF; production data path does not
# consume it yet. Forwarded to nativelink-store so the chunked module
# (driver, budget, filesystem adapters) compiles in too. Also enables
# `sha2` (used by the per-chunk SHA-256 verify step on `spawn_blocking`
# per #213 perf-opt NMA1).
chunked_fast_slow = ["nativelink-store/chunked_fast_slow", "dep:sha2", "dep:async-trait"]
# #538/#539: when enabled, the W3 chunked-v2 hot-path probes
# (`_w3_probe_*_start = Instant::now()` + matching `info!` emits)
# compile in and fire during bench runs. When disabled (the default,
# including production builds), the entire probe block is `#[cfg]`-d
# out so neither the timer reads nor the macro expansions survive in
# the release binary. Use the `info!` level (not `trace!`) so the
# workspace's `release_max_level_info` pin on `tracing` does NOT
# silently compile the message back out.
#
# Operator: enable via `cargo build -p nativelink-benchmarks
# --features bench-trace`, which forwards into this crate through
# `nativelink-benchmarks`'s `bench-trace` feature.
#
# Verification: `strings target/release/data_plane_bench |
# grep -c 'w3_probe'` must be 0 without the feature, >0 with.
bench-trace = []

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }
fail = { version = "0.5", features = ["failpoints"] }
# Brings in `test-util` so `#[nativelink_test(start_paused = true)]`
# can drive virtual time in dedup-gate timeout tests without waiting
# 15 s wall-clock per case.
tokio = { version = "1.44.1", features = ["test-util"], default-features = false }

async-lock = { version = "3.4.0", features = ["std"], default-features = false }
blake3 = { version = "1.8.0", default-features = false }
async-trait = { version = "0.1.88", default-features = false }
hex = { version = "0.4.3", default-features = false }
hyper = { version = "1.6.0", default-features = false }
pretty_assertions = { version = "1.4.1", features = [
  "std",
], default-features = false }
prost-types = { version = "0.14.3", default-features = false }
tonic-prost = { version = "0.14.5", default-features = false }
serde_json = { version = "1.0.140", default-features = false, features = [
  "std",
] }
sha2 = { version = "0.10.8", default-features = false, features = ["asm"] }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
  "registry",
] }

[package.metadata.cargo-machete]
# Used by nativelink_test macro
ignored = ["tracing-test"]

# Integration tests that need the in-crate `test-utils` feature gate.
# Run with:
#   `cargo test -p nativelink-service --features test-utils --test worker_api_server_test`
# (cargo auto-skips tests whose required-features are not enabled.)
[[test]]
name = "worker_api_server_test"
required-features = ["test-utils"]

# #168 SmallBlobDispatcher producer-side integration tests. Use
# `WorkerProxyStore::mirror_total_attempted_for_test` (gated behind
# `test-utils`) for the item F duplicate-mirror suppression assertion.
# Run with:
#   `cargo test -p nativelink-service --features test-utils \
#       --test small_blob_dispatch_integration_test`
[[test]]
name = "small_blob_dispatch_integration_test"
required-features = ["test-utils"]

# #212 Phase 2.2/2.3 chunked_write_handler integration tests use the
# `_for_test` constructor on `ChunkedWriteHandler` which is gated behind
# `test-utils` (rust-crate-reviewer F7 fixup; production builds cannot
# accidentally instantiate a handler with a non-CHUNK_SIZE chunk_size).
# Run with:
#   `cargo test -p nativelink-service --features chunked_fast_slow,test-utils \
#       --test chunked_write_handler_test`
[[test]]
name = "chunked_write_handler_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #212 Phase 2.7 Bazel-facing internal-chunking tests. Wires a real
# FastSlowStore + a real BazelChunkedDispatcherImpl and exercises the
# kill-switch + size-threshold + dispatcher branches in
# `FastSlowStore::update`. Run with:
#   `cargo test -p nativelink-service --features chunked_fast_slow,test-utils \
#       --test bazel_facing_internal_chunking_test`
[[test]]
name = "bazel_facing_internal_chunking_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #212 Phase 2.5/2.7 fixup S2 — end-to-end integration test (combined
# Phase 2.5 read cascade + Phase 2.7 chunked dispatch). Run with:
#   `cargo test -p nativelink-service --features chunked_fast_slow,test-utils \
#       --test chunked_p25_p27_e2e_test`
[[test]]
name = "chunked_p25_p27_e2e_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #282 production-incident-2026-05-06 fix — chunked-write completion
# MUST push committed digests to FastSlowStore::stable_digests so the
# BIS broadcast loop can ack stable bytes. Asymmetric contract
# coverage: under-action (push fires on success), over-action (no push
# on commit failure), race coverage (no visibility gap between
# in_flight and stable). Run with:
#   `cargo test -p nativelink-service --features chunked_fast_slow,test-utils \
#       --test chunked_stable_digests_push_test`
[[test]]
name = "chunked_stable_digests_push_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #212 v4.5 — end-to-end wire-routing test for `WriteChunked` on the
# `CasExtensions` service. Spins up a real `tonic::transport::Server`
# registering ONLY `CasExtensions` (not `WorkerApi`) and a real client
# `CasExtensionsClient`; proves the URI dispatch reaches the
# `ChunkedWriteHandler`. This was the regression-test gap that let
# the WorkerApi-routed WriteChunked ship to production unreachable.
[[test]]
name = "cas_extensions_routing_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #494-v3 Phase 2 bidi `WriteChunkedV2` multi-writer race-state tests.
# Uses `_for_test` constructors / counter accessors gated behind
# `test-utils` and v2-feature behaviour gated behind `chunked_fast_slow`.
# Without these features the file body is `#![cfg(feature = "chunked_fast_slow")]`
# so cargo would silently skip on missing features (DS reviewer MAJOR-2,
# #499 follow-up). Run with:
#   `cargo test -p nativelink-service --features chunked_fast_slow,test-utils \
#       --test chunked_write_handler_v2_test`
[[test]]
name = "chunked_write_handler_v2_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #401 cancel-safety regression test for InFlightChunkedGuard + #499
# BLOCK-2 per-digest Notify wakeup tests. File-level
# `#![cfg(feature = "chunked_fast_slow")]` would silently skip the file
# on missing features; the `required-features` declaration makes cargo
# surface that with the standard "test skipped (missing required
# features)" message.
[[test]]
name = "chunked_inflight_cancel_safety_test"
required-features = ["chunked_fast_slow"]

# #247+#477 writer-site `info!` log-contract tests. The replacement v1
# production-composition test uses the `_for_test` constructor on
# `ChunkedWriteHandler` (gated behind `test-utils`); the FSS guard tests
# use the `chunked_fast_slow` feature. File-level
# `#![cfg(feature = "chunked_fast_slow")]` would silently skip the file
# on missing features (auditor MAJOR; cargo otherwise reports "0 tests");
# the `required-features` declaration surfaces a "test skipped" message.
[[test]]
name = "writer_site_logs_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #44 Layer C — server-side `inner_read` unfold cap exercised at the
# streaming-blob branch (`:1493`) by injecting a forged-overshoot inner
# via the `_for_test` accessors gated behind `test-utils`.
[[test]]
name = "bytestream_inner_read_overshoot_cap_test"
required-features = ["test-utils"]

# #44 Layer C — server-side `inner_read` unfold cap exercised at the
# AT-REST branch (`:1768`) — the production hot path for Bazel parallel
# `Read(offset=N, limit=0)` reads against committed CAS blobs. Uses a
# custom `OverdeliveringStore` and runs without `test-utils` because
# the at-rest unfold cap does not depend on any `_for_test` accessor.
