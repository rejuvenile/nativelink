#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-store"
version = "1.6.1"

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-metric = { path = "../nativelink-metric" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-redis-tester = { path = "../nativelink-redis-tester" }
nativelink-util = { path = "../nativelink-util" }

fail = { version = "0.5", optional = true }

arc-swap = { version = "1.8.2", default-features = false }
async-lock = { version = "3.4.0", features = ["std"], default-features = false }
async-trait = { version = "0.1.88", default-features = false }
aws-config = { version = "1.6.1", default-features = false, features = ["sso"] }
aws-sdk-s3 = { version = "1.82.0", features = [
  "http-1x",
  "rt-tokio",
], default-features = false }
aws-smithy-runtime-api = { version = "1.7.4", default-features = false, features = [
  "client",
  "http-1x",
] }
aws-smithy-types = { version = "1.3.0", default-features = false, features = [
  "http-body-1-x",
] }
azure_core = { version = "1", default-features = false, features = [
  "reqwest",
  "tokio",
] }
azure_identity = { version = "1", default-features = false, features = [
  "tokio",
] }
azure_storage_blob = { version = "1", default-features = false, features = [
  "tokio",
] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bincode = { version = "2.0.1", default-features = false, features = [
  "alloc",
  "serde",
] }
blake3 = { version = "1.8.0", default-features = false, features = ["std", "rayon"] }
byteorder = { version = "1.5.0", default-features = false }
bytes = { version = "1.10.1", default-features = false }
const_format = { version = "0.2.34", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
gcloud-auth = { version = "1.3", default-features = false, features = [
  "jwt-rust-crypto",
] }
gcloud-storage = { version = "1.3", default-features = false, features = [
  "auth",
  # reqwest 0.13's `rustls` feature pulls aws-lc-rs; `rustls-no-provider` uses
  # the process-default rustls provider (ring, installed by common_s3_utils) so
  # the whole binary stays on a single crypto provider.
  "rustls-no-provider",
] }
hex = { version = "0.4.3", default-features = false }
http = { version = "1.3.1", default-features = false }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
humantime = { version = "2.3.0", default-features = false }
hyper = { version = "1.6.0", default-features = false }
hyper-rustls = { version = "0.27.5", default-features = false, features = [
  "http1",
  "http2",
  "aws-lc-rs",
  "rustls-native-certs",
  "rustls-platform-verifier",
] }
hyper-util = { version = "0.1.11", default-features = false }
itertools = { version = "0.14.0", default-features = false }
# #47 b1: chunked_writer.rs needs `libc::iovec` for io_uring writev
# iovec construction. Always-on (negligible at zero use), matches
# `nativelink-util`'s libc dep.
libc = { version = "0.2.177", default-features = false }
lz4_flex = { version = "0.11.3", default-features = false }
mongodb = { version = "3", features = [
  "compat-3-0-0",
  "rustls-tls",
], default-features = false }
opentelemetry = { version = "0.32.0", default-features = false }
parking_lot = { version = "0.12.3", features = [
  "arc_lock",
  "send_guard",
], default-features = false }
patricia_tree = { version = "0.9.0", default-features = false }
prost = { version = "0.14.4", default-features = false }
prost-types = { version = "0.14.4", default-features = false }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
redis = { version = "1.0.0", default-features = false, features = [
  "ahash",
  "cluster-async",
  "connection-manager",
  "script",
  "sentinel",
  "tokio-comp",
] }
regex = { version = "1.11.1", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = [
  "charset",
  "http2",
  "rustls-no-provider",
  "stream",
] }
reqwest-middleware = { version = "0.5.1", default-features = false }
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1.13.1", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
sha2 = { version = "0.10.8", default-features = false, features = ["asm"] }
tokio = { version = "1.52.2", features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "signal",
], default-features = false }
tokio-stream = { version = "0.1.17", features = [
  "fs",
], default-features = false }
# #47 b1 Phase 2: chunked_writer.rs uses tokio_epoll_uring::SystemHandle::writev
# directly so the writer task can keep its own fd-Arc and submit writev
# SQEs without bouncing through nativelink-util. Gated on the same
# `io-uring` feature so non-Linux / no-io-uring builds compile out.
tokio-epoll-uring = { path = "../tokio-epoll-uring/tokio-epoll-uring", optional = true }
tokio-util = { version = "0.7.14", default-features = false }
tonic = { version = "0.14.5", features = [
  "tls-aws-lc",
  "transport",
], default-features = false }
tracing = { version = "0.1.41", default-features = false }
url = { version = "2.5.7", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = [
  "serde",
  "v4",
] }
webpki-roots = { version = "1", default-features = false }
wincode = { version = "0.5.4", default-features = false, features = [
  "alloc",
  "derive",
] }

[features]
io-uring = ["nativelink-util/io-uring", "dep:tokio-epoll-uring"]
quic = ["nativelink-util/quic"]
failpoints = ["dep:fail", "fail/failpoints", "nativelink-util/failpoints"]
# Test-only hooks (e.g. `set_mirror_blobs_max_bytes_for_test`). Must be
# enabled by integration tests under `[dev-dependencies]`. Production
# builds MUST NOT enable this feature — these hooks bypass safety
# invariants for testing convenience. Forwards to nativelink-util's
# test-utils so the FilesystemStore wedge-selfheal test passthroughs
# (FINDING 2) reach the cfg-gated map seams.
test-utils = ["nativelink-util/test-utils"]
# Phase 1 SKELETON for #212 (chunked-streaming architecture). Gates the
# `chunked` module — no production data path consumes it yet, so the
# default build is byte-identical to before this flag existed. Phase 2
# PRs will wire up admission, the per-blob driver, the new
# `WriteChunked` RPC, and the FilesystemStore `pwrite`-at-offset APIs.
# Default: OFF.
chunked_fast_slow = []
# #538/#539: forwards the `bench-trace` feature into the chunked
# filesystem adapter so the per-chunk stage-breakdown `info!` probe
# fires during bench runs. Default OFF; production builds (which do
# not enable this flag) compile the probe out entirely. See
# `nativelink-service`'s `bench-trace` feature for the operator-facing
# doc.
bench-trace = []
# Tests that drive a real `valkey-server` / `redis-server` subprocess to
# exercise the keyspace-notification dispatch path end-to-end (CONFIG SET
# notify-keyspace-events + PSUBSCRIBE __keyevent@<db>__:* + DEL/PEXPIRE
# /maxmemory-LRU). Required by `tests/redis_store_notification_test.rs`.
# CI must enable this feature; default `cargo test` on dev boxes without
# `valkey-server` still passes (the test bin is gated out).
redis-integration-tests = []

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }
fail = { version = "0.5", features = ["failpoints"] }
# Layered on top of the regular tokio dep to add the `test-util` feature
# (gates `tokio::time::pause`/`advance`). Required by the slow-write
# watchdog test in `pin_expire_failed_writes_test.rs` to advance the
# 60s watchdog timer without wall-clock waits.
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "process",
  "rt-multi-thread",
  "signal",
  "test-util",
], default-features = false }

aws-sdk-s3 = { version = "1.82.0", features = [
  "http-1x",
  "rt-tokio",
], default-features = false }
aws-smithy-http-client = { version = "1.1.13", default-features = false, features = [
  "test-util",
] }
aws-smithy-runtime-api = { version = "1.7.4", default-features = false }
aws-smithy-types = { version = "1.3.0", default-features = false, features = [
  "http-body-1-x",
] }
dirs = { version = "6.0.0", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
fs-set-times = { version = "0.20.3", default-features = false }
futures = { version = "0.3.31", default-features = false, features = [
  "executor",
] }
http = { version = "1.3.1", default-features = false }
libc = { version = "0.2.177", default-features = false }
memory-stats = { version = "1.2.0", default-features = false }
mock_instant = { version = "0.5.3", default-features = false }
pretty_assertions = { version = "1.4.1", features = [
  "std",
], default-features = false }
rand = { version = "0.9.0", default-features = false, features = [
  "small_rng",
  "thread_rng",
] }
redis-test = { version = "1.0.0", default-features = false, features = ["aio"] }
rlimit = { version = "0.10.2", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
serial_test = { version = "3.2.0", default-features = false, features = ["async"] }
tar = { version = "0.4.44", default-features = false }
tempfile = { version = "3.8.1", default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }
zip = { version = "8.0.0", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[package.metadata.cargo-machete]
# Used by nativelink_test macro
ignored = ["tracing-test"]

# Integration tests that need the in-crate `test-utils` feature gate.
# Run with: `cargo test -p nativelink-store --features test-utils --test mirror_durability_test`
# (cargo auto-skips tests whose required-features are not enabled.)
[[test]]
name = "mirror_durability_test"
required-features = ["test-utils"]

# #212 Phase 2.4 production-composition tests for the worker-side
# `WriteChunked` client. Gated on the `chunked_fast_slow` feature so
# the default `cargo test` skips them; run explicitly via
# `cargo test -p nativelink-store --features chunked_fast_slow --test chunked_client_test`.
[[test]]
name = "chunked_client_test"
required-features = ["chunked_fast_slow"]

# #212 Phase 2.4 fixup B2: regression test that the chunked-write path
# triggers `evict_pool_on_transport_err` on transport-shaped failures
# (mirrors the existing #147 pool-eviction wiring on the legacy
# ByteStream path). Gated on `chunked_fast_slow`.
[[test]]
name = "chunked_grpc_eviction_test"
required-features = ["chunked_fast_slow"]

# #212 Phase 2.4 fixup B1 part 1: regression test for the
# MAX_CHUNKED_BLOB_SIZE upper-bound cap (blobs > 256 MiB fall back to
# the legacy ByteStream path because the v1 chunked client buffers the
# entire payload in memory).
[[test]]
name = "chunked_size_cap_test"
required-features = ["chunked_fast_slow"]

# #212 Phase 2.6: MemoryStore backpressure-emission regression tests.
# Gated on `chunked_fast_slow` because the new emission path is only
# reachable with that feature flag; default `cargo test` skips this.
# Asymmetric-contract coverage (under-action + over-action) plus the
# VerifyStore production-composition surround and a classifier
# round-trip check against `error_has_backpressure_signal`.
[[test]]
name = "memory_store_backpressure_emission_test"
required-features = ["chunked_fast_slow"]

# #212 Phase 2.5 production-composition tests for the chunked-pin read
# cascade (FastSlowStore::get_part consults ChunkedReadRegistry between
# the legacy in-flight-slow-writes step and the slow store). Wraps the
# FastSlowStore in a real VerifyStore so the writer-termination
# contract is validated end-to-end.
[[test]]
name = "chunked_read_cascade_test"
required-features = ["chunked_fast_slow"]

# #212 Phase 2.7 fixup D6: regression test that Str-keyed `update()` on
# `FastSlowStore` skips the chunked-dispatch gate entirely (avoiding the
# `into_digest()` Blake3 hash on AC entries' string keys when the
# kill-switch is ON). Requires `test-utils` for
# `set_chunked_size_threshold_for_test`.
[[test]]
name = "fast_slow_str_key_skips_chunked_dispatch_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #247: regression for `FilesystemStore::finalize_holding` MUST insert
# the freshly-renamed canonical CAS file into `evicting_map` so
# `has_with_results` sees the blob immediately after the chunked driver
# reports commit success. Production-composition test (real
# `ChunkedDriver` → real `FilesystemStore`); 5 s deadlock detector.
[[test]]
name = "filesystem_store_247_chunked_commit_immediately_visible_test"
required-features = ["chunked_fast_slow"]

# #218 testing-czar M2 + M3 deferred coverage from #212 Phase 2.1
# `chunked_filesystem.rs` adapter primitives review. M2: per-blob
# serialization + cross-blob parallelism. M3: discard/commit
# over-action gaps (never-written discard, double-commit Err,
# zero-byte commit). Requires `test-utils` for `partial_path_for_digest`.
[[test]]
name = "chunked_filesystem_serialization_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #256: regression for the duplicate-chunked-commit insert+unref bug
# where `finalize_holding`'s second `evicting_map.insert(key, ...)`
# triggers `unref()` on the OLD Arc, which renames the canonical CAS
# file to a temp path, leaving the new entry pointing at a missing
# file -> production PHANTOM BLOB warns at `FastSlowStore::run_producer`.
[[test]]
name = "filesystem_store_256_duplicate_chunked_commit_test"
required-features = ["chunked_fast_slow"]

# #268: pre-existing failpoint suite. Without the `failpoints` feature
# the `fail_point!` expansion is a no-op stub, so failpoints registered
# via `fail::cfg(...)` never fire and 12/14 of these tests panic at the
# `expect()` calls that assume the failpoint shapes a synthetic error.
# Marking the bin `required-features = ["failpoints"]` makes cargo
# silently skip it from the default `cargo test --all` run, then opt
# into it via the explicit failpoint-feature CI step
# (`.github/workflows/native-cargo.yaml`).
[[test]]
name = "failpoint_tests"
required-features = ["failpoints"]

# #325 (option D.1): per-reader fallback to a fresh slow_store.get_part
# on `Code::Unavailable: reader fell behind sliding window`. Uses the
# `streaming_blob_next_chunk_fail` failpoint to deterministically trigger
# the sliding-window path. Requires the `failpoints` feature so the
# failpoint macros expand.
[[test]]
name = "fast_slow_store_325_regression_test"
required-features = ["failpoints"]

# #245 follow-up: the chunked-dispatch `data_stream_fut` regression test
# uses `set_chunked_size_threshold_for_test` (gated on `test-utils`) and
# `FastSlowStore::set_bazel_chunked_dispatcher` (gated on
# `chunked_fast_slow`). Without these required-features the test fails
# to compile when the chunked feature is on, and silently skips when off.
[[test]]
name = "writer_termination_245_drop_fallback_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #334 Fix C eviction extension: production-composition tests for the
# `MemoryStore::check_backpressure_gate` LRU-eviction-before-emit path.
# The gate path is `#[cfg(feature = "chunked_fast_slow")]` (it lives
# alongside the typed BackpressureSignal emission), so this test is
# also `#![cfg(feature = "chunked_fast_slow")]` at module level.
# Declared explicitly so cargo silently skips it from default
# `cargo test --all` (matches the pattern for
# `memory_store_backpressure_emission_test`).
[[test]]
name = "memory_store_backpressure_eviction_test"
required-features = ["chunked_fast_slow"]

# #332: regression that `CompletenessCheckingStore::has_with_results`
# does NOT pin verified CAS digests in the underlying MemoryStore.
# Uses the test-utils-gated `MemoryStore::pinned_bytes_for_test` accessor
# to inspect pin state through the production-composition wrapping chain.
# `chunked_fast_slow` is required because the SECOND test in this file
# (`ccs_pin_deletion_satisfies_composite_invariant`) wires the
# `emit_backpressure_enabled` gate corner — the gate path is itself
# `#[cfg(feature = "chunked_fast_slow")]` (see `memory_store.rs:269`),
# so the composite invariant the second test exercises is only
# observable with that feature enabled.
[[test]]
name = "existence_cache_ref_store_registration_test"
required-features = ["test-utils"]

# #10 + #11: capability-query honesty and callback-chain correctness across
# ECS / FastSlow / RefStore compositions. Covers:
#   - FastSlow::new() with ref-wrapped slow → BIS listener registered (#10)
#   - FastSlow::supports_removal_callbacks() honesty (#11)
#   - RefStore::get_store() cell-write-before-replay (#11 Item 5)
#   - ECS(RefStore→FastSlow) slow-tier eviction propagation (#11 Item 6)
#   - invalidation_callbacks_fired counter (#11 Item 3)
[[test]]
name = "capability_query_callback_chain_test"
required-features = ["test-utils"]

[[test]]
name = "completeness_checking_pin_accumulation_test"
required-features = ["test-utils", "chunked_fast_slow"]

# #40 §2: StoreDriver::remove full-chain + CCS delete-on-detection tests.
# test-utils gate matches crate integration test convention; constructor
# APIs are public under that feature.
[[test]]
name = "store_remove_test"
required-features = ["test-utils"]

# CCS Phase 1 kill-switch: disable_completeness_check flag, worker-fetch goal
# test (Test A §7), flag-behavior test (Test B, both directions), and
# wps_cas_and_peer_notfound_total render-test (Test C / §3.3 observability).
[[test]]
name = "ccs_phase1_kill_switch_test"
required-features = ["test-utils"]

# #12 H4 invariant phase 3/3: CCS pending-registry consult.
# Tests the rescue path (missing-from-CAS + registry-live → present),
# dead-endpoint direction (no rescue), composite invariant (no delete on
# rescue), and CAS-plane boundary (registry does not bleed into CAS has()).
[[test]]
name = "completeness_checking_ccs_consult_test"
required-features = ["test-utils"]

# #247/#477 BLOCK-B log-visibility regression tests. File-level
# `#![cfg(feature = "chunked_fast_slow")]` would silently skip the file
# on missing features (auditor MAJOR; cargo otherwise reports "0 tests");
# the `required-features` declaration surfaces the standard "test
# skipped (missing required features)" message.
[[test]]
name = "fast_slow_block_b_log_visibility_test"
required-features = ["chunked_fast_slow"]

# #47 b1 v2 Phase 2 Step 5: integration tests for the io_uring writev
# coalescer (`chunked_writer.rs`). Production composition: real
# `FilesystemStore` + real `ChunkedDriver::spawn_driver` + 5 s deadlock
# detector; T1 + T_multi also assert `has_with_results = Some(size)`
# (index-visibility contract). Requires `test-utils` because the
# FilesystemStore fixture uses test-only helpers and the chunked path
# is feature-gated.
[[test]]
name = "chunked_b1_writev_test"
required-features = ["chunked_fast_slow", "test-utils"]

# #F3 sibling: idle-TTL reap of abandoned SpawnBlocking chunked-partial
# entries + RAII writer-session guard. Registered with required-features
# (repo convention) so a featureless `cargo test` SKIPS the target
# instead of reporting a silently-empty "0 tests ok" suite.
[[test]]
name = "chunked_spawnblocking_reap_test"
required-features = ["chunked_fast_slow", "test-utils"]
