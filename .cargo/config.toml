[build]
# Cross-platform defaults. Cargo APPLIES these only when no matching
# `[target.<triple>]` table is set. When a target table IS set (see Linux
# below), cargo REPLACES (does NOT concatenate) these with the target's
# rustflags. Per
# https://doc.rust-lang.org/cargo/reference/config.html#buildrustflags
#
# **Practical consequence:** any flag here MUST be duplicated in every
# active `[target.<triple>]` block, or it is silently dropped on that
# target. The alternative — relying on concatenation — does not work in
# any released cargo, despite many docs/examples implying it does.
#
# **Today (2026-05-04) this caught us:** `--cfg tokio_unstable` was set
# only here; the Linux target block did not duplicate it. Linux builds
# silently dropped it. `src/bin/nativelink.rs:264-287` runtime-metrics
# watchdog (gated `#[cfg(tokio_unstable)]`) had been compiled out as
# dead code in production for the entire lifetime of that block. A
# probe added to `nativelink-util/src/spawn_rate_probe.rs` calling
# `m.num_blocking_threads()` unconditionally then failed to compile,
# the deploy script's `2>&1 | tail -3` swallowed the error, and a
# stale binary was installed. See `.claude/audits/239-deep-dive-mechanism.md`.
rustflags = ["-C", "target-cpu=native", "-C", "force-frame-pointers=yes", "--cfg", "tokio_unstable"]

# Linux build flags. MUST DUPLICATE every entry from `[build] rustflags`
# above, or that entry is silently dropped on Linux. Linux-only
# additions go after the duplicates.
#
# Linux-only additions:
# - `-C link-arg=-fuse-ld=mold` cuts test-binary link wall-clock; mold is
#   already a hard requirement on the deploy server.
# - `-Z share-generics=y` collapses duplicate generic instantiations across
#   crate boundaries. Big win when iterating on nativelink-store: the lib's
#   30+ integration test binaries each used to monomorphize their own copy of
#   tonic/prost/futures generics. After enabling, incremental
#   `cargo build --tests -p nativelink-store` after a 1-file touch dropped
#   from a noisy ~45-90s steady-state to ~11s in the agent benchmark.
# - `-Z threads=64` runs the rustc front-end across up to 64 threads (cap,
#   not target — rustc uses what it needs per invocation). Helps cold and
#   warm builds on this 64-core box where individual rustc invocations on
#   tonic-derived crates were single-threaded bottlenecks. Per-invocation
#   parallelism × cargo's parallel-rustc count can theoretically
#   oversubscribe; rustc's own work-stealing scheduler keeps it in check
#   in practice.
#
# `-Z` flags require nightly; the workspace already runs nightly via the
# rustup default. If a non-nightly toolchain is ever forced for this
# workspace, drop the `-Z` lines below or guard them in a separate config.
[target.x86_64-unknown-linux-gnu]
rustflags = [
  # === duplicated from [build] above (cargo replaces, doesn't concat) ===
  "-C", "target-cpu=native",
  "-C", "force-frame-pointers=yes",
  "--cfg", "tokio_unstable",
  # === Linux-only additions ===
  "-C", "link-arg=-fuse-ld=mold",
  "-Z", "share-generics=y",
  "-Z", "threads=64",
]

[profile.release]
lto = "thin"
codegen-units = 8

# Dev/test profile tuning: the workspace's pain point is incremental rebuilds
# of nativelink-store + its 30+ integration test binaries. Each test binary
# was emitting a 620MB+ ELF with full DWARF, which dominated link wall-clock.
#
# - `debug = "line-tables-only"` keeps backtraces useful (file:line via
#   `addr2line`/eu-stack/panic handlers) but drops type/variable DWARF, the
#   bulk of debug-info weight. Test binaries shrink ~5x on this workspace
#   (620MB -> 122MB observed).
# - `split-debuginfo = "unpacked"` writes debug info into separate `.dwo`
#   files so re-linking doesn't re-pack it into the executable on every edit.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[net]
# cargo's libgit2 cannot auth to gitforge over ssh; builder macs already have
# working system ssh (they pull this repo). Shell out to git for git deps
# (the user/hyper [patch.crates-io] fork). Added 2026-06-11, #15 deploy fix.
git-fetch-with-cli = true
