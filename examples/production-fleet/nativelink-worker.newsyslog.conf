# NativeLink worker log rotation for macOS newsyslog
# Deploy to /etc/newsyslog.d/nativelink-worker.conf on each worker
# newsyslog runs automatically via /System/Library/LaunchDaemons/com.apple.newsyslog.plist
#
# Flags: G = rotate when size exceeded, J = compress with bzip2
# Keeps 5 rotated copies, rotates at 100MB per file
#
# logfilename                                          [owner:group]  mode  count  size(KB)  when  flags [/pid_file] [sig_num]
/Users/user/Library/Logs/nativelink-worker.log         user:staff     644   5      102400    *     GJ
/Users/user/Library/Logs/nativelink-worker.err         user:staff     644   5      102400    *     GJ
