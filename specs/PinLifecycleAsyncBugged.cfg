\* DE-ATOMIZED PinLifecycle, Bugged: Redrive = FALSE.
\* The slow-write completion (stable_digests push) is split from the
\* fast-tier write. A SlowWriteFail with no re-drive leaves the worker's
\* pin with no release path -> permanent leak (FL-688 never-BIS-acked).
\*
\* PrimedDigests = {} disables the cache-hit leak so the ONLY reachable
\* leak is the slow-write-failure gap the original fused atom could not reach.
\*
\* Expected TLC outcome: INVARIANT VIOLATED on NoPermanentPinLeak.
\* Trace: WorkerPinAction(d1) -> WorkerUploadFreshFastOk(d1)
\*        -> SlowWriteFail(d1) -> quiescent with workerPins={d1},
\*           slowState[d1]="Failed" -> CanMakeProgressOnPins = FALSE.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    PrimedDigests = {}
    Redrive = FALSE

INVARIANTS
    TypeOK
    NoPermanentPinLeak

CHECK_DEADLOCK FALSE
