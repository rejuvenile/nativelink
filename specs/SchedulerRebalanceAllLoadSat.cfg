\* A4 DEGENERATE CELL: all-load-saturated (the SECOND predicate fires for
\* every worker) while workers still have P-headroom by dispatch-count. This
\* is the OPPOSITE-corner of all-at-p_count: saturation_fall_through=TRUE (all
\* viable workers load-saturated) forces the cache tiers to decline, so the
\* fallback must dispatch even though the M1 P-gate would have ADMITTED these
\* workers. 2 workers p_count=2 (lots of P-headroom), capacity=2, 2 ops.
\* NoWedge must hold: the load predicate alone must not wedge either.
\* AllowLoadSat=TRUE lets the env drive every worker load-saturated.
\* PCoreCount = {w1:2, w2:2} via PCoreCount_All2.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All2

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded

PROPERTIES
  EventuallyDispatched
