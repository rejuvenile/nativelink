  THRESHOLD = 101
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  BuggedStaleRankOnly = FALSE
  PrefFlat = FALSE
  GateActive = TRUE
  AllowEvict = FALSE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

