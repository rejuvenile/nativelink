\* V4 RANKER — the PURE-STATE ceiling bound I5_Bounded carried over, on a
\* GENUINELY-no-lift topology, checked under the ranker-driven WINNER selection.
\* As V3 established, the pure-state I5_Bounded (Running <= p*FACTOR unconditionally)
\* is FALSIFIED by the Phase-2 no-wedge LIFT, not by the override; so it is checked
\* only where the lift structurally CANNOT fire.
\*
\* HOW THE LIFT IS MADE IMPOSSIBLE (corrected — an earlier attempt using
\* "ops <= override capacity" was WRONG: the StalePLoad adversary can flip a
\* worker's p_load to "busy", revoking its clause-3 override-eligibility and
\* forcing SomeViableHasPHeadroom FALSE => lift => Running past ceiling; that trace
\* is a genuine lift, exactly V3's documented behavior, not a fix bug). The clean
\* fix: THRESHOLD = 101, so PReportedIdle(w) = (p_load_pct < 101) is TRUE for BOTH
\* idle(0) AND busy(100) — override-eligibility no longer depends on the stale
\* p_load at all, only on the fresh ceiling (Running < p*FACTOR). So while ANY
\* viable worker is below its ceiling, it HAS P-headroom (clause 3) =>
\* SomeViableHasPHeadroom stays TRUE => the Phase-1 exclusion NEVER lifts. With
\* 5 ops <= 3 workers * ceiling 2 = 6 override slots, some worker is always below
\* ceiling until all ops placed => no lift is ever needed. The override ceiling
\* (Running < 1*2 = 2) then caps every gated worker => I5_Bounded HOLDS.
\* Capacity = 3 > 2 so the fresh-count ceiling, not the slot cap, binds.
\* AllowEvict = FALSE (an evict+requeue could also manufacture a transient no-
\* headroom fleet => lift; disabled to keep the no-lift guarantee airtight).

SPECIFICATION Spec

