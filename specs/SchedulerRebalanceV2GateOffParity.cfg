\* v2.2 FLAG-OFF parity (design §11 :320 "Flag OFF → byte-identical"). GateOn =
\* FALSE, so FallbackTier(w) is unconditionally 0 → single-tier
\* effective_load_score (loadScore) ordering, byte-identical to today. The
\* I1-STRENGTHENED fallback clause is vacuous when GateOn=FALSE
\* (FallbackDispatchPHeadroomFirst has GateOn in its antecedent), so I1 imposes
\* only the v1 CACHE constraint — as expected (the refinement is inert off).
\* NoWedge + EventuallyDispatched still HOLD (the flag-off fallback is the same
\* ungated single-tier behavior v1 already proved). Heterogeneous fleet, load
\* signals free.
\* AllowEvict=FALSE: this cfg checks the EventuallyDispatched LIVENESS property;
\* the evict adversary is UNFAIR and an unbounded evict loop starves dispatch (a
\* fairness-granularity artifact, not a wedge). Evict is exercised for SAFETY in
\* V2Safety.cfg; isolating liveness requires it off (matches
\* SchedulerRebalanceProgress.cfg).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2"}
  Capacity = 3
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = FALSE
  Fallback = "Soft"
  MaxToggles = 2
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
