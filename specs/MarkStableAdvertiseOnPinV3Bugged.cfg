\* FL-688 V3 — BUGGED: no advertise-on-pin. The durable-BEFORE-pin ordering
\* leaks: worker pins an already-durable D, uploads via the already-durable
\* SKIP (no pusher), never advertises -> stuck pinned at quiescence.
\* Expect: DurableHeldReleasedAtQuiescence VIOLATED.
\*         StableFeedIsDurable HOLDS (durability never weakened, even bugged).
SPECIFICATION Spec
CONSTANTS
    Digests = {d1, d2}
    AdvertiseOnPin = FALSE
INVARIANT TypeOK
INVARIANT StableFeedIsDurable
INVARIANT DurableHeldReleasedAtQuiescence
CHECK_DEADLOCK FALSE
