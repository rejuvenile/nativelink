\* v2 p_load-refinement SAFETY (the FIXED gate). Headline check: the ACTION-TIME
\* ceiling claim I5_BoundedOverride HOLDS under the ADVERSARIAL-STALENESS action.
\* pLoad starts "idle" for every worker and StalePLoad can hold it "idle" forever
\* (stale-low) while Running climbs — the exact red-team R3 / keepalive-lag mode.
\* The override (clause 3) must never ADMIT a gated worker at/over its
\* PCoreCount*FACTOR ceiling.
\*
\* IMPORTANT (invariant-prover finding): the pure-STATE bound I5_Bounded
\* (Running <= p*FACTOR unconditionally) is NOT checked here — it is FALSIFIED by
\* the pre-existing Phase-2 no-wedge LIFT even with the override OFF (v1), NOT by
\* the p_load override. See SchedulerRebalanceV3PLoadThresholdZeroParity (override
\* off, still violates I5_Bounded via lift) and the modelling note in the .tla.
\* The pure-state bound is verified where it IS provable — the no-lift topology
\* SchedulerRebalanceV3PLoadCeilingNoLift.cfg.
\*
\* Topology (design §3): PCoreCount_All1 => override ceiling = 1*2 = 2; Capacity
\* = 3 > 2 so the fresh-count ceiling, not the slot cap, is the binding override
\* limit. 3 ops. THRESHOLD = 50 (idle=0 < 50 <= busy=100) so clause 3 CAN fire.
\* Evict on. AdmitAllThreshold = FALSE, DropCeiling = FALSE (the real mechanism).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 3
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  AllowEvict = TRUE
  MaxToggles = 3
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I5_BoundedOverride
  I1_PHeadroomFirst
  I3_LocalityBounded
