\* GateOnMirror = FALSE: cache positive / Ack happen as soon as the
\* server's fast-tier write succeeds, regardless of mirror state.
\* This is the historic bug at existence_cache_store.rs:334-337 +
\* bytestream_server.rs:1605 (mirror background_spawn!, not awaited).
\*
\* Expected TLC outcome: INVARIANT VIOLATED on AckImpliesTwoReplicas.
\* Trace: FastWriteOk -> AckBazel  (peerMirror still Absent
\*        -> ReplicaCount = 1 -> ack but only 1 replica -> violated).
\*
\* Will also report NoLossyAckCascade violation if FastEvict fires
\* before MirrorWriteOk.

SPECIFICATION Spec

CONSTANTS
    GateOnMirror = FALSE

INVARIANTS
    TypeOK
    AckImpliesTwoReplicasAtAck
    CachePositiveImpliesTwoReplicasAtInsert
    NoLossyAckCascade

CHECK_DEADLOCK FALSE
