\* v2.2 I1-STRENGTHENED, the SIGNAL-DISAGREEMENT case (design §11 :299, the
\* whole point of the refinement). 2 workers, each p_count=1, capacity=2 (an E
\* slot free above p_count). 3 ops > total P-capacity (2), so once both workers
\* hold 1 action they are P-saturated (Tier B) but still have a free E slot; the
\* 3rd op overflows via the fallback. loadScore toggles FREELY and
\* INDEPENDENTLY of dispatch-count, so TLC reaches the state where the
\* would-be-holder (Tier B, no P-headroom) has a LOWER loadScore than a peer
\* that has P-headroom (Tier A) — and I1_PHeadroomFirst asserts the fallback
\* still goes to the Tier-A peer, NOT the lower-load Tier-B holder. This is the
\* property that FAILS against the ungated single-tier fallback and HOLDS with
\* the two-tier preference. No evict; load-sat off to isolate the tier logic.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = FALSE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 4
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
