\* FIX (a): MARGIN-ONLY, at the SWEET SPOT.  Same 2x under-report as the
\* unsafe cfg (Estimate=3, TruePeak=6) but MarginMul=2 -> Reserved = 3*2 = 6
\* = TruePeak exactly.  Ceil=99 (no ceiling).  1 worker, RamCap=16.
\*
\* Because Reserved(a) == TruePeak(a), the reservation refuses EXACTLY when the
\* true peak would overflow: 2 admitted (reserve 12, true 12 <= 16); a 3rd
\* reserves 18 > 16 -> refused, and its true addition (18) would also overflow.
\*
\* EXPECT: NoOOM HOLDS *and* NoIdleWaste HOLDS -- the byte-adaptive margin set
\* to the worst-case under-report factor is both OOM-safe and work-conserving.
\* Required relationship: MarginMul >= max_a (TruePeak(a) / Estimate(a)).

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 99
  MarginMul = 2
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
  NoIdleWaste
