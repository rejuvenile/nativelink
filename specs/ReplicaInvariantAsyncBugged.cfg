\* DE-ATOMIZED ReplicaInvariant, Bugged: GateOnMirror = TRUE (orig mirror
\* fix in place) but GateOnDurable = FALSE (no durable-copy gate). With the
\* peer replica now allowed to evict after ack (PeerEvict), BOTH in-memory
\* replicas can vanish while ack = AckedOk and no durable copy exists.
\*
\* Expected TLC outcome: INVARIANT VIOLATED on NoLossyAckCascade.
\* Trace: FastWriteOk -> MirrorWriteOk -> AckBazel -> FastEvict -> PeerEvict
\*        -> ReplicaCount = 0, slowDurable = "Absent".

SPECIFICATION Spec

CONSTANTS
    GateOnMirror = TRUE
    GateOnDurable = FALSE

INVARIANTS
    TypeOK
    AckImpliesTwoReplicasAtAck
    NoLossyAckCascade

CHECK_DEADLOCK FALSE
