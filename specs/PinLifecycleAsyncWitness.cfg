\* Reachability / non-vacuity witness for the Fixed model (Redrive = TRUE).
\* Runs PinsNeverAllReleased as an INVARIANT expected to VIOLATE: the CE
\* trace IS the proof that the fully-released good state
\* (pendingActionOutputs = {} /\ workerPins = {}) is genuinely reachable,
\* so NoPermanentPinLeak in PinLifecycleAsyncFixed.cfg is not vacuous.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    PrimedDigests = {}
    Redrive = TRUE

INVARIANTS
    TypeOK
    PinsNeverAllReleased

CHECK_DEADLOCK FALSE
