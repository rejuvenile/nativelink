\* WORK-CONSERVATION LOSS from a COUNT-BLIND CEILING under heterogeneity.
\* All 6 actions are SMALL (ColdActions = Actions -> TruePeakCold=2,
\* EstimateCold=1).  MarginMul=1.  The ceiling is sized for a WORST-CASE big
\* peak (Ceil=2, as if max_true_peak ~ 6-8), because a count ceiling is
\* profile-independent and cannot know these actions are small.
\* 1 worker, RamCap=16.
\*
\* The ceiling caps at 2 running (TRUE = 2*2 = 4) even though 6 more small
\* actions would TRULY fit (4 + 2 = 6 <= 16).  The reservation (byte-based)
\* would happily place all 6 (reserve 6 <= 16); the count ceiling strands
\* ~75% of RAM.  This is why the ceiling must be the BACKSTOP, not the primary
\* limiter -- the byte-adaptive reservation is the work-conserving governor.
\*
\* EXPECT: NoOOM HOLDS (4 <= 16) but NoIdleWaste VIOLATED (count ceiling
\* refuses truly-fitting small work).

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {a1, a2, a3, a4, a5, a6}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 2
  EstimateCold = 1
  Ceil = 2
  MarginMul = 1
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
  NoIdleWaste
