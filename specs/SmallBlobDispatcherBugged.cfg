\* Bugged regime: observe_pinned_mirror_ack on each store unconditionally
\* clears every digest in the broadcast ack, regardless of source store_id.
\* Two stores (cas + ac) holding the same digest D1 collide:
\*   1. CAS pushes (cas, D1) and pins.
\*   2. AC pushes (ac, D1) and pins.
\*   3. Worker receives (cas, D1) but NOT (ac, D1) yet.
\*   4. Worker acks { (cas, D1) }.
\*   5. Buggy fan-out clears D1 from BOTH cas + ac pin sets.
\*   6. Now (ac, D1) is gone from serverPins[ac] without (ac, D1) ever
\*      having been acked by the worker.
\*
\* Expected TLC outcome: INVARIANT VIOLATED on NoCrossStoreLeak.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1}
    Stores = {cas, ac}
    FixOptionF = FALSE

INVARIANTS
    TypeOK
    NoCrossStoreLeak

CONSTRAINT
    StateConstraint

CHECK_DEADLOCK FALSE
