\* BugMode = FALSE: direct-merge design (the shipped #98 implementation).
\* Each chunk independently registers its hints into the locality map
\* via DeliverChunk. The action's gate is "actionState = Pending" with
\* no chunk dependency; WF_vars(FinishAction) guarantees it eventually
\* fires regardless of chunk-arrival vs InstallWait interleavings.
\*
\* Models the production code at:
\*   nativelink-worker/src/local_worker.rs:760-820 (handle_peer_hints_chunk)
\*   nativelink-scheduler/src/api_worker_scheduler.rs (emit_peer_hints_chunks)
\*
\* Expected TLC outcome:
\*   * NO invariant violation (TypeOK + LocalityMapSubsetOfDelivered hold).
\*   * NO temporal-property violation: ActionEventuallyDone holds on
\*     every behavior — the action always reaches Done.

SPECIFICATION Spec

CONSTANTS
    NumChunks = 3
    BugMode = FALSE

INVARIANTS
    TypeOK
    LocalityMapSubsetOfDelivered

PROPERTIES
    ActionEventuallyDone

\* CHECK_DEADLOCK = FALSE because the legitimate terminal state
\* (actionState = "Done" with all chunks delivered + merged) has no
\* successor by design; TLC would otherwise report it as a deadlock.
\* The temporal property already enforces forward progress.
CHECK_DEADLOCK FALSE
