\* THE CEILING IS MANDATORY (security S-2: the ceiling is the UNDER-report/OOM
\* defense, distinct from the ingest clamp).  The margin is set assuming a 2x
\* under-report (MarginMul=2) but reality is WORSE -- a 3x under-report
\* (Estimate=3, TruePeak=9).  Ceil=99 (no ceiling backstop).  1 worker, RamCap=16.
\*
\* Reserved = 3*2 = 6 < TruePeak = 9.  The reservation admits 2 (reserve 12 <=
\* 16) -> TRUE = 2*9 = 18 > 16 -> OOM.  The margin's under-report ASSUMPTION was
\* exceeded and, with no ceiling, nothing catches it.  Because the between-poll
\* under-bias factor is itself an ESTIMATE (the measurement cannot bound its own
\* worst-case miss), a margin alone is never sufficient.
\*
\* EXPECT: NoOOM VIOLATED at depth 2 -- a margin sized to a guessed factor OOMs
\* when the true factor is larger; the profile-INDEPENDENT ceiling is required.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 9
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 99
  MarginMul = 2
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
