\* BugMode = FALSE: post-fix-up-2 bookkeeping.
\* The merge-success branch reads CURRENT totalAccumulated (not the
\* prev_total snapshot taken before the token-mismatch wipe). All wipes
\* are preserved.
\*
\* Expected TLC outcome:
\*   * INVARIANTS HOLD (TypeOK, TotalAccumulatedConsistency,
\*     ErrBranchPreservesOtherBroadcasts).
\*   * NO temporal property -- this is purely a safety check.
\*
\* CHECK_DEADLOCK = FALSE because once the broadcasts map is empty and
\* DropAllInflight is the only enabled action with no progress effect,
\* TLC would otherwise flag deadlock on a pure-safety spec.

SPECIFICATION Spec

CONSTANTS
    NumBroadcasts = 2
    MaxEntriesPerChunk = 2
    MaxEntriesPerBroadcast = 4
    BugMode = FALSE

INVARIANTS
    TypeOK
    TotalAccumulatedConsistency
    ErrBranchPreservesOtherBroadcasts

CONSTRAINT
    StateConstraint

CHECK_DEADLOCK FALSE
