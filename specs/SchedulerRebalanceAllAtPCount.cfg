\* A4 DEGENERATE CELL: all-at-p_count. 2 workers each p_count=1, 2 ops.
\* Once both ops dispatch (one per worker), EVERY worker is at exactly its
\* p_count => NO worker has P-headroom => Phase-2 lift MUST fire so a later
\* dispatch (after a completion frees a slot, or via fallback onto an E core)
\* still proceeds. Capacity=2 > p_count so a worker CAN physically take a 2nd
\* action in Phase 2 — the exact "P-gated but slot-free" cell.
\* Load-saturation toggles independently (A4). NoWedge must hold in every
\* joint state, incl. all-at-p_count-but-not-load-saturated.
\* PCoreCount = {w1:1, w2:1} via PCoreCount_All1.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
