\* Fixed regime: per Option F (decision #6). observe_pinned_mirror_ack
\* on each store filters by self.store_id via binary search over the
\* sorted-by-store_id ack vector. A pin (ac, D1) is only released by
\* an ack containing (ac, D1) — never by an ack containing only
\* (cas, D1).
\*
\* Expected TLC outcome: NO invariant violation.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1}
    Stores = {cas, ac}
    FixOptionF = TRUE

INVARIANTS
    TypeOK
    NoCrossStoreLeak

CONSTRAINT
    StateConstraint

CHECK_DEADLOCK FALSE
