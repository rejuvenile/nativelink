\* v2 p_load-refinement LIVENESS / PROGRESS (I2 no-wedge). No adversarial evict
\* so the pure gate progress is isolated, BUT the stale-p_load adversary flips
\* freely (bounded by MaxToggles for the fairness artifact). Every Queued op must
\* still eventually dispatch across every reachable (widened-gate × stale-p_load)
\* state. 3 workers (incl p_count 0) / 2 ops / capacity 3. THRESHOLD=50, FACTOR=2.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2"}
  Capacity = 3
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  AllowEvict = FALSE
  MaxToggles = 2
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I5_BoundedOverride
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
