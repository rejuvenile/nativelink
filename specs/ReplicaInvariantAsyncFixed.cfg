\* DE-ATOMIZED ReplicaInvariant, Fixed: GateOnDurable = TRUE. AckBazel
\* additionally requires the non-evictable durable copy (slow-tier +
\* BIS-ack). Even if both in-memory replicas evict after ack, the durable
\* copy remains -> the blob is always recoverable.
\*
\* Expected TLC outcome: NO invariant violation.

SPECIFICATION Spec

CONSTANTS
    GateOnMirror = TRUE
    GateOnDurable = TRUE

INVARIANTS
    TypeOK
    AckImpliesTwoReplicasAtAck
    NoLossyAckCascade

CHECK_DEADLOCK FALSE
