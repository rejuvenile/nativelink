\* TEETH-B part 1 — BuggedPrefIgnoresFreshCount, I6 side. PrefFlat = TRUE sets
\* the override pref = 1 FLAT (drops the `+(Running-PCoreCount)` fresh-count term
\* from design §12.1). QUESTION: does I6 still hold? EXPECTED: YES — the TIER
\* SEPARATION alone (genuine-free = pref 0, override = pref 1, none = MAXPREF)
\* orders free STRICTLY before override, and I6 is exactly the free-vs-override
\* ordering. The fresh-count term is about intra-override-tier DECAY (bounding
\* duration-of-preference WITHIN the override tier), NOT the free-vs-override
\* ordering. So I6_RankerConsistency should HOLD even with the term dropped.
\* This cfg CONFIRMS the fresh-count term is NOT load-bearing for I6.
