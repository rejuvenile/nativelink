\* ChunkRaceWriter.cfg — TLC config for #494-v3 Phase 2 chunk-race protocol.
\*
\* Small state space: 2 writers × 2 chunks, with both pwrite-fail and
\* runner-cancel branches enabled. Should explore ~10K-100K distinct states.
\* Expected outcome: ALL safety AND liveness properties hold.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruption
    NoPermanentWedge
    RegistryHygieneNoNewAttach

PROPERTIES
    Termination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry

CHECK_DEADLOCK FALSE
