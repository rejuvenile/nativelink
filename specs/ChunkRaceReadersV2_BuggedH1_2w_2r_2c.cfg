\* ChunkRaceReadersV2_BuggedH1_2w_2r_2c.cfg — H1 hazard variant at 2w/2r/2c.
\* Verifies the H1 detection works under multi-writer + multi-reader load.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Readers = {r1, r2}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = FALSE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruptionWriter
    NoPermanentWedge
    NoPartialReadAsCanonical
    NoCorruptionViaReader
    NoFalsePositiveExistenceCanonical
    NoActiveWriterInvisibleToReader
    InFlightSetMembershipConsistency
    EvictingMapImpliesPublishOk

PROPERTIES
    WriterTermination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ReaderProgress
    StartedReadersTerminate
    NoReaderInducedWriterStuck
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry
    EvictingMapMonotonic

CHECK_DEADLOCK FALSE
