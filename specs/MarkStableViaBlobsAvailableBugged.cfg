\* Pre-#140 architecture (the lost-eviction race documented in
\* .claude/audits/task-139-lost-eviction/audit.md Path 2).
\* Worker writes d, evicts d under cache pressure (Evict msg sent),
\* then ExecuteResponse (Register msg) follows. mpsc::channel(1)
\* concurrent senders -> non-deterministic interleaving. When Evict
\* arrives BEFORE Register, the evict no-ops (locality didn't have d
\* yet) and Register then adds d, leaving locality permanently stale.
\*
\* Expected TLC outcome: INVARIANT VIOLATED on NoLostEvictionRace.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    FixV140 = FALSE

INVARIANTS
    TypeOK
    NoLostEvictionRace
    EveryPinReachesRelease

