\* TEETH (I1-STRENGTHENED bites): Fallback = "UngatedSingleTier" — the AS-BUILT
\* M1 fallback (ranked by loadScore ONLY, NO tier preference) with the gate ON.
\* This is the exact red-team RECONSIDER-PREMISE gap the v2.2 refinement closes
\* (design §11 :302-306): the overflow is chosen by STALE p_load and is NOT
\* steered to a P-headroom worker.
\*
\* Same DISAGREEMENT fleet as SchedulerRebalanceV2Disagree.cfg (2 workers
\* p_count=1, cap=2, 3 ops, load-sat + load-score free). The reachable
\* disagreement state: a P-saturated Tier-B holder with a LOWER loadScore than a
\* P-headroom Tier-A peer, cache tiers declined → fallback path. With the
\* ungated single-tier ranking the overflow goes to the LOWER-LOAD Tier-B holder
\* → I1_PHeadroomFirst VIOLATED (a fallback dispatch to a no-P-headroom worker
\* while an eligible P-headroom peer exists). EXPECT: I1_PHeadroomFirst violated.
\* The Disagree cfg (Fallback="Soft", identical fleet) HOLDS I1 — that contrast
\* proves the two-tier PREFERENCE is what strengthens I1 onto the overflow path.
\* NoWedge still HOLDS here (ungated single-tier never wedges — it is the SOFT
\* eligibility set); only I1 breaks.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "UngatedSingleTier"
  MaxToggles = 4
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
