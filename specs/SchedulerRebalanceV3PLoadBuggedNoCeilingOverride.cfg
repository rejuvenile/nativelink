\* TEETH (action-time) — proves the PROVABLE headline invariant I5_BoundedOverride
\* has teeth, not just the falsifiable state form. Same bug as BuggedNoCeiling
\* (DropCeiling = TRUE), but the pure-state I5_Bounded is REMOVED from the check
\* so TLC reaches the temporal-property phase and reports I5_BoundedOverride
\* directly. Under stale-idle p_load with the ceiling gone, a Phase-1 cache admit
\* lands on w1 when Running(w1) = 2 (>= PCoreCount*FACTOR = 2), so the override
\* admitted a worker at/over its ceiling => I5_BoundedOverride MUST be VIOLATED.
\* This confirms the action-time bound (the one that isolates the override's
\* contribution from the Phase-2 lift) genuinely bites on the ceiling-drop bug.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 3
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = TRUE
  AllowEvict = FALSE
  MaxToggles = 1
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty

PROPERTIES
  I5_BoundedOverride
