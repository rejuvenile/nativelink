\* ChunkRaceReadersV2Fixed.cfg — verify-tla canonical Fixed config.
\*
\* Smallest interesting case: 1 writer x 1 reader x 2 chunks, post-fix
\* (WriterRegistersInFlight=TRUE) so the v2 writer is observable to the
\* reader's has() cascade. All writer failure modes ON.
\* Expected: ALL safety AND liveness properties hold (verify_tla.sh
\* classifies *Fixed.cfg → must run clean).
\*
\* The historic `ChunkRaceReadersV2.cfg` (without the Fixed suffix) is
\* retained as the smallest-case informational config. Larger informational
\* configs (`*_NwMrXc.cfg`) explore additional state-space; they may
\* exceed the 300 s gate timeout — that is acceptable for informational
\* runs but they cannot serve as the Layer-1 Fixed proof.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1}
    Readers = {r1}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruptionWriter
    NoPermanentWedge
    NoPartialReadAsCanonical
    NoCorruptionViaReader
    NoFalsePositiveExistenceCanonical
    PostFixNoActiveWriterInvisibleToReader
    InFlightSetMembershipConsistency
    EvictingMapImpliesPublishOk

PROPERTIES
    WriterTermination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ReaderProgress
    StartedReadersTerminate
    EventualConsistencyStrong
    NoReaderInducedWriterStuck
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry
    EvictingMapMonotonic

CHECK_DEADLOCK FALSE
