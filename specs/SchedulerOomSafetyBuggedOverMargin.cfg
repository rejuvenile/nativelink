\* WORK-CONSERVATION LOSS from OVER-RESERVING.  Same 2x under-report
\* (Estimate=3, TruePeak=6) but MarginMul=3 -> Reserved = 9 > TruePeak = 6.
\* Ceil=99.  1 worker, RamCap=16.  This is NoOOM-safe but too conservative:
\* the reservation admits only 1 (reserve 9; a 2nd reserves 18 > 16), leaving
\* the worker at TRUE=6 on a 16-RAM worker with 5 queued actions each of which
\* would TRULY fit (6+6=12 <= 16).  Capacity stranded -> the E-core-spill goal
\* is defeated (the tension the task asks to characterize).
\*
\* EXPECT: NoOOM HOLDS but NoIdleWaste VIOLATED -- over-margin buys OOM-safety
\* by refusing work that genuinely fits.  The safe operating point is
\* MarginMul == the worst-case under-report factor, NOT higher.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 99
  MarginMul = 3
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
  NoIdleWaste
