\* ChunkRaceWriter_2w3c.cfg — TLC config: 2 writers x 3 chunks.
\* Larger state space with full failure modes enabled.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Chunks = {c0, c1, c2}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruption
    NoPermanentWedge
    RegistryHygieneNoNewAttach

PROPERTIES
    Termination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry

CHECK_DEADLOCK FALSE
