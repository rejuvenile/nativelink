\* ThresholdZeroParity — the DEFAULT-NO-OP proof (design §4). With THRESHOLD = 0
\* (the production default p_idle_threshold_pct = 0), PReportedIdle(w) is
\* (PLoadPct < 0), which is FALSE for BOTH idle(=0) and busy(=100) — so clause 3
\* NEVER fires. The v2 gate collapses to the v1 gate EXACTLY. ThresholdZeroParity
\* asserts HasPHeadroom(w) = HasPHeadroom_v1(w) in every reachable state, proving
\* stuttering-equivalent gate behavior => landing the code changes NOTHING until
\* an operator sets a nonzero threshold. Full adversary on (evict + stale-p_load)
\* so parity is checked across the whole reachable state space, not just the
\* happy path. AdmitAllThreshold = FALSE, DropCeiling = FALSE (real gate).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 3
  THRESHOLD = 0
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  AllowEvict = TRUE
  MaxToggles = 3
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  ThresholdZeroParity
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I5_BoundedOverride
  I1_PHeadroomFirst
  I3_LocalityBounded
