\* ChunkRaceWriter_3w2c.cfg — TLC config: 3 writers x 2 chunks.
\* Tests cross-writer race scenarios with three concurrent writers.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2, w3}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruption
    NoPermanentWedge
    RegistryHygieneNoNewAttach

PROPERTIES
    Termination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry

CHECK_DEADLOCK FALSE
