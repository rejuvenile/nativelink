\* BugMode = FALSE: drain-and-retry observes a per-digest retry
\* budget (MaxRetries). Once exceeded, the digest is dropped to a
\* dead-letter queue (modeled by droppedAfterMaxRetries) instead
\* of being re-spawned. This is a HYPOTHETICAL convergence
\* mechanism — production today has no such bound.
\*
\* Expected TLC outcome: NO invariant violation; LIVENESS property
\* `EventuallyConverges` holds. Under persistent failure the retry
\* loop runs at most MaxRetries times, then dead-letters; under
\* eventual success the loop converges naturally.
\*
\* MaxRetries = 2 keeps the model bounded without hiding the
\* convergence shape.

SPECIFICATION Spec

CONSTANTS
    MaxRetries = 2
    BugMode = FALSE

INVARIANTS
    TypeOK
    RetryCountIsBoundedUnderFix
    NoReinsertAfterAckAndUnpin

PROPERTIES
    EventuallyConverges

CHECK_DEADLOCK FALSE
