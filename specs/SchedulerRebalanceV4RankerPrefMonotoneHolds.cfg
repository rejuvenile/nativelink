\* PrefMonotone under the FIXED ranker (fresh-count term PRESENT). The control for
\* PrefFlatMonotoneFails: SAME topology (2 workers, p=2, ceiling 4, 5 ops) so the
\* antecedent "two override workers at distinct Running, same p_count" IS reached
\* (w1 override@Running=3, w2 override@Running=2). With the `+(Running-PCoreCount)`
\* term IN, pref = 1+(Running-PCoreCount) is STRICTLY increasing in Running:
\* pref(w2)=1+(2-2)=1 < pref(w1)=1+(3-2)=2 => PrefMonotone HOLDS. Paired with
\* PrefFlatMonotoneFails (same topology, term dropped => both prefs 1 => VIOLATED)
\* this WITH/WITHOUT pair establishes the fresh-count term is LOAD-BEARING for
\* PrefMonotone (the design §12.1 duration-of-preference decay), NOT belt-and-
\* suspenders. Also checks I6 still HOLDS with the fresh-count term (it does — I6
\* is the tier gap, orthogonal to the intra-tier decay).

