\* Two-worker replication of the unsafe cfg -- the OOM is a PER-WORKER property.
\* Same knobs as SchedulerOomSafetyBuggedNoMarginNoCeiling.cfg but Workers =
\* {w1, w2}.  Actions distribute across workers; the OOM still needs 3 profiled
\* actions co-resident on ONE worker (3*6 = 18 > 16).  Confirms the violation is
\* not a single-worker artifact and the reservation is per-worker.
\*
\* EXPECT: NoOOM VIOLATED (some worker reaches TrueUsed = 18 > 16).

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 99
  MarginMul = 1
  Floor = 2

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
