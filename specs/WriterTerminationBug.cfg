\* Producer's failure branch may omit send_error (historic bug at
\* fast_slow_store.rs:2912 and 4 sibling sites pre-WriteHalfGuard fix).
\* Expected TLC outcome:
\*   * Deadlock detected (CHECK_DEADLOCK = TRUE).
\*   * INVARIANT VIOLATED on JoinAlwaysCompletes:
\*       producer = "DoneBuggy" /\ channel = "Open" /\ consumer = "Recv"
\*       /\ join = "Joining" -> stuck forever.
\*   * Trace will show ProducerStart -> ProducerFailWithoutSendError ->
\*     [no enabled action for consumer or join].

SPECIFICATION Spec

CONSTANTS
    BugMode = TRUE

INVARIANTS
    TypeOK
    JoinAlwaysCompletes

\* CHECK_DEADLOCK = TRUE here so TLC ALSO reports the stuck state as
\* a deadlock (in addition to the JoinAlwaysCompletes invariant
\* violation). The deadlock signal is the most direct mapping to the
\* production symptom: the wrapping VerifyStore::get_part call hangs
\* forever because tokio::join! waits for both futures to complete.
\* Note: TLC will report the bug via *whichever check fires first*
\* in BFS — practically the invariant violation appears first.
CHECK_DEADLOCK TRUE
