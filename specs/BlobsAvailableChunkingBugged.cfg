\* BugMode = TRUE: per-chunk wipe (Path B / hypothetical pre-#99 bug).
\* Models a server that calls remove_endpoint + apply on every chunk
\* instead of waiting for is_last=true. Under DropConnection mid-
\* broadcast, serverView retains a strict-subset partial assembled
\* from chunks 0..k where k < NumChunks-1 -- the half-applied snapshot.
\*
\* Expected TLC outcome:
\*   * INVARIANT VIOLATED on LocalityMapMatchesEndpointOrPriorFull.
\*   * Trace: DeliverChunk(0) (serverView grows to {0}) ->
\*     DropConnection (no terminal yet, but Path-B already mutated
\*     serverView) -> serverView is {0}, NOT WorkerSnapshot {0,1,2}
\*     and NOT {} -- INVARIANT VIOLATED.
\*
\* CHECK_DEADLOCK = FALSE; we want the invariant violation to
\* surface the bug rather than a deadlock report.

SPECIFICATION Spec

CONSTANTS
    NumChunks = 3
    BugMode = TRUE

INVARIANTS
    TypeOK
    LocalityMapMatchesEndpointOrPriorFull

CHECK_DEADLOCK FALSE
