\* v2.2 LIVENESS / no-wedge (I2) under the SOFT fallback. The load-bearing
\* re-proof: every Queued op must eventually dispatch across every joint
\* (P-gate × load-sat × stale-load-score) state — the soft preference NEVER
\* excludes, so a fully-saturated fleet still dispatches (Tier B). No
\* adversarial evict (isolate pure gate progress); load-sat + load-score toggle
\* freely. 3 heterogeneous workers (incl p_count 0) / 2 ops / capacity 3.
\* PCoreCount = {w1:1, w2:2, w3:0}.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2"}
  Capacity = 3
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 2
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
