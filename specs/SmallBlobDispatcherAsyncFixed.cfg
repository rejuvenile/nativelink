\* FIXED: advertise-only-after-durable.
\* AdvertiseOnlyDurable = TRUE => WorkerSendAck advertises ONLY workerMirror
\* (durable entries). The server releases the EphemeralServerSidePin only on
\* a durable advertisement, so an unpinned delivered blob is always durable.
\* A failed durable write is never advertised, so the server keeps the pin
\* (correct backpressure).
\*
\* Expected TLC outcome: NO invariant violation.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    Stores = {s1}
    AdvertiseOnlyDurable = TRUE

INVARIANTS
    TypeOK
    DurableBeforeUnpin
    NoUnpinnedLostBlob

CONSTRAINT StateConstraint

CHECK_DEADLOCK FALSE
