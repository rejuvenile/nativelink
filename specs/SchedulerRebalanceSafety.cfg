\* M1 SAFETY check: heterogeneous fleet, adversary evict + INDEPENDENT
\* load-saturation toggle (A4 second predicate) both ENABLED.
\* 3 workers with DIFFERENT p_core_counts INCLUDING a 0 (A5 guard) / 2 ops.
\* Capacity 3 > max p_count so the P-gate (not the slot cap) is the binding
\* limit in Phase 1 — models "E cores still free above p_count".
\* Exhaustively checks I1 / I3 / I4 / I5 + capacity + evicted-empty + no-wedge
\* across the full cache∥fallback∥evict∥load-toggle interleaving.
\* PCoreCount = {w1:1, w2:2, w3:0} via PCoreCount_Het.

SPECIFICATION Spec

