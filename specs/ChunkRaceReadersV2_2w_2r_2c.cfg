\* ChunkRaceReadersV2_2w_2r_2c.cfg — TLC config: 2 writers x 2 readers x 2 chunks.
\*
\* Production-realistic concurrent-readers-vs-writers scenario, post-fix
\* variant. State space: ~30k-100k distinct states expected. All writer
\* failure modes ON. Verifies the SAME safety + liveness properties as
\* the smallest config.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Readers = {r1, r2}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruptionWriter
    NoPermanentWedge
    NoPartialReadAsCanonical
    NoCorruptionViaReader
    NoFalsePositiveExistenceCanonical
    PostFixNoActiveWriterInvisibleToReader
    InFlightSetMembershipConsistency
    EvictingMapImpliesPublishOk

PROPERTIES
    WriterTermination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ReaderProgress
    StartedReadersTerminate
    EventualConsistencyStrong
    NoReaderInducedWriterStuck
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry
    EvictingMapMonotonic

CHECK_DEADLOCK FALSE
