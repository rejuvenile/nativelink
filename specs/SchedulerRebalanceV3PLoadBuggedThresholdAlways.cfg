\* TEETH — BuggedThresholdAlways (design §8). The threshold is set so high it
\* admits EVERYTHING (AdmitAllThreshold = TRUE: PReportedIdle(w) is TRUE for every
\* worker regardless of its reported p_load — even a BUSY-reported, P-saturated
\* worker qualifies for the override). Combined with the ceiling ALSO dropped
\* (DropCeiling = TRUE) this is the maximally-broken form: clause 3 == TRUE, so
\* HasPHeadroom == TRUE unconditionally — the override admits every worker to any
\* depth. I5_Bounded MUST be VIOLATED (Running reaches Capacity = 3 > 2).
\*
\* NOTE (invariant-prover finding, verified by the companion cfg
\* SchedulerRebalanceV3PLoadThresholdAll8Ceiling.cfg): AdmitAllThreshold=TRUE
\* with the CEILING INTACT does NOT by itself break I5_Bounded — the ceiling
\* still bounds Running at PCoreCount*FACTOR. Admit-all-threshold alone
\* re-concentrates CPU-BOUND work (the *who* restriction is gone) but stays
\* BOUNDED; it is the CEILING that provides the freshness bound. So the design
\* §8 phrasing "threshold-always MUST violate I5_Bounded too" is only literally
\* true when the override is fully defeated (threshold guard AND ceiling both
\* gone), which this cfg models. The single-constant-necessity split is:
\*   - threshold guards WHO gets the override (idle-P only) — necessity shown by
\*     admitting busy workers, NOT by an I5_Bounded break;
\*   - ceiling guards HOW MUCH under staleness — necessity shown by the
\*     I5_Bounded break (BuggedNoCeiling).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 3
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = TRUE
  DropCeiling = TRUE
  AllowEvict = FALSE
  MaxToggles = 1
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I5_Bounded
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty

PROPERTIES
  I5_BoundedOverride
