\* StreamingBlobReadDuringWriteFixed.cfg — post-#500 + post-#502 composition.
\*
\* Smallest interesting case: 1 writer x 2 readers x 2 chunks. The writer
\* may take any of {full-ok, short-ok, send_error, drop-without-eof}; the
\* read side is post-fix (ShortShieldOn = SilentZeroPropOn = TRUE).
\*
\* SAFETY claim shape (post-revision honesty):
\*   The spec now models the per-RPC tokio::select! arm-ordering race
\*   that #500 left open as "one of multiple candidate mechanisms"
\*   (`bytestream_server.rs:1856-1866` + commit ee13bee0 message). This
\*   makes the strong "no Silent* under post-fix" claim INVALID as a
\*   STATE invariant — a reader can observe terminal=Err BEFORE the
\*   `SeamBObservesProducerErr` action fires, reaching DoneSilent*.
\*
\*   Consequence: this cfg's INVARIANTS list does NOT include the
\*   composite "no silent" invariants. Instead it lists:
\*     - structural invariants (TypeOK, bounds, cursor sanity)
\*     - implication-form invariants whose antecedent is not about
\*       Silent* (ReaderOkImpliesWriterFullOk, etc.)
\*     - the leads-to PROPERTY
\*       `PostFixErrPropagationReachesReaderEventually` which asserts
\*       that under fairness, Seam B propagation does occur.
\*
\*   The race-loser case is the spec's honest depiction of the
\*   residual production race. Closing it requires a 4th-candidate
\*   production change tracked separately from this spec.

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = TRUE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    CursorBoundedByChunkCount
    NoCorruptBytesToReader
    ReaderOkImpliesWriterFullOk
    PostFixFullOkReachesReaderAsOk
    CursorAtMostChunkCountAtTerminal

PROPERTIES
    WriterEventuallyTerminates
    ReadersEventuallyTerminate
    EventualConsistencyOkFull
    NoEternalParkAfterWriterDone
    PostFixErrPropagationReachesReaderEventually

CHECK_DEADLOCK FALSE
