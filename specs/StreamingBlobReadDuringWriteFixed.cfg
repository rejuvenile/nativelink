\* StreamingBlobReadDuringWriteFixed.cfg — post-#500 + post-#502 composition.
\*
\* Smallest interesting case: 1 writer x 2 readers x 2 chunks. The writer
\* may take any of {full-ok, short-ok, send_error, drop-without-eof}; the
\* read side is post-fix (ShortShieldOn = SilentZeroPropOn = TRUE).
\* Expected: all safety invariants hold and all liveness properties hold.

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = TRUE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    BytesWrittenMatchesChunkCount
    CursorBoundedByChunkCount
    NoSilentZeroToReader
    NoSilentShortToReader
    NoCorruptBytesToReader
    PostFixReaderOutcomeIsTwoWay
    ReaderOkImpliesWriterFullOk
    PostFixErrPropagationReachesReader
    PostFixFullOkReachesReaderAsOk
    CursorAtMostChunkCountAtTerminal

PROPERTIES
    WriterEventuallyTerminates
    ReadersEventuallyTerminate
    EventualConsistencyOkFull
    NoEternalParkAfterWriterDone

CHECK_DEADLOCK FALSE
