\* ChunkRaceReadersBuggedH3.cfg — H3 #247-stale-negative variant (legacy
\* informational config; same content as the canonical
\* ChunkRaceReadersBuggedH3Bugged.cfg).
\*
\* Models the case where evicting_map.insert NEVER fires after PublishOk
\* (the H3 #247 hazard). EvictingMapInsert is removed from Next.
\* WriterRegistersInFlight=TRUE so the read-side cascade can fall back to
\* the in-flight set during the write — but after writer terminates,
\* the in-flight set clears and a fresh reader sees None.
\*
\* Expected: H3HazardStateUnreachable VIOLATED (reachable state with
\* commitResult=Ok, in-flight cleared, evictingMap=FALSE). And/or the
\* EventualConsistencyStrong property fails: a reader started in this
\* state never reaches ReaderDoneBytes — it concludes NotFound.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1}
    Readers = {r1}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = TRUE

INVARIANTS
    TypeOK
    H3HazardStateUnreachable

PROPERTIES
    EventualConsistencyStrong

CHECK_DEADLOCK FALSE
