\* BugMode = FALSE: wrapper has explicit override for the
\* trait's drain_stable_digests / stable_notify / pin_digests /
\* drain_failed_digests methods. Models e.g. verify_store.rs:428-441
\* and existence_cache_store.rs:565-578.
\*
\* Equivalently models the in-flight C+D refactor (see
\* worktree-agent-aea1038e: StableDigestDelegation) which removes
\* the trait-level default and forces every wrapper to declare its
\* delegation strategy at the type level.
\*
\* Expected TLC outcome: NO invariant violation. The leaf's stable
\* digests reach the broadcast loop, which broadcasts them to the
\* workers; the worker receives the BIS and unpins. Liveness
\* property `EventuallyWorkerUnpinned` holds.

SPECIFICATION Spec

CONSTANTS
    BugMode = FALSE

INVARIANTS
    TypeOK
    BroadcastSeesEveryLeafProduction
    BugMatchesWrapperDelegation

