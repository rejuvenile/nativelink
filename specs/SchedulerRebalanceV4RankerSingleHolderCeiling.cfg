\* (design §13 Refinement 2) SINGLE-HOLDER, CEILING INTACT — the honest-coverage
\* prove the FIRST ranker prove skipped. Exactly ONE worker holds the hot root
\* (RootHolders = {"w1"}), and it is driven OVER its p_count to become an
\* override-admit. The free-slot peers (w2, w3) exist and have free slots but do
\* NOT hold the root, so they are NEVER cache-eligible for the same-root dispatch.
\*
\* CLAIM being proven:
\*   1. I6_RankerConsistency is VACUOUSLY satisfied (holds, but its antecedent
\*      "some ELIGIBLE worker has a genuine free slot" never fires — witnessed by
\*      NoFreeSlotEverCacheEligible holding: no cache-eligible worker ever has a
\*      free slot, i.e. the eligible set is always the sole override-admit holder).
\*   2. I5_Bounded (pure-state) + I5_BoundedOverride (action-time) are the
\*      GOVERNING bounds and HOLD — the sole holder is CAPPED at p_count*FACTOR
\*      (= 1*2 = 2), NOT unbounded. Once w1 hits Running=2 it loses clause-3
\*      headroom, the cache regime finds no eligible holder, and overflow spills
\*      to the free-slot peers via the ungated LRU fallback (correct production
\*      behavior). So I5_Bounded HOLDS: w1 is ceiling-braked at 2.
\*
\* TOPOLOGY (mirrors CeilingNoLift's no-lift discipline so the cache regime always
\* routes to the sole holder while it is below ceiling):
\*   THRESHOLD = 101  => PReportedIdle TRUE for idle(0) AND busy(100), so
\*     override-eligibility depends ONLY on the fresh ceiling, never on stale
\*     p_load => no stale-p_load-driven lift can perturb the single-holder routing.
\*   FACTOR = 2, PCoreCount_All1 => w1's ceiling = 1*2 = 2.
\*   Capacity = 5 > ceiling 2 => the FRESH-count ceiling, not the slot cap, is the
\*     binding limit on w1 (and, for the teeth cfg, leaves room for Running to
\*     climb past 2 to expose unboundedness).
\*   4 ops > 2 (w1's ceiling) => there is genuine PRESSURE for w1 to exceed its
\*     ceiling; the overflow (ops 3,4) must spill to the non-holder peers, proving
\*     the ceiling truly binds rather than there simply being too little work.
\*   AllowEvict = FALSE => no evict/requeue can manufacture a transient lift.

