\* v2 p_load-refinement SAFETY on a HETEROGENEOUS fleet (incl a p_count=0 A5
\* worker and a p_count=2 worker). Confirms I5_Bounded + carry-overs under the
\* widened predicate with mixed core counts. PCoreCount_Het = {w1:1, w2:2, w3:0}.
\* Per-worker ceilings: w1 -> 2, w2 -> 4, w3 -> A5 ungated (covered by
\* CapacityRespected, exempted from I5_Bounded). Capacity = 5 > max gated
\* ceiling (4) so the fresh count, not the slot cap, binds on w2. 4 ops. Full
\* adversary: evict + stale-p_load, THRESHOLD=50, FACTOR=2, real mechanism.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3", "o4"}
  Capacity = 5
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  AllowEvict = TRUE
  MaxToggles = 3
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I5_BoundedOverride
  I1_PHeadroomFirst
  I3_LocalityBounded
