\* TEETH: Bug = NoPHeadroomGate — the M1 P-headroom conjunct is dropped from
\* the cache-tier viability. EXPECT I1_PHeadroomFirst / I3_LocalityBounded
\* VIOLATED: the cache tier lands an op on a P-full worker while a distinct
\* viable worker still has P-headroom (the G3 sole-holder over-concentration).
\* 2 workers p_count=1, capacity=2 (so a worker can be P-full but slot-free),
\* 2 ops. No evict / no load-sat needed to expose it.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = FALSE
  MaxToggles = 0
  Bug = "NoPHeadroomGate"
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
