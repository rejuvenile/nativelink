\* DE-ATOMIZED Ccs pin/gate/evict, Fixed: AtomicPin = TRUE. Insert pins the
\* slot atomically (pin_digests holds a guard so it is never evictable while
\* the durability window is open) -> pinPending stays 0 -> no evict-before-pin.
\* Expected: NO invariant violation.
SPECIFICATION Spec
CONSTANTS
    MaxSlots = 2
    Writers = {w1}
    WritesPerWriter = 2
    AtomicPin = TRUE
INVARIANTS
    TypeOK
    NoLostDurabilityWindow
CHECK_DEADLOCK FALSE
