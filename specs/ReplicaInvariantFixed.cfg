\* GateOnMirror = TRUE: cache positive AND Ack require BOTH fast-tier
\* and mirror writes to complete (MirrorGateStore design A in the
\* invariant doc, or try_join! in FastSlowStore::update design B).
\*
\* Expected TLC outcome: NO invariant violation.

SPECIFICATION Spec

CONSTANTS
    GateOnMirror = TRUE

INVARIANTS
    TypeOK
    AckImpliesTwoReplicasAtAck
    CachePositiveImpliesTwoReplicasAtInsert
    NoLossyAckCascade

CHECK_DEADLOCK FALSE
