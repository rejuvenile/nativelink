\* DEDUP check. 3 clients over 2 keys, mixed cacheable/uncacheable, with
\* completion (key-mapping removal) interleaved. Exhaustively checks that
\* same-key cacheable clients share one op, uncacheable clients stay
\* distinct, and connected_clients stays balanced.
\*
\* c1,c2 -> same key k1, both Cacheable (must dedup to one op).
\* c3    -> key k2, Uncacheable (must be its own distinct op).
\* ClientKey / ClientCacheable are function-valued; substituted via <-.

SPECIFICATION Spec

CONSTANTS
  c1 = c1
  c2 = c2
  c3 = c3
  k1 = k1
  k2 = k2
  Clients = {c1, c2, c3}
  Keys = {k1, k2}
  ClientKey <- ClientKeyDef
  ClientCacheable <- ClientCacheableDef

INVARIANTS
  TypeOK
  CacheableShareOneOp
  UncacheableDistinct
  ConnectedNonNegative
  AtMostOneLiveOpPerKey
