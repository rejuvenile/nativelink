\* EvictResourceExhausted = FALSE: pre-fix predicate gap. Pool eviction
\* skipped on ResourceExhausted, so a Draining channel (post-GOAWAY)
\* surfaces ResourceExhausted on every fetch but is never evicted from
\* the pool, leading to unbounded fetch failures on subsequent
\* checkouts of the same dead slot.
\*
\* Expected TLC outcome:
\*   * INVARIANT VIOLATED on PoolHasRescuePath.
\*     Trace: Goaway(c1) -> Fetch(c1) [ResourceExhausted, no evict]
\*         -> Goaway(c2) -> Fetch(c2) [ResourceExhausted, no evict]
\*         -> all channels Draining, none in pendingReconnect, predicate
\*            doesn't evict on ResourceExhausted -> stuck.
\*   * NoUnboundedFailureWithoutRescue may also fire depending on the
\*     state TLC reaches first.

SPECIFICATION Spec

CONSTANTS
    Channels = {c1, c2}
    MaxFetches = 4
    EvictResourceExhausted = FALSE

INVARIANTS
    TypeOK
    ResourceExhaustedTriggersEviction
    NoIndefiniteFailureLoopOnFetches

CHECK_DEADLOCK FALSE
