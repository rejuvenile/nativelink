\* DE-ATOMIZED PinLifecycle, Fixed: Redrive = TRUE.
\* The failed_slow_writes drainer re-drives a failed slow write, so a
\* Failed digest ALWAYS has an enabled action (SlowWriteRedrive) toward
\* eventual Ack -> stable_digests push -> BIS -> unpin.
\*
\* Expected TLC outcome: NO invariant violation (NoPermanentPinLeak HOLDS).

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    PrimedDigests = {}
    Redrive = TRUE

INVARIANTS
    TypeOK
    NoPermanentPinLeak

CHECK_DEADLOCK FALSE
