\* TEETH — BuggedNoCeiling (design §8). DropCeiling = TRUE removes clause-3's
\* `Running < PCoreCount*FACTOR` conjunct, so clause 3 collapses to the pure
\* `OR PReportedIdle`. Under the stale-idle adversary (pLoad pinned "idle"),
\* HasPHeadroom is TRUE forever regardless of how many actions the worker holds,
\* so the cache tiers keep admitting to the SAME worker until it hits the slot
\* cap Capacity = 3 > PCoreCount*FACTOR = 2. I5_Bounded (Running <=
\* PCoreCount*FACTOR = 2) MUST be VIOLATED — Running reaches 3. This is the
\* unbounded re-concentration / red-team R3 the ceiling exists to prevent.
\* MUST report: "Invariant I5_Bounded is violated." with Running(w) = 3.

