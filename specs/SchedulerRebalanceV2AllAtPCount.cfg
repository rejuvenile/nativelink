\* v2.2 no-wedge DEGENERATE fleet: EVERY worker at p_count (Tier A empty). 2
\* workers p_count=1, capacity=2, 3 ops. Once both hold 1 action, NO worker has
\* P-headroom → Tier A empty → all workers Tier B. Under the SOFT preference the
\* fallback still dispatches the 3rd op (Tier B on an E slot). NoWedge +
\* EventuallyDispatched MUST HOLD (this is the exact fleet the HardFilter teeth
\* variant wedges). loadScore free so the Tier-B ranking is still exercised.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 3
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  EventuallyDispatched
