\* ChunkRaceReadersV2Bugged.cfg — verify-tla canonical Bugged config.
\* Equivalent to the historic ChunkRaceReadersV2_BuggedH1.cfg (H1 hazard
\* variant); duplicated under the Layer-1 classifier-recognised name so
\* the verify gate can demonstrate the bug class.
\*
\* WriterRegistersInFlight = FALSE models the v2 PRE-FIX state where
\* WriteChunkedV2 does NOT insert into chunked_in_flight_digests. A
\* concurrent reader during P0..P4 (writer admitted/committing chunks
\* but commit not yet published, evictingMap not yet flipped) observes
\* has=None and falls through to ReaderDoneNotFound (the FAILED_PRECONDITION
\* / Bazel build failure surface).
\*
\* Expected: TLC reports NoActiveWriterInvisibleToReader VIOLATED with
\* a counterexample showing a writer in {Sending, AwaitCommit} with seen
\* chunks AND inFlightSetMembership = FALSE.
\*
\* Also expected: EventualConsistencyStrong VIOLATED — a reader idle when
\* evictingMap is FALSE (during the bug window) but the writer DOES
\* eventually commit Ok and evictingMap DOES flip — the reader gets to
\* Bytes via Canonical anyway. So this property may NOT fail in the
\* bugged variant; only the safety state-predicate distinguishes.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1}
    Readers = {r1}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = FALSE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruptionWriter
    NoPermanentWedge
    NoPartialReadAsCanonical
    NoCorruptionViaReader
    NoFalsePositiveExistenceCanonical
    NoActiveWriterInvisibleToReader
    InFlightSetMembershipConsistency
    EvictingMapImpliesPublishOk

PROPERTIES
    WriterTermination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ReaderProgress
    StartedReadersTerminate
    NoReaderInducedWriterStuck
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry
    EvictingMapMonotonic

CHECK_DEADLOCK FALSE
