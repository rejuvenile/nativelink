\* Liveness / PROGRESS check. AllowEvict=FALSE: no adversarial eviction.
\* Under fairness, every Queued op must eventually reach Executing (or
\* Completed). This is the #1 NO-WEDGE property on the pure matching path,
\* INCLUDING the saturation fall-through: any worker with a free slot enables
\* Reserve, and Reserve is weakly fair, so a Queued op with an available slot
\* cannot be starved. 2 workers / 2 ops / capacity 1.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Ops = {o1, o2}
  Capacity = 1
  MaxRetries = 2
  AllowEvict = FALSE

INVARIANTS
  TypeOK
  NoDoubleDispatch
  NoSlotLeak
  CapacityRespected
  RetryBounded

PROPERTIES
  EventuallyDispatched
