\* StreamingBlobReadDuringWriteBugged.cfg — pre-#502 reader boundary.
\*
\* ShortShieldOn = FALSE models the pre-#502 reader where a writer's
\* short send_eof is observed as `Ok(Bytes::new())`. The reader
\* terminates in `DoneSilentShort` or `DoneSilentZero` depending on
\* whether the writer wrote any bytes at all before the short EOF.
\*
\* Expected: `NoSilentShortToReader` is VIOLATED (always) and, if the
\* writer chooses ShortEof at chunkCount=0, `NoSilentZeroToReader` is
\* also VIOLATED. Either is sufficient for the gate.

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = FALSE
    AllowDropWithoutEof = FALSE
    ShortShieldOn = FALSE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    BytesWrittenMatchesChunkCount
    CursorBoundedByChunkCount
    NoSilentZeroToReader
    NoSilentShortToReader

CHECK_DEADLOCK FALSE
