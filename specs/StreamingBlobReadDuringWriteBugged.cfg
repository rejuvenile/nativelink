\* StreamingBlobReadDuringWriteBugged.cfg — pre-#502 reader boundary.
\*
\* ShortShieldOn = FALSE models the pre-#502 reader where a writer's
\* short send_eof is observed as `Ok(Bytes::new())`. The reader
\* terminates in `DoneSilentShort` or `DoneSilentZero` depending on
\* whether the writer wrote any bytes at all before the short EOF.
\*
\* Expected: `NoSilentShortToReader` is VIOLATED (always) and, if the
\* writer chooses ShortEof at chunkCount=0, `NoSilentZeroToReader` is
\* also VIOLATED. Either is sufficient for the gate.
\*
\* Liveness PROPERTY DELIBERATELY OMITTED on Bugged cfgs.
\*
\* An earlier revision listed `WriterEventuallyTerminates` here as
\* "regression insurance against a lost-wakeup co-regression." Red-team
\* cadre-2 verified TLC terminates on the safety invariant at depth 4
\* BEFORE the liveness pass runs at all — the PROPERTY is parsed by
\* SANY but never checked (no "Checking N branches of temporal
\* properties" line in TLC output on Bugged cfgs). The PROPERTY was
\* decorative.
\*
\* Liveness is verified ONLY on the Fixed cfg, where TLC reaches the
\* liveness pass after exhausting safety states. A future regression
\* that masks the safety bug AND introduces a lost-wakeup would be
\* caught by the Fixed cfg's liveness PROPERTY firing on the now-
\* clean safety state.

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = FALSE
    AllowDropWithoutEof = FALSE
    ShortShieldOn = FALSE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    CursorBoundedByChunkCount
    NoSilentZeroToReader
    NoSilentShortToReader

CHECK_DEADLOCK FALSE
