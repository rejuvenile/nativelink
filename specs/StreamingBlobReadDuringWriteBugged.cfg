\* StreamingBlobReadDuringWriteBugged.cfg — pre-#502 reader boundary.
\*
\* ShortShieldOn = FALSE models the pre-#502 reader where a writer's
\* short send_eof is observed as `Ok(Bytes::new())`. The reader
\* terminates in `DoneSilentShort` or `DoneSilentZero` depending on
\* whether the writer wrote any bytes at all before the short EOF.
\*
\* Expected: `NoSilentShortToReader` is VIOLATED (always) and, if the
\* writer chooses ShortEof at chunkCount=0, `NoSilentZeroToReader` is
\* also VIOLATED. Either is sufficient for the gate.
\*
\* Liveness PROPERTY `WriterEventuallyTerminates` is included so the
\* gate ALSO checks that the regression doesn't accidentally introduce
\* a producer wedge while masking the silent-short defense. Without a
\* liveness check on Bugged cfgs a future regression that simultaneously
\* shields silent-short AND introduces a lost-wakeup would CI-pass
\* (the safety invariant flips from violated to clean and the gate
\* accepts ANY violation; without the liveness check the liveness
\* regression is undetected). The diagnostic value of the failure
\* shape is preserved.

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = FALSE
    AllowDropWithoutEof = FALSE
    ShortShieldOn = FALSE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    BytesWrittenBoundedByChunkCount
    CursorBoundedByChunkCount
    NoSilentZeroToReader
    NoSilentShortToReader

PROPERTIES
    WriterEventuallyTerminates

CHECK_DEADLOCK FALSE
