\* StreamingBlobReadDuringWrite_1w_3r_3c.cfg — more chunks, fewer readers.
\*
\* 1 writer x 3 concurrent readers x 3 chunks. Stresses the cursor-vs-
\* chunkCount interleaving (readers consume at different rates while
\* writer is still producing). Post-fix composition. Expected: clean.
\*
\* Informational config (not classified as Fixed by verify_tla.sh).

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2, r3}
    NumChunks = 3
    AllowShortEof = TRUE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = TRUE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    BytesWrittenMatchesChunkCount
    CursorBoundedByChunkCount
    NoSilentZeroToReader
    NoSilentShortToReader
    NoCorruptBytesToReader
    PostFixReaderOutcomeIsTwoWay
    ReaderOkImpliesWriterFullOk
    PostFixErrPropagationReachesReader
    PostFixFullOkReachesReaderAsOk
    CursorAtMostChunkCountAtTerminal

PROPERTIES
    WriterEventuallyTerminates
    NoEternalParkAfterWriterDone

CHECK_DEADLOCK FALSE
