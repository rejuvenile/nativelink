\* StreamingBlobReadDuringWrite_1w_3r_3c.cfg — more chunks, fewer readers.
\*
\* 1 writer x 3 concurrent readers x 3 chunks. Stresses the cursor-vs-
\* chunkCount interleaving (readers consume at different rates while
\* writer is still producing). Post-fix composition.
\*
\* SAFETY claim shape: same as Fixed.cfg — the spec's race model admits
\* DoneSilent* observations in the race-loser case, so the strong "no
\* silent under post-fix" invariants are NOT listed. Liveness leads-to
\* `PostFixErrPropagationReachesReaderEventually` is the load-bearing
\* claim.
\*
\* Informational config (not classified as Fixed by verify_tla.sh).

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2, r3}
    NumChunks = 3
    AllowShortEof = TRUE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = TRUE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    BytesWrittenBoundedByChunkCount
    CursorBoundedByChunkCount
    NoCorruptBytesToReader
    ReaderOkImpliesWriterFullOk
    PostFixFullOkReachesReaderAsOk
    CursorAtMostChunkCountAtTerminal

PROPERTIES
    WriterEventuallyTerminates
    NoEternalParkAfterWriterDone
    PostFixErrPropagationReachesReaderEventually

CHECK_DEADLOCK FALSE
