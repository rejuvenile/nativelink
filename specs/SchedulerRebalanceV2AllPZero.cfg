\* v2.2 no-wedge DEGENERATE fleet: EVERY worker p_count=0 (A5 guard). All
\* workers are ALWAYS HasPHeadroom (ungated) → all Tier A permanently. Under the
\* SOFT fallback everything dispatches; this exercises the A5 guard corner where
\* a fleet-constant / no-A5 gate would freeze the whole fleet (that is the
\* SchedulerRebalanceBugged NoA5Guard teeth in v1; here we confirm v2.2 with the
\* guard does NOT wedge). 2 workers, 2 ops, capacity 2.
\* AllowEvict=FALSE: this cfg checks the EventuallyDispatched LIVENESS property,
\* and the evict adversary is UNFAIR (Evict has no WF) — an unbounded evict loop
\* can keep a worker down forever and starve dispatch, a fairness-granularity
\* artifact, NOT a design wedge (the SAFETY cfg V2Safety exercises evict; the
\* structural NoWedge invariant proves a dispatch is always ENABLED). Isolating
\* the gate's progress requires the evict adversary off (matches
\* SchedulerRebalanceProgress.cfg).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 2
  PCoreCount <- PCoreCount_Zero

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
