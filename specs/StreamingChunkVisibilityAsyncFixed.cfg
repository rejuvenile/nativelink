\* FIXED: production ordering — chunks.push_back BEFORE chunk_count.fetch_add.
\* Uses SPECIFICATION Spec so the WF fairness conditions apply (required for
\* the liveness property). Run with -deadlock: the protocol legitimately
\* terminates (reader DoneOk, writer Eof), which is a fixpoint, not a wedge.
\* Expect all invariants to HOLD and ReadersEventuallyOk to HOLD.
CONSTANTS
    Readers = {r1}
    NumChunks = 2
    PushBeforeCount = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CountNeverAheadOfBuffer
    NoReaderPhantom

PROPERTIES
    ReadersEventuallyOk
