\* A4 DEGENERATE CELL: single-worker fleet, p_count=1, 2 ops, capacity=2.
\* With one worker: as soon as it holds 1 action it is at p_count => no viable
\* worker has P-headroom => Phase 2 => the SAME worker is admitted again for a
\* 2nd action (E core). The gate must NOT wedge a single-worker fleet at
\* p_count. Load-sat toggles independently. This is the "sole worker" no-wedge
\* cell — the one most likely to freeze under a naive P-gate.
\* PCoreCount = {w1:1} via PCoreCount_All1.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1"}
  Ops = {"o1", "o2"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
