\* UNSAFE (the reviewers' OOM).  Profiled tasks, estimate under-reports true
\* peak by 2x (Estimate=3, TruePeak=6).  MarginMul=1 (reserve the raw
\* estimate), Ceil=99 ("no ceiling" -- max_inflight_tasks=0), reactive Floor=2.
\* 1 worker, RamCap=16, 6 queued actions.
\*
\* The reservation admits by ESTIMATE: 3 actions reserve 3*3=9 <= 16 (ledger
\* says 7 free), but their TRUE peak is 3*6=18 > 16 -> OOM.  The reactive gate
\* (estimate-based free = 7 >= 2) permits it; it is blind to the under-report.
\*
\* EXPECT: NoOOM VIOLATED at depth 3 -- reservation admits by estimate, the
\* concurrent true peak exceeds RAM.  This is the "unsafe" cfg.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 99
  MarginMul = 1
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
