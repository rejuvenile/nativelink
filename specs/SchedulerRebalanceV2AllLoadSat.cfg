\* v2.2 SOFT control paired with the HardFilter teeth. SAME fleet (2 workers
\* p_count=1, cap=2, 3 ops, AllowLoadSat=TRUE) but Fallback = "Soft". This is
\* the state where the cache tiers decline (all-load-saturated) so the FALLBACK
\* is the only path — and under the SOFT preference it STILL dispatches (Tier B
\* eligible when Tier A empty). NoWedge + EventuallyDispatched MUST HOLD.
\*
\* Contrast with SchedulerRebalanceV2BuggedHardFallbackFilter.cfg (identical
\* fleet, Fallback="HardFilter"), which WEDGES on this same state. The pair is
\* the proof that the design's "SOFT not hard" constraint is load-bearing:
\* flip ONLY the fallback filter mode and no-wedge flips from HOLD to BREAK.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 4
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  EventuallyDispatched
