\* V4 RANKER — liveness (I2 no-wedge, temporal form). The ranker is a REORDERING
\* of the eligible set; it never empties a non-empty eligible set, so every queued
\* op with an available worker is eventually dispatched. Small MaxToggles so the
\* adversary cannot starve progress by an infinite-flip fairness artifact (the
\* stale-signal adversary is NOT weakly-fair; bounding its budget lets the fair
\* Dispatch action make progress). Checks EventuallyDispatched under the fixed
\* ranker + gate active.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2"}
  WorkerOrder <- Order_w123
  Capacity = 3
  MaxScore = 2
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  BuggedStaleRankOnly = FALSE
  PrefFlat = FALSE
  GateActive = TRUE
  AllowEvict = FALSE
  MaxToggles = 1
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  NoWedge

PROPERTIES
  EventuallyDispatched
