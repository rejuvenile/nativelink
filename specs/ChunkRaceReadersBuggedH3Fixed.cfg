\* ChunkRaceReadersBuggedH3Fixed.cfg — Layer-1 verify-tla "fixed" config
\* for the BuggedH3 spec.
\*
\* HONESTY note (post-cadre-2 per red-team R8):
\*
\* The `ChunkRaceReadersBuggedH3` spec deliberately omits
\* `EvictingMapInsert` from `Next` to model the H3 hazard (the
\* background-spawn'd `evicting_map.insert` after `finalize_holding`
\* never fires — see #247 in `filesystem_store.rs:1828`). The spec is
\* therefore BUGGED BY CONSTRUCTION; there is no "fixed" variant of the
\* spec itself. The fix lives in the canonical `ChunkRaceReadersV2.tla`
\* which DOES include `EvictingMapInsert` with `WF_vars` fairness.
\*
\* The verify_tla.sh gate (`scripts/verify_tla.sh`) requires every
\* `<Name>.tla` to have BOTH a `<Name>Fixed.cfg` AND a `<Name>Bugged.cfg`.
\* This file satisfies the Fixed requirement by exercising 5 STRUCTURAL
\* invariants that hold by construction in the bugged module:
\*
\*   - `TypeOK` (basic type-correctness)
\*   - `CommitDoneFlagSticksTrue` (commit-flag monotonicity)
\*   - `RunnerWriterAssignmentDiscipline` (runner-writer slot discipline)
\*   - `WriterDoneImpliesCommitDone` (writer-state cascade discipline)
\*   - `ChunksInFlightDisjointFromPresent` (in-flight/present disjointness)
\*   - `ReaderTerminalHasObservation` (reader state machine well-formedness)
\*
\* IMPORTANT — none of these 5 discriminate the H3 hazard. Red-team
\* cadre-2 (R8) verified each holds in BOTH the bugged module AND any
\* hypothetical fixed module of the H3 spec. They constrain meaningful
\* state-transition relationships (mutation-tested non-tautological by
\* invariant-prover), but the COVERAGE they add is structural-correctness
\* of the spec author's encoding, NOT proof that the H3 hazard fix
\* works. Any of the 5 could be removed without losing H3 hazard
\* coverage.
\*
\* The H3 fix proof remains exclusively in `ChunkRaceReadersV2Fixed.cfg`.
\* This Fixed cfg is a gate-classifier-satisfying stopgap that
\* prevents the cfg from being TypeOK-only (which was the original
\* invariant-prover cadre-1 MAJOR-2). It does NOT and CANNOT verify
\* the H3 fix.
\*
\* FOLLOWUP TRACKER: refactor the H3 hazard into a CONSTANT toggle
\* (`AllowEvictingMapInsert`) on the canonical `ChunkRaceReadersV2.tla`,
\* matching how `WriterRegistersInFlight` already handles the H1 hazard.
\* This would let the H3 hazard be exercised against the FULL canonical
\* invariant set without duplicating ~330 LOC. See
\* `.claude/audits/tla-slow-rw-rdw-2026-05-16.md` Phase 5 #5. After the
\* refactor lands, the canonical Fixed cfg's invariants would discriminate
\* the H3 hazard and this stopgap can be deleted.

