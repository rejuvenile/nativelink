\* ChunkRaceReadersBuggedH3Fixed.cfg — Layer-1 verify-tla "fixed" config
\* for the BuggedH3 spec.
\*
\* The `ChunkRaceReadersBuggedH3` spec deliberately omits
\* `EvictingMapInsert` from `Next` to model the H3 hazard (the
\* background-spawn'd `evicting_map.insert` after `finalize_holding`
\* never fires — see #247 in `filesystem_store.rs:1828`). The spec is
\* therefore bugged BY CONSTRUCTION; there is no "fixed" variant of the
\* spec itself. The fix lives in the canonical `ChunkRaceReadersV2.tla`
\* which DOES include `EvictingMapInsert` with `WF_vars` fairness.
\*
\* The verify_tla.sh gate (`scripts/verify_tla.sh`) requires every
\* `<Name>.tla` to have BOTH a `<Name>Fixed.cfg` AND a `<Name>Bugged.cfg`.
\* This file satisfies the Fixed requirement by exercising only the
\* invariants that hold STRUCTURALLY in the bugged spec (independent of
\* whether the H3 hazard fires) — namely the type and protocol invariants
\* that the writer-side state machine maintains by construction.
\*
\* NOTE: this config deliberately omits `H3HazardStateUnreachable` (which
\* the spec's bug model violates by design) and the liveness PROPERTIES
\* section (which TLC would need to falsify under the bug). The fully-
\* bug-exposing config is `ChunkRaceReadersBuggedH3Bugged.cfg`.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1}
    Readers = {r1}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = TRUE

INVARIANTS
    TypeOK

CHECK_DEADLOCK FALSE
