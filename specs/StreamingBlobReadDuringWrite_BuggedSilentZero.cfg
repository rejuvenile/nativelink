\* StreamingBlobReadDuringWrite_BuggedSilentZero.cfg — pre-#500 producer
\* Err-propagation seam.
\*
\* SilentZeroPropOn = FALSE models the pre-#500 state where the
\* `bytestream_server.rs::inner_read::consume_ok_eof` seam did not
\* propagate the producer's stashed Err to the read-side classifier,
\* allowing a writer's send_error / drop-without-eof to surface as
\* `Ok(empty)` to Bazel. Under the new seam-A/seam-B split,
\* `SeamBObservesProducerErr` is gated on SilentZeroPropOn so it never
\* fires here — `seamBPropagated` stays FALSE, and any reader observing
\* terminal=Err goes to DoneSilent*.
\*
\* ShortShieldOn left TRUE so this config isolates the #500 fix from
\* the #502 fix.
\*
\* Expected: `NoSilentZeroToReader` is VIOLATED (a reader subscribes
\* before any chunk arrives, the writer drops without eof, the reader
\* observes terminal=Err with bytesWritten=0 and propagation OFF, so
\* it terminates in DoneSilentZero).
\*
\* This cfg is INFORMATIONAL, not gate-classified. The filename suffix
\* is `BuggedSilentZero.cfg` (no underscore in the glob anchor); the
\* verify_tla.sh classifier glob `*Bugged.cfg` does NOT match.
\* verify_tla.sh reports it as `informational (outcome=violated; not
\* classified)`. The (ShortShieldOn=TRUE, SilentZeroPropOn=FALSE) cell
\* is therefore exercised in TLC but a future regression that makes it
\* clean would NOT fail the gate. Renaming the file (or relaxing the
\* classifier glob) is tracked as an out-of-scope follow-up.
\*
\* Liveness PROPERTY DELIBERATELY OMITTED — same rationale as the
\* sibling Bugged.cfg: TLC terminates on the safety violation before the
\* liveness pass runs, so the PROPERTY would be decorative. (Note: this
\* cfg is currently INFORMATIONAL — the filename suffix `BuggedSilentZero.cfg`
\* does NOT match the gate's `*Bugged.cfg` glob; verify_tla.sh reports
\* it as `informational (outcome=violated; not classified)`. This is
\* tracked as an out-of-scope follow-up.)

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = FALSE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = TRUE
    SilentZeroPropOn = FALSE

INVARIANTS
    TypeOK
    NoSilentZeroToReader
    NoSilentShortToReader

CHECK_DEADLOCK FALSE
