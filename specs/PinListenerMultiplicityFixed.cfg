\* BugMode = FALSE: post-fix listener (in_flight gate). Each
\* PinExpireFailedWritesListener checks whether THIS wrapper's
\* in_flight_slow_writes contains the digest; only the one that
\* owns the slow-write spawn fires the warn + insert. Models
\* fast_slow_store.rs:128-160 (post-investigator).
\*
\* Expected TLC outcome: NO invariant violation. firedCount <= 1
\* always; DownloadPin events fire zero listeners.
\*
\* NumWrappers = 3 matches production (local_worker.rs registers
\* three FastSlowStore wrappers against the same fast tier).

SPECIFICATION Spec

CONSTANTS
    NumWrappers = 3
    BugMode = FALSE

INVARIANTS
    TypeOK
    EveryEventFiresAtMostOneListener
    DownloadPinsDoNotFireWarn
    NoAmplificationOverNumWrappers

CHECK_DEADLOCK FALSE
