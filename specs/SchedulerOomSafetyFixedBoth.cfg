\* FIX (c): BOTH -- margin (MarginMul=2 -> Reserved=6=TruePeak) AND ceiling
\* (Ceil=2 = floor(16/6)).  Same 2x under-report.  1 worker, RamCap=16.
\* Belt-and-suspenders: the byte-adaptive reservation governs, the count
\* ceiling is the profile-independent backstop.
\*
\* EXPECT: NoOOM HOLDS and NoIdleWaste HOLDS.  (For a heterogeneous / worse-
\* than-assumed under-report, the ceiling is the LOAD-BEARING member -- see
\* SchedulerOomSafetyFixedMarginUnderestimatedCeiling.cfg.)

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 2
  MarginMul = 2
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
  NoIdleWaste
