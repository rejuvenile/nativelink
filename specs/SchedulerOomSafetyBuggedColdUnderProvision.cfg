\* UNSAFE via the COLD / unprofiled ledger-hole (distsys: "unprofiled
\* concurrent tasks consume RAM invisible to the reservation").  Here the
\* profiled tasks are PERFECTLY profiled (Estimate=6=TruePeak, no under-report)
\* so profiled-only would be safe; the OOM comes SOLELY from a cold action
\* whose cold-default estimate is too low (EstimateCold=1, TruePeakCold=6).
\* 1 worker, RamCap=16, a1 is cold, a2..a6 profiled.  MarginMul=1, Ceil=99.
\*
\* 2 profiled reserve 12; the cold action reserves only 1 (13 <= 16, admitted;
\* reactive free 4 >= 2).  TRUE = 6+6+6 = 18 > 16 -> OOM.  Motivates design v3's
\* "inject a conservative estimate for EVERY task" + the ceiling backstop.
\*
\* EXPECT: NoOOM VIOLATED -- the cold-default under-reservation alone OOMs even
\* with perfect profiles on every other task.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {a1}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 6
  TruePeakCold = 6
  EstimateCold = 1
  Ceil = 99
  MarginMul = 1
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
