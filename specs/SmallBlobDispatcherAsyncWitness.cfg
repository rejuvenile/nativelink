\* NON-VACUITY WITNESS for the FIXED regime. Runs NoDurableUnpinReached as an
\* INVARIANT that we EXPECT to be VIOLATED: the counterexample trace is the
\* proof that the fixed model actually reaches a durable-then-unpin state
\* (so "DurableBeforeUnpin holds" in Fixed is not vacuously true).

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    Stores = {s1}
    AdvertiseOnlyDurable = TRUE

INVARIANTS
    NoDurableUnpinReached

CONSTRAINT StateConstraint

CHECK_DEADLOCK FALSE
