\* COMPANION to BuggedThresholdAlways — isolates the single-constant necessity
\* split (design §5). AdmitAllThreshold = TRUE (threshold admits every worker,
\* even busy/P-saturated ones) but the CEILING IS INTACT (DropCeiling = FALSE).
\*
\* Expected: I5_Bounded HOLDS. This proves that the *threshold* alone does NOT
\* provide the freshness bound — even with the WHO-restriction fully removed, the
\* fresh-count ceiling still caps Running at PCoreCount*FACTOR = 2. It is the
\* CEILING, not the threshold, that makes I5 provable under staleness. (The
\* threshold's job is separate: restrict the override to idle-P workers so CPU-
\* bound work is not re-concentrated — a property about WHICH workers, not a
\* Running bound.) Contrast BuggedThresholdAlways (ceiling ALSO dropped -> break)
\* and BuggedNoCeiling (threshold intact, ceiling dropped -> break).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 3
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = TRUE
  DropCeiling = FALSE
  AllowEvict = FALSE
  MaxToggles = 1
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I5_Bounded
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge
