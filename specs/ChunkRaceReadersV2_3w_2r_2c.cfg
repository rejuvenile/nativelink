\* ChunkRaceReadersV2_3w_2r_2c.cfg — TLC config: 3 writers x 2 readers x 2 chunks.
\* Larger scale than the 1w1r2c base; tests cross-writer interactions
\* with concurrent readers. Lower than 3w/3r/3c (which times out beyond
\* 9 minutes wall-clock).

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2, w3}
    Readers = {r1, r2}
    Chunks = {c0, c1}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE
    WriterRegistersInFlight = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruptionWriter
    NoPermanentWedge
    NoPartialReadAsCanonical
    NoCorruptionViaReader
    NoFalsePositiveExistenceCanonical
    PostFixNoActiveWriterInvisibleToReader
    InFlightSetMembershipConsistency
    EvictingMapImpliesPublishOk

PROPERTIES
    WriterTermination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ReaderProgress
    StartedReadersTerminate
    EventualConsistencyStrong
    NoReaderInducedWriterStuck
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry
    EvictingMapMonotonic

CHECK_DEADLOCK FALSE
