\* Fix-verified config — KeepaliveSweep ENABLED with THRESHOLD=2.
\* The model gates Tick on ~DueOps so the sweep MUST run before time
\* advances past the THRESHOLD deadline. Under this scheduling, the
\* safety invariant NoPermanentOrphan holds.
\*
\* Mirror of the BuggedNoSweep config except EnableSweep=TRUE.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Operations = {op1, op2}
  THRESHOLD = 2
  MaxTime = 8
  EnableSweep = TRUE

INVARIANTS
  TypeInv
  COMPOSITE_INVARIANT
