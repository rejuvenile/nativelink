\* Safety check with capacity 2 (a worker can hold two reservations at once),
\* 2 workers / 2 ops. Stresses the multi-slot reservation-integrity accounting.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Ops = {o1, o2}
  Capacity = 2
  MaxRetries = 2
  AllowEvict = TRUE

INVARIANTS
  TypeOK
  NoDoubleDispatch
  NoSlotLeak
  CapacityRespected
  RetryBounded
  ExecutingConsistent
