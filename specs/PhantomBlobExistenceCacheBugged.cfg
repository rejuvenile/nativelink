\* BugMode = TRUE: the historic `head_was_ok` boolean was set on BOTH
\* (a) the real has-then-Some branch AND (b) the LazyExistenceOnSync
\* short-circuit branch. The PHANTOM BLOB warn gate then fires
\* whenever populate is NotFound after a LazySkip — even though
\* has() was never called and the NotFound is a normal miss.
\* 178 false-alarm warns / 10 minutes on production workers.
\*
\* Expected TLC outcome:
\*   * INVARIANT VIOLATED on GateFlagMatchesHasOutcome.
\*     Trace: HeadStepLazySkip -> flagSetByHead = TRUE,
\*     realHasReturnedSome = FALSE -> flag != ground truth.
\*   * INVARIANT VIOLATED on WarnFiresOnlyOnGenuineRace.
\*     Trace: HeadStepLazySkip -> PopulateNotFound -> WarnGate
\*     (gate opens because flagSetByHead=TRUE) -> warnEmitted=TRUE
\*     while realHasReturnedSome=FALSE -> false-alarm warn.

SPECIFICATION Spec

CONSTANTS
    BugMode = TRUE

INVARIANTS
    TypeOK
    WarnFiresOnlyOnGenuineRace
    GateFlagMatchesHasOutcome

CHECK_DEADLOCK FALSE
