\* v2 p_load-refinement — the PURE-STATE ceiling bound (I5_Bounded) checked on a
\* topology where the Phase-2 no-wedge LIFT can NEVER fire, so the gate is ALWAYS
\* governing the admission decision. This isolates the OVERRIDE's contribution
\* from the pre-existing Phase-2 lift (see the modelling note in the .tla).
\*
\* Mechanism: PCoreCount_Het includes w3 with p_count=0 (A5 ungated). With
\* AllowEvict = FALSE, w3 never goes down; while w3 has a free slot it ALWAYS has
\* P-headroom (A5), so SomeViableHasPHeadroom is ALWAYS TRUE => Phase-1 exclusion
\* NEVER lifts => a GATED worker (w1 p=1, w2 p=2) is admitted to the cache tiers
\* ONLY via the gate, never via a lift. Under the stale-idle adversary the
\* override can still fire on w1/w2, but its ceiling (Running < p*FACTOR) caps
\* them: w1 <= 2, w2 <= 4. Capacity = 5 so the slot cap does not pre-empt the
\* ceiling. 4 ops. EXPECT: I5_Bounded HOLDS (the ceiling binds), I5_BoundedOverride
\* HOLDS. This is the design §3 claim, cleanly isolated.

