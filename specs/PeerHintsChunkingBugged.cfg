\* BugMode = TRUE: buffered-with-wait design (the rejected pre-#98 plan).
\* The worker buffers chunks keyed on operation_id; the action's gate is
\* a Notify wait that depends on `notifyPending` becoming TRUE. The
\* notify is edge-triggered: it fires ONLY at the merge transition AND
\* only if `waitInstalled = TRUE` at that instant. If chunks complete
\* the buffer BEFORE InstallWait runs, the notify is dropped on the
\* floor; the subsequent InstallWait subscribes to a notification that
\* will never come. This is the classic Notify::notified() lost-wakeup
\* race that the direct-merge design eliminates by removing the buffer +
\* wait entirely.
\*
\* Expected TLC outcome:
\*   * TEMPORAL PROPERTY VIOLATED on ActionEventuallyDone.
\*   * Trace: DeliverChunk(1) ... DeliverChunk(NumChunks)
\*       (merge fires, notifyPending = waitInstalled = FALSE → stays FALSE)
\*       InstallWait (waitInstalled := TRUE, but notify already lost)
\*       FinishAction enabled-condition (notifyPending = TRUE) never holds.
\*       Action stays "Pending" forever despite WF on FinishAction.

SPECIFICATION Spec

CONSTANTS
    NumChunks = 2
    BugMode = TRUE

INVARIANTS
    TypeOK
    LocalityMapSubsetOfDelivered

PROPERTIES
    ActionEventuallyDone

\* CHECK_DEADLOCK = FALSE because BugMode's stuck terminal state
\* (Pending forever with no enabled transition that can change
\* notifyPending) is reported as a deadlock; we want TLC to
\* surface it via the temporal-property violation instead, which
\* gives a clearer counter-example trace.
CHECK_DEADLOCK FALSE
