\* TEETH — BuggedStaleRankWins (design §12.4). BuggedStaleRankOnly = TRUE forces
\* p_headroom_pref = 0 for EVERY eligible worker — i.e. the OLD stale-only ranker
\* (no headroom preference at all): winner selection is pure `min LoadScore`,
\* exactly the current production ranker (load_penalty / effective_load_score,
\* both pure fns of the STALE p_core_load_pct). Under the stale-low adversary
\* (an override worker's loadScore held LOW while its Running climbs past
\* PCoreCount), that override-admit OUT-RANKS a genuine-free-slot eligible worker
\* and WINS the dispatch. I6_RankerConsistency MUST be VIOLATED — this reproduces
\* the exact bounded-magnet production defect §10 describes (an at-capacity
\* override worker preferred over a truly-free peer for the ~2.5s the stale
\* reading persists). Capture the counterexample trace.
\*
\* MUST report: "Action property I6_RankerConsistency is violated." with a trace
\* where the eligible set contained a genuine-free-slot worker (Running < PCoreCount)
\* but the winner had Running >= PCoreCount (an override-admit) due to a lower
\* stale loadScore.
\*
\* Topology: 3 workers, 3 ops so a genuine-free worker and an override worker
\* coexist in one eligible set. THRESHOLD = 50 so the override fires. Evict OFF
\* to keep the counterexample trace minimal + deterministic. MaxToggles = 2 so the
\* adversary can set the free worker's loadScore ABOVE the override worker's.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  WorkerOrder <- Order_w123
  Capacity = 3
  MaxScore = 2
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  BuggedStaleRankOnly = TRUE
  PrefFlat = FALSE
  GateActive = TRUE
  AllowEvict = FALSE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK

PROPERTIES
  I6_RankerConsistency
