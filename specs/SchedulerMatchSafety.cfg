\* Safety check: adversary eviction ENABLED, 2 workers / 2 ops / capacity 1.
\* Exhaustively checks NO-DOUBLE-DISPATCH, RESERVATION INTEGRITY, capacity,
\* retry-bound across the full matching ∥ evict ∥ assign-retry interleaving.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Ops = {o1, o2}
  Capacity = 1
  MaxRetries = 2
  AllowEvict = TRUE

INVARIANTS
  TypeOK
  NoDoubleDispatch
  NoSlotLeak
  CapacityRespected
  RetryBounded
  ExecutingConsistent
