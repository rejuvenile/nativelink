\* BugMode = FALSE: resend on reconnect (the shipped #97 implementation).
\* Drained chunks (inFlight wiped on DropConnection) are replayed via
\* Reconnect's `inFlight' = serverBuffer` rule — modeling
\* `replay_bis_chunks_to_worker` from `add_worker`. Every chunk
\* eventually delivers AND is acked, so the server's resend buffer
\* eventually drains.
\*
\* Models the production code at:
\*   nativelink-scheduler/src/api_worker_scheduler.rs
\*     - broadcast_blobs_in_stable_storage_chunked (dispatch + buffer)
\*     - replay_bis_chunks_to_worker (called from add_worker)
\*     - bis_ack_received (drains buffer slot)
\*   nativelink-worker/src/local_worker.rs
\*     - handle_bis_chunk (unpin + ack-emit)
\*
\* Expected TLC outcome:
\*   * NO invariant violation (TypeOK, ServerBufferBounded,
\*     ServerBufferReleaseImpliesUnpin all hold).
\*   * NO temporal-property violation: AllChunksEventuallyUnpinned
\*     and ServerBufferEventuallyEmpty hold on every behavior.

SPECIFICATION Spec

CONSTANTS
    NumChunks = 3
    BugMode = FALSE

INVARIANTS
    TypeOK
    ServerBufferBounded
    ServerBufferReleaseImpliesUnpin

PROPERTIES
    AllChunksEventuallyUnpinned
    ServerBufferEventuallyEmpty

\* CHECK_DEADLOCK = FALSE because the legitimate terminal state
\* (every chunk delivered + acked, no pending action) has no
\* successor by design; TLC would otherwise report it as a deadlock.
\* The temporal properties already enforce forward progress.
CHECK_DEADLOCK FALSE
