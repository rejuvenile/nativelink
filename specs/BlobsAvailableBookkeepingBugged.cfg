\* BugMode = TRUE: pre-fix-up-2 bookkeeping (the bug).
\* The merge-success branch writes back `prev_total + delta` where
\* `prev_total` was captured BEFORE the token-mismatch wipe. Wipes are
\* silently overwritten; totalAccumulated drifts upward.
\*
\* Expected TLC outcome:
\*   * INVARIANT VIOLATED on TotalAccumulatedConsistency.
\*   * Trace: MergeChunkSuccessNew(b=1, token=1, sz=1) ->
\*           MergeChunkSuccessTokenMismatchRebuild(b=1, token=2, sz=1)
\*     leaves totalAccumulated == 2 but SumOverBroadcasts == 1.
\*
\* CHECK_DEADLOCK = FALSE; we want the invariant violation to surface
\* the bug.

SPECIFICATION Spec

CONSTANTS
    NumBroadcasts = 2
    MaxEntriesPerChunk = 2
    MaxEntriesPerBroadcast = 4
    BugMode = TRUE

INVARIANTS
    TypeOK
    TotalAccumulatedConsistency
    ErrBranchPreservesOtherBroadcasts

CONSTRAINT
    StateConstraint

CHECK_DEADLOCK FALSE
