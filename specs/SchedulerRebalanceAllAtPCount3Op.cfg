\* A4 no-wedge POSITIVE PROOF (the exact counterpart of the Phase2NoLift teeth
\* wedge). 2 workers p_count=1, capacity=2, 3 ops — MORE ops than total
\* P-capacity, so a state with BOTH workers at p_count AND a 3rd op still
\* Queued is REACHABLE. In the GOOD spec the Phase-2 lift fires there: the 3rd
\* op dispatches onto a free E slot (via the lifted cache tier or the fallback),
\* so NoWedge + EventuallyDispatched HOLD. This is the same reachable state the
\* Phase2NoLift bugged variant WEDGES on — proving the lift is what saves it.
\* Load-sat toggles independently (A4 joint cross-product).
\* PCoreCount = {w1:1, w2:1} via PCoreCount_All1.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
