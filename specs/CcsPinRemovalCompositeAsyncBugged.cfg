\* DE-ATOMIZED Ccs pin/gate/evict, Bugged: AtomicPin = FALSE (insert-then-pin).
\* A moka LRU eviction can remove a still-pin-pending slot before the
\* BIS-feeder pins it -> the admitted write's in-memory durability window
\* is lost. Expected: INVARIANT VIOLATED on NoLostDurabilityWindow.
SPECIFICATION Spec
CONSTANTS
    MaxSlots = 2
    Writers = {w1}
    WritesPerWriter = 2
    AtomicPin = FALSE
INVARIANTS
    TypeOK
    NoLostDurabilityWindow
CHECK_DEADLOCK FALSE
