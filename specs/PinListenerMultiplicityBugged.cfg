\* BugMode = TRUE: pre-fix listener (no in-flight gate). Every
\* listener registered on the fast store fires unconditionally on
\* every pin-expire event, regardless of whether THIS wrapper has
\* a slow-write outstanding for the digest.
\*
\* Expected TLC outcome:
\*   * INVARIANT VIOLATED on EveryEventFiresAtMostOneListener.
\*     Trace: PickPinSourceSlowWrite(1) -> StartFiring -> RunListener
\*     for w=1, 2, 3 -> firedCount = 3 -> CompleteFiring -> violated.
\*   * INVARIANT VIOLATED on DownloadPinsDoNotFireWarn.
\*     Trace: PickPinSourceDownload -> StartFiring -> RunListener
\*     for w=1, 2, 3 -> firedCount = 3 -> CompleteFiring -> violated.
\*   * INVARIANT VIOLATED on NoAmplificationOverNumWrappers.
\*     Same shape: failedSetCount = NumWrappers per event.
\*
\* This is exactly the 3× amplification observed on production
\* workers (5774 events / 10 min in the source memory entry).

SPECIFICATION Spec

CONSTANTS
    NumWrappers = 3
    BugMode = TRUE

INVARIANTS
    TypeOK
    EveryEventFiresAtMostOneListener
    DownloadPinsDoNotFireWarn
    NoAmplificationOverNumWrappers

CHECK_DEADLOCK FALSE
