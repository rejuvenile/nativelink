\* TEETH (soft != hard): Fallback = "HardFilter" — the fallback EXCLUDES Tier-B
\* (non-P-headroom) workers instead of merely deprioritizing them (design §11
\* :318 "A HARD filter (exclude Tier B) would reintroduce the Phase2NoLift
\* wedge — FORBIDDEN").
\*
\* The wedge must be observed ON THE FALLBACK PATH. The fallback is reached only
\* when the cache-affinity tiers all DECLINE (CacheTiersDeclined) — in the model
\* that is SaturationFallThrough = every viable worker LOAD-saturated (the
\* real-code analogue: no directory/cache match, so selection drops to
\* inner_find_worker_for_action). So this teeth cfg turns AllowLoadSat ON and
\* lets the fleet reach the all-load-saturated state, where the cache tiers
\* decline and the (hard-filtered) fallback is the ONLY path.
\*
\* Fleet: 2 workers p_count=1, capacity=2, 3 ops (> total P-capacity). Once both
\* workers hold 1 action AND are load-saturated, the cache tiers decline and the
\* hard filter excludes EVERY worker (Tier A empty — no P-headroom) → the 3rd op
\* can never dispatch even though each worker has a free E slot. EXPECT:
\*   - NoWedge VIOLATED: a Queued op + a worker that can accept, but NO dispatch
\*     enabled (write-once-dispatch-never, the Phase2NoLift class).
\*   - EventuallyDispatched VIOLATED: the 3rd op stays Queued forever.
\* With the SOFT variant on the SAME state (SchedulerRebalanceV2AllLoadSat.cfg)
\* the fallback still dispatches (Tier B eligible) → NO wedge. That contrast is
\* the proof the "SOFT not hard" constraint is load-bearing.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2"}
  Ops = {"o1", "o2", "o3"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "HardFilter"
  MaxToggles = 4
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  EventuallyDispatched
