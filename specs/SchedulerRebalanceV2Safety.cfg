\* v2.2 SAFETY (soft two-tier fallback, gate ON). Heterogeneous fleet incl a
\* p_count=0 worker (A5). Adversary evict + INDEPENDENT load-sat toggle (A4) +
\* INDEPENDENT load-score set (the signal-disagreement source) all ENABLED.
\* Exhaustively checks I1-STRENGTHENED (cache AND fallback P-headroom-first) /
\* I3 / I4 / I5 + capacity + evicted-empty + NoWedge across the full
\* cache∥fallback∥evict∥load-toggle∥load-score interleaving.
\* PCoreCount = {w1:1, w2:2, w3:0}. Capacity 3 > max p_count so the P-gate, not
\* the slot cap, binds in Phase 1 (E cores free above p_count).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2"}
  Capacity = 3
  AllowEvict = TRUE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 3
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
