\* BugMode = TRUE: NO resend on reconnect (the pre-#97 production
\* path under #89-style stream churn). When the wire drops, in-flight
\* chunks are silently lost; Reconnect simply transitions back to
\* "Connected" without re-arming inFlight from serverBuffer. The
\* worker never sees the lost chunks → never unpins them → pin state
\* leaks forever AND the server's resend buffer holds them forever
\* (no ack ever arrives).
\*
\* This is precisely the durability gap from production task #89:
\* "BIS acks not reaching workers in production". Without ack-tracking
\* + resend, every dropped h2/QUIC stream during a BIS broadcast
\* leaks pin state on every worker that lost its in-flight chunk.
\*
\* Expected TLC outcome:
\*   * TEMPORAL PROPERTY VIOLATED on AllChunksEventuallyUnpinned.
\*   * Trace: dispatch → DropConnection (inFlight wiped) → Reconnect
\*     (BugMode: no replay) → workerUnpinned never grows past the
\*     pre-drop state. Stuck forever.
\*
\*   * (ServerBufferEventuallyEmpty is also violated for the same
\*     reason — a chunk that's never delivered is never acked, so the
\*     buffer slot leaks.)

SPECIFICATION Spec

CONSTANTS
    NumChunks = 2
    BugMode = TRUE
    \* StaleTokenAccepted = TRUE models the pre-fixup behavior where
    \* `bis_ack_received` had no `server_instance_token` check —
    \* a worker holding a stale ack across a server bounce would
    \* drop an unrelated chunk from the new server's buffer (red-team
    \* finding #5). This violates ServerBufferReleaseImpliesUnpin
    \* INDEPENDENTLY of BugMode (a stale ack can release a chunk
    \* before the worker has unpinned it).
    StaleTokenAccepted = TRUE

INVARIANTS
    TypeOK
    ServerBufferBounded
    ServerBufferReleaseImpliesUnpin

PROPERTIES
    AllChunksEventuallyUnpinned
    ServerBufferEventuallyEmpty

\* CHECK_DEADLOCK = FALSE because the bug's stuck terminal state
\* (Connected with no chunks left in inFlight, but workerUnpinned
\* incomplete) has no enabled transition that can deliver the lost
\* chunks. Reconnect doesn't help (no replay in BugMode), so TLC
\* would report it as a deadlock; we want the temporal-property
\* violation to surface it instead, which gives a clearer
\* counter-example trace.
CHECK_DEADLOCK FALSE
