\* PROGRESS across BOUNDED eviction. 2 workers / 2 ops / capacity 1, up to
\* 2 total evictions. Checks invariant (1) NO-WEDGE holds even when eviction
\* requeues an op mid-assign, AND the safety invariants as a regression guard.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Ops = {o1, o2}
  Capacity = 1
  MaxRetries = 2
  MaxEvicts = 2

INVARIANTS
  TypeOK
  NoDoubleDispatch
  NoSlotLeak
  CapacityRespected

PROPERTIES
  EventuallyDispatched
