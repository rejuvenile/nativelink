\* FL-688 never-BIS-acked pin-leak — FIXED regime (operator-confirmed,
\* event-driven).
\*
\* EventDrivenOnShortCircuit = TRUE: the durability EVENT — including the
\* `AlreadyExists` short-circuit — checks the locality map and, if the blob
\* is still held, drives the SAME has_durably-gated mark_stable/BIS the
\* fresh-write path drives. Every ordering converges:
\*   * durable-before-advert: ServerHandleAdvert's has_durably poll catches it.
\*   * advert-before-durable: the short-circuit durability event (locality-
\*     checked) catches it.
\* Release stays gated on server-durability, so StableFeedIsDurable (the
\* >=2-replica gate) still holds — the fix does not weaken durability, and
\* there is NO TTL / pin-expiry.
\*
\* Expected TLC outcome: no invariant violation; liveness
\* EventuallyAllReleased holds via the event-driven BIS chain.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    EventDrivenOnShortCircuit = TRUE

INVARIANTS
    TypeOK
    StableFeedIsDurable
    DurableHeldReleasedAtQuiescence

PROPERTIES
    EventuallyAllReleased

CHECK_DEADLOCK FALSE
