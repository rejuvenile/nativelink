\* BUGGED: advertise-before-durable (FL-688 class).
\* AdvertiseOnlyDurable = FALSE => WorkerSendAck advertises entries that are
\* only received-in-memory (workerReceived), not yet durable. The server
\* releases the EphemeralServerSidePin on that advertisement; if the durable
\* write then fails, the bytes are lost from both server and worker.
\*
\* Expected TLC outcome: INVARIANT VIOLATED on DurableBeforeUnpin
\* (and, one step later in the trace, NoUnpinnedLostBlob).

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    Stores = {s1}
    AdvertiseOnlyDurable = FALSE

INVARIANTS
    TypeOK
    DurableBeforeUnpin
    NoUnpinnedLostBlob

CONSTRAINT StateConstraint

CHECK_DEADLOCK FALSE
