\* EvictResourceExhausted = TRUE: post-fix predicate that includes
\* ResourceExhausted (the GOAWAY-derived ENHANCE_YOUR_CALM mapping).
\* Models grpc_store.rs:143-155.
\*
\* Expected TLC outcome: NO invariant violation. Eviction always
\* eventually fires after a stream sees a transport-shape error,
\* so the pool always has a rescue path back to a healthy state.

SPECIFICATION Spec

CONSTANTS
    Channels = {c1, c2}
    MaxFetches = 4
    EvictResourceExhausted = TRUE

INVARIANTS
    TypeOK
    ResourceExhaustedTriggersEviction
    NoIndefiniteFailureLoopOnFetches

CHECK_DEADLOCK FALSE
