\* ChunkRaceWriter_3w3c.cfg — TLC config: 3 writers x 3 chunks.
\* Largest config in the suite. May take minutes.

SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2, w3}
    Chunks = {c0, c1, c2}
    AllowPwriteFail = TRUE
    AllowRunnerCancel = TRUE

INVARIANTS
    TypeOK
    MirrorOnce
    RunnerOwnsCommit
    InFlightDisjointAfterDone
    NoCorruption
    NoPermanentWedge
    RegistryHygieneNoNewAttach

PROPERTIES
    Termination
    AllAttachedWritersTerminate
    CommitEventuallyResolves
    ResultMonotone
    ChunksPresentMonotonicWithinRegistry

CHECK_DEADLOCK FALSE
