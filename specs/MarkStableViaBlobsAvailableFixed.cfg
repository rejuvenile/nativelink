\* Post-#140 architecture (this branch). BlobsAvailable is the SOLE
\* mark_stable feeder for advertised digests. ExecuteResponse no longer
\* races; every pin alloc is reported via the BlobsAvailable channel
\* and the server's has() + mark_stable closes the loop on every tick.
\*
\* Expected TLC outcome: NO invariant violation. Liveness
\* `EventuallyConsistentLocality` holds via the BIS chain.

SPECIFICATION Spec

CONSTANTS
    Digests = {d1, d2}
    FixV140 = TRUE

INVARIANTS
    TypeOK
    NoLostEvictionRace
    EveryPinReachesRelease

PROPERTIES
    EventuallyConsistentLocality

CHECK_DEADLOCK FALSE
