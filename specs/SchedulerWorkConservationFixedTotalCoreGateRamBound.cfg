\* FIX under a RAM-BINDING workload — the "sufficient other resources" clause
\* made to bite.  Total-core gate, 2 workers, P=2/E=2 (4 processors each), but
\* RamCap = 3 with ActionRamEach = 2, so each worker holds only ONE action by
\* RAM (2 <= 3; a second would be 4 > 3).  6 actions queued.
\*
\* At the fixpoint each worker runs 1 action (used_ram = 2), leaving 3 idle
\* processors, yet NO queued action fits (2 + 2 > 3).  This is the CONDITIONAL
\* part of the property: an idle processor with queued work is NOT a violation
\* when the queued work does not fit remaining RAM.
\*
\* EXPECT: no error.  WorkConserving HOLDS (QueuedFits is false at the idle
\* workers) and NoRamOverflow HOLDS (used_ram = 2 <= 3) — the fix conserves
\* work WITHOUT overflowing RAM to do it.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Actions = {a1, a2, a3, a4, a5, a6}
  PCoreCount = 2
  ECoreCount = 2
  RamCap = 3
  ActionRamEach = 2
  GateMode = "TotalCore"

SYMMETRY Symmetry

INVARIANTS
  TypeOK
  NoProcessorOversubscription
  NoRamOverflow
  WorkConserving
