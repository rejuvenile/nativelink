\* Pre-Bucket-B leaf store: consumer ignores UploadSizeInfo and silently
\* commits whatever bytes the stream delivered, recording the producer's
\* declaredN as the entry's logical size. This is the historic
\* silent-poisoning behaviour that the page-rounding regression
\* (commit 9bfe9924, 2026-04-26) exposed once MemoryStore Bucket-B
\* enforcement landed.
\*
\* Sizes chosen to mirror the production incident:
\*   137515 = "actual data bytes" the stream delivers
\*   139264 = "page-rounded size" FilesystemStore::has_with_results
\*            historically returned (= 137515.div_ceil(4096) * 4096
\*            for a different page-rounded blob in the same window;
\*            the production memo cites declared 139264, received
\*            137515 directly).
\*
\* TLC will explore every (n, M) pair from this set:
\*   (137515, 137515)  contract holds (well-coupled)
\*   (137515, 139264)  ExactSize(137515) but stream over-delivered
\*   (139264, 137515)  ExactSize(139264) but stream under-delivered
\*                     == THE PRODUCTION REGRESSION
\*   (139264, 139264)  contract holds
\*
\* Expected TLC outcome: INVARIANT VIOLATED on NoPoisonedCommit (and
\* ContractAtCommit). The shortest counter-example trace:
\*   DeclareExactSize(139264) -> DeliverBytes(137515) -> ConsumerCommit
\*   -> committedSize = 139264, deliveredM = 137515, poisoned' = TRUE
\* matches the production declared/received pattern exactly.

SPECIFICATION Spec

CONSTANTS
    Sizes = {137515, 139264}
    FixSize = FALSE

INVARIANTS
    TypeOK
    NoPoisonedCommit
    ContractAtCommit
    NoCommitWithoutDeliver

CHECK_DEADLOCK FALSE
