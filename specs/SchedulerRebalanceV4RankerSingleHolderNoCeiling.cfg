\* (design §13 Refinement 2 — TEETH) SINGLE-HOLDER, CEILING DROPPED. Identical
\* topology to SingleHolderCeiling EXCEPT DropCeiling = TRUE. This removes the
\* clause-3 fresh-count ceiling (`Running < p_count*FACTOR`) for the sole holder,
\* leaving pure `OR p_idle`. Since THRESHOLD=101 makes PReportedIdle always TRUE,
\* the sole holder w1 is override-eligible FOREVER — it never loses P-headroom,
\* so the cache regime keeps routing every same-root op to it and its Running
\* climbs UNBOUNDED (bounded here only by the artificial slot Capacity=5, set
\* large precisely to expose the unboundedness).
\*
\* EXPECTED: I5_Bounded is VIOLATED (w1's Running reaches 5 > ceiling 1*2 = 2).
\* This is the RESIDUAL the design names: without the ceiling, the accepted
\* single-holder case is UNBOUNDED — i.e. the FACTOR ceiling is the ONLY thing
\* that makes keeping same-root work on the sole holder safe (§13 R1: "the FACTOR
\* ceiling is the absolute, candidate-count-INDEPENDENT brake"). I6 stays
\* vacuously true even here (still no free-slot cache-eligible worker); its
\* passing is meaningless for this case — I5_Bounded is what fails, exactly as
\* the honest-coverage argument predicts.
\*
\* This cfg MUST produce an invariant violation on I5_Bounded. A clean "No error"
\* would mean the topology fails to exercise the residual (the tell the
\* invariant-prover memory `idiom_deterministic_winner_ranker_tla` warns about).

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3", "o4", "o5"}
  WorkerOrder <- Order_w123
  RootHolders = {"w1"}
  Capacity = 5
  MaxScore = 2
  THRESHOLD = 101
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = TRUE
  BuggedStaleRankOnly = FALSE
  PrefFlat = FALSE
  GateActive = TRUE
  AllowEvict = FALSE
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I5_Bounded

PROPERTIES
  I6_RankerConsistency
