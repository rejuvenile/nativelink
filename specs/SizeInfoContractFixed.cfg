\* Post-Bucket-B leaf store: consumer enforces UploadSizeInfo at commit
\* time. ExactSize(N) requires deliveredM == N; MaxSize(N) requires
\* deliveredM <= N. Mismatches are rejected (no entry inserted).
\* Models MemoryStore::update lines 218-257 and the redis_store mirror
\* (task-156).
\*
\* Same Sizes set as the Bugged config so TLC explores the same
\* (declared, delivered) state space — the difference is the consumer's
\* check predicate.
\*
\* Expected TLC outcome: NO invariant violation. Every contract-violating
\* (n, M) pair leads to ConsumerReject; only well-coupled pairs commit;
\* committedSize == deliveredM in every committed state, so poisoned
\* stays FALSE.

SPECIFICATION Spec

CONSTANTS
    Sizes = {137515, 139264}
    FixSize = TRUE

INVARIANTS
