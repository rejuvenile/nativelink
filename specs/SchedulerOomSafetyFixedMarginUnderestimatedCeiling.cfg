\* THE CEILING SAVES THE DAY (S-2 money result).  Identical to
\* SchedulerOomSafetyBuggedMarginUnderestimated.cfg -- a margin that assumes 2x
\* while reality is 3x (Estimate=3, TruePeak=9) -- EXCEPT a mandatory ceiling
\* Ceil=1 = floor(RamCap / max_true_peak) = floor(16/9).  1 worker, RamCap=16.
\*
\* The margin is WRONG (Reserved=6 < TruePeak=9) and the reservation would admit
\* 2, but the count ceiling caps at 1: TRUE = 9 <= 16.  The profile-independent
\* ceiling holds even though the profile-dependent margin failed -- exactly why
\* both are mandatory and the ceiling is the load-bearing OOM backstop.
\*
\* EXPECT: NoOOM HOLDS -- the ceiling contains the OOM the mis-sized margin let
\* through.  Required relationship: Ceil <= floor(RamCap / max_observed_true_peak),
\* enforced independent of any profile.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 9
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 1
  MarginMul = 2
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
