\* RankerParity — the GATE-INACTIVE parity proof (design §12.3). GateActive =
\* FALSE models flag-off OR Phase-2 lift: p_headroom_pref === 0 for ALL workers,
\* so the (pref, LoadScore) key collapses to the SECONDARY key (LoadScore) alone
\* — byte-identical to the v1 `min LoadScore` winner selection. RankerParity
\* asserts PHeadroomPref(w) = 0 in every reachable state; KeyIsPureLoad asserts
\* the pair-wise comparison KeyLt IS pure LoadScore order — so WinnerOf is
\* stuttering-equivalent to v1. Full adversary on so parity is checked across the
\* whole reachable space. THRESHOLD irrelevant when gate inactive; set 50 anyway.
\* (This is the same property the v1/current-parity ThresholdZeroParity gave for
\* the GATE; here it covers the RANKER, which the first prove did not touch.)

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2", "o3"}
  WorkerOrder <- Order_w123
  Capacity = 3
  MaxScore = 2
  THRESHOLD = 50
  FACTOR = 2
  AdmitAllThreshold = FALSE
  DropCeiling = FALSE
  BuggedStaleRankOnly = FALSE
  PrefFlat = FALSE
  GateActive = FALSE
  AllowEvict = TRUE
  MaxToggles = 3
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  RankerParity
  KeyIsPureLoad
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  EvictedEmpty
  NoWedge

PROPERTIES
  I6_RankerConsistency
