\* M1 LIVENESS / PROGRESS (I2 no-wedge). No adversarial evict (AllowEvict=
\* FALSE) so the pure gate progress is isolated, BUT load-saturation toggles
\* freely (AllowLoadSat=TRUE) — this is the A4 cross-product: every Queued op
\* must eventually dispatch across every joint (P-gate × load-sat) state.
\* Under fairness, CacheReserve/FallbackReserve dispatch every Queued op.
\* 3 heterogeneous workers (incl p_count 0) / 2 ops / capacity 3.
\* PCoreCount = {w1:1, w2:2, w3:0} via PCoreCount_Het.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1", "w2", "w3"}
  Ops = {"o1", "o2"}
  Capacity = 3
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  MaxToggles = 2
  PCoreCount <- PCoreCount_Het

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  I1_PHeadroomFirst
  I3_LocalityBounded
  EventuallyDispatched
