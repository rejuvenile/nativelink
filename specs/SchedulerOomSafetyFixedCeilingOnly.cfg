\* FIX (b): CEILING-ONLY.  Same 2x under-report (Estimate=3, TruePeak=6),
\* MarginMul=1 (NO margin -- reservation alone would admit 5 and OOM), but a
\* hard count ceiling Ceil=2 = floor(RamCap / max_true_peak) = floor(16/6).
\* 1 worker, RamCap=16.
\*
\* The reservation would permit a 3rd (reserve 9 <= 16) but the ceiling refuses
\* it: 2 running, TRUE = 12 <= 16.  The profile-independent count bound is the
\* no-OOM backstop, sized so worst-case simultaneous peak <= RAM.
\*
\* EXPECT: NoOOM HOLDS.  NoIdleWaste also HOLDS here because for UNIFORM actions
\* Ceil=2 coincides with the true RAM capacity (a 3rd true=18>16 would not fit
\* anyway).  The ceiling's work-conservation COST shows only under heterogeneity
\* -- see SchedulerOomSafetyBuggedCeilingHeteroWaste.cfg.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1}
  Actions = {a1, a2, a3, a4, a5, a6}
  ColdActions = {}
  RamCap = 16
  TruePeakEach = 6
  EstimateEach = 3
  TruePeakCold = 1
  EstimateCold = 1
  Ceil = 2
  MarginMul = 1
  Floor = 2

CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  NoOOM
  NoIdleWaste
