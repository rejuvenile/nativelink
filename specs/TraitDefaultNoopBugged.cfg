\* BugMode = TRUE: wrapper inherits the trait-level default impl
\* of drain_stable_digests, which returns Vec::new(). This is the
\* SILENT FAILURE class documented at store_trait.rs:954-991: a
\* wrapper that forgets to override compiles cleanly, runs cleanly,
\* and silently swallows the contract delegation.
\*
\* Expected TLC outcomes:
\*   * INVARIANT VIOLATED on NoStaleWorkerPinUnderProduction.
\*     Trace: LeafRecordsDigest -> BroadcastStartDrain ->
\*     WrapperNoopDrain (wrapperDrained={}) -> BroadcastEmit
\*     (broadcastSeen unchanged) -> back to Idle, leafState =
\*     "Recorded", workerPin still "Pinned". The invariant's
\*     antecedent ("D" in broadcastSeen) is never met because
\*     the bug never broadcasts anything; but
\*     `BroadcastSeesEveryLeafProduction` ALSO holds vacuously
\*     because leafState never becomes "Drained" under bug. To
\*     surface the bug we use the LIVENESS property.
\*
\*   * LIVENESS VIOLATED on EventuallyWorkerUnpinned. The worker
\*     pin never transitions to "Unpinned" because the broadcast
\*     never sees D. This is the EXACT class behind the pin/BIS
\*     leak audit — a wrapper that silently swallows the
\*     drain_stable_digests delegation produces an unpin signal
\*     that never fires.
\*
\*   * Optional: comment out the EventuallyWorkerUnpinned property
\*     and uncomment NoStaleWorkerPinUnderProduction-with-leafState=Recorded
\*     for a pure-safety variant (modify the spec's invariant to drop
\*     the "D" \in broadcastSeen guard). Out of scope here.

SPECIFICATION Spec

CONSTANTS
    BugMode = TRUE

INVARIANTS
    TypeOK
    BroadcastSeesEveryLeafProduction
    BugMatchesWrapperDelegation

PROPERTIES
    EventuallyWorkerUnpinned

CHECK_DEADLOCK FALSE
