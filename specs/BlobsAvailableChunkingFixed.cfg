\* BugMode = FALSE: Path A POST-FIX (defer wipe to is_last=true PLUS
\* sequence-completeness gate at commit time). Models the #99 behavior
\* with the invariant-prover BLOCK fix applied: terminal-with-gaps is
\* rejected (accumulator dropped, serverView unchanged) so half-applied
\* snapshots are structurally impossible.
\*
\* Expected TLC outcome:
\*   * INVARIANTS HOLD (TypeOK, LocalityMapMatchesEndpointOrPriorFull)
\*   * NO temporal property — under purely adversarial chunk-arrival
\*     ordering (the spec's `\E seq` lets any chunk arrive in any
\*     order, including terminal-first repeatedly), the system can be
\*     trapped in a reject-then-reconnect loop. In production, gRPC
\*     stream FIFO + chunker emit-in-order makes terminal-first an
\*     unreachable state, but the spec models the worst case to PROVE
\*     the safety invariant under all reorderings.
\*
\* CHECK_DEADLOCK = FALSE because SteadyState is a permitted terminal
\* (the spec models one broadcast cycle; a real worker would emit
\* the next broadcast on the next tick, but that's outside this
\* property's scope).

SPECIFICATION Spec

CONSTANTS
    NumChunks = 3
    BugMode = FALSE

INVARIANTS
    TypeOK
    LocalityMapMatchesEndpointOrPriorFull

CHECK_DEADLOCK FALSE
