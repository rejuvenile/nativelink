\* BugMode = FALSE: Path A (defer wipe to is_last=true). Models the
\* shipped #99 behavior. Mid-broadcast drop discards the partial
\* accumulator via drop_all_inflight; serverView is never a partial.
\*
\* Expected TLC outcome:
\*   * INVARIANTS HOLD (TypeOK, LocalityMapMatchesEndpointOrPriorFull)
\*   * TEMPORAL HOLDS (EventuallyConverges via WF_vars on DeliverChunk).
\*
\* CHECK_DEADLOCK = FALSE because SteadyState is a permitted terminal
\* (the spec models one broadcast cycle; a real worker would emit
\* the next broadcast on the next tick, but that's outside this
\* property's scope).

SPECIFICATION Spec

CONSTANTS
    NumChunks = 3
    BugMode = FALSE

INVARIANTS
    TypeOK
    LocalityMapMatchesEndpointOrPriorFull

PROPERTIES
    EventuallyConverges

CHECK_DEADLOCK FALSE
