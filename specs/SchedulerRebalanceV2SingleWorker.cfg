\* v2.2 no-wedge DEGENERATE fleet: single worker (no peer to overflow to). 1
\* worker p_count=1, capacity=2, 2 ops. Once it holds 1 action it is P-saturated
\* (Tier A empty — no other worker), but has a free E slot. Under the SOFT
\* fallback the 2nd op still dispatches to the sole worker (Tier B). NoWedge +
\* EventuallyDispatched MUST HOLD — the "no peer" degenerate cell.

SPECIFICATION Spec

CONSTANTS
  Workers = {"w1"}
  Ops = {"o1", "o2"}
  Capacity = 2
  AllowEvict = FALSE
  AllowLoadSat = TRUE
  GateOn = TRUE
  Fallback = "Soft"
  MaxToggles = 2
  PCoreCount <- PCoreCount_All1

INVARIANTS
  TypeOK
  I4_HeterogeneitySafe
  I5_Freshness
  CapacityRespected
  NoWedge

PROPERTIES
  EventuallyDispatched
