\* RETRY-BUDGET check. max_job_retries=3 (prod default), up to 3 bounded
\* backpressure events. Checks attempts stay bounded, over-budget ops are
\* terminal, and the op ALWAYS eventually reaches Completed (no infinite
\* retry loop) once backpressure stops.

SPECIFICATION Spec

CONSTANTS
  MaxJobRetries = 3
  MaxBackpressure = 3

INVARIANTS
  TypeOK
  AttemptsBounded
  OverBudgetIsTerminal

PROPERTIES
  EventuallyTerminal
