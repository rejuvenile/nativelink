\* FIX at the REAL prod worker shape: total-core gate, p_core_count = 4,
\* e_core_count = 6 (10 processors), 2 workers, 10 queued actions, RAM never
\* binds.
\*
\* Total-core capacity = 2 * 10 = 20 >= 10 actions, so all work is placed onto
\* the (P + E) processors; the only fixpoints have an empty queue.
\*
\* EXPECT: no error.  WorkConserving, NoProcessorOversubscription (<= 10/worker)
\* and NoRamOverflow all hold at the real fleet shape.

SPECIFICATION Spec

CONSTANTS
  Workers = {w1, w2}
  Actions = {a1, a2, a3, a4, a5, a6, a7, a8, a9, a10}
  PCoreCount = 4
  ECoreCount = 6
  RamCap = 1000
  ActionRamEach = 1
  GateMode = "TotalCore"

\* No SYMMETRY here: Permutations(Actions) with 10 actions = 10! > 1e6 elements
\* (TLC set-construction cap).  The raw state space (3^10) is tiny, so full
\* enumeration without symmetry is fast.

INVARIANTS
  TypeOK
  NoProcessorOversubscription
  NoRamOverflow
  WorkConserving
