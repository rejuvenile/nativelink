\* StreamingBlobReadDuringWrite_1w_4r_2c.cfg — RDW-stress config.
\*
\* 1 writer x 4 concurrent readers x 2 chunks. Models the
\* read-during-write hot path where one in-flight upload is fan-read by
\* a fleet of consumers (production: parallel Bazel BS::read consumers
\* on a single in-flight upload). Post-fix composition.
\*
\* SAFETY claim shape: same as Fixed.cfg — the spec's race model admits
\* DoneSilent* observations in the race-loser case, so the strong "no
\* silent under post-fix" invariants are NOT listed.
\*
\* Informational config (not classified as Fixed by verify_tla.sh).

SPECIFICATION Spec

\* NOTE: state-space explodes superlinearly in NumReaders. 5 readers x
\* 2 chunks with full failure modes ON exceeds the 300 s informational
\* budget — TLC was observed at ~1.5M states / ~5min and still
\* exploring without violations. Reduced to 4 readers; safety is still
\* exercised under high RDW fan-out.
CONSTANTS
    Readers = {r1, r2, r3, r4}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = TRUE
    SilentZeroPropOn = TRUE

INVARIANTS
    TypeOK
    CursorBoundedByChunkCount
    NoCorruptBytesToReader
    ReaderOkImpliesWriterFullOk
    PostFixFullOkReachesReaderAsOk
    CursorAtMostChunkCountAtTerminal

\* No PROPERTIES — informational safety-only run. Liveness with 4
\* readers + writer drop/err arms exceeds the gate budget. The 2-reader
\* Fixed cfg exercises every liveness property.
CHECK_DEADLOCK FALSE
