\* BUGGED: chunk_count.fetch_add hoisted ABOVE chunks.push_back.
\* Expect CountNeverAheadOfBuffer + NoReaderPhantom to be VIOLATED:
\* a reader interleaves in the mid-chunk gap, sees cursor < chunkCount
\* while cursor >= bufferLen, and indexes a not-yet-buffered chunk.
CONSTANTS
    Readers = {r1}
    NumChunks = 2
    PushBeforeCount = FALSE

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    CountNeverAheadOfBuffer
    NoReaderPhantom
