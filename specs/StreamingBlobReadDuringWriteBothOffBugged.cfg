\* StreamingBlobReadDuringWriteBothOffBugged.cfg — both #500 and #502
\* defenses simultaneously OFF.
\*
\* This is the cross-product cell missing from the pre-revision matrix:
\* `ShortShieldOn = FALSE /\ SilentZeroPropOn = FALSE`. Per the
\* 2026-05-08 debacle RCA pattern in CLAUDE.md "Admission/Eviction/Pin
\* Composability": each defense was reviewed in isolation; the composite
\* (both off) was not. This cfg verifies the model behaves correctly
\* when BOTH defenses are degraded.
\*
\* Filename suffix `BothOffBugged.cfg` matches the verify_tla.sh
\* classifier glob `*Bugged.cfg`, so this cfg IS gate-classified
\* (unlike `_BuggedSilentZero.cfg` which uses underscore-prefix and
\* gets informational treatment).
\*
\* CONSTANTS exercise ALL writer terminal arms (ShortEof, ErrEof,
\* DropWithoutEof) so every reader-side observation path is reachable.
\*
\* Expected: BOTH `NoSilentZeroToReader` AND `NoSilentShortToReader`
\* are VIOLATED. The first to fire suffices for the gate's
\* "expected violation" classification. Trace shape: writer takes the
\* shortest path to a terminal (e.g. WriterShortEof at chunkCount=0),
\* reader subscribes, observes terminal=Ok with bytesWritten=0 AND
\* ShortShieldOn=FALSE, classifier returns DoneSilentZero —
\* `NoSilentZeroToReader` violated at depth 2-4.
\*
\* Composite-failure signature: this cfg is the "both corners of the
\* triangle missing" cell. If a future spec edit accidentally makes
\* either Silent* state unreachable when both defenses are off (e.g.
\* by adding a third defense that subsumes the original two), this cfg
\* would flip from violated to clean, and the gate would FAIL — which
\* is the desired regression signal.
\*
\* Liveness PROPERTY DELIBERATELY OMITTED — same rationale as the
\* sibling Bugged.cfg: TLC terminates on the safety violation at depth 4
\* BEFORE the liveness pass runs, so the PROPERTY would be decorative.
\* The Fixed cfg verifies liveness, where the safety state is clean and
\* TLC reaches the liveness pass.

SPECIFICATION Spec

CONSTANTS
    Readers = {r1, r2}
    NumChunks = 2
    AllowShortEof = TRUE
    AllowErrEof = TRUE
    AllowDropWithoutEof = TRUE
    ShortShieldOn = FALSE
    SilentZeroPropOn = FALSE

INVARIANTS
    TypeOK
    CursorBoundedByChunkCount
    NoSilentZeroToReader
    NoSilentShortToReader

CHECK_DEADLOCK FALSE
