[package]
edition = "2024"
name = "nativelink-benchmarks"
rust-version = "1.87.0"
version = "0.1.0"
publish = false
description = "Data-plane benchmark harness for NativeLink (#495 Phase 1: v3-anchoring smoke cells)."

[[bin]]
name = "data_plane_bench"
path = "src/bin/data_plane_bench.rs"

[features]
default = []
# `chunked_fast_slow` is required for the W3 / R5 v3-anchoring cells that
# exercise the per-digest `Notify` + reaper-publish ownership paths added
# in the 2026-05-15 v3 bundle. Without it those cells short-circuit with
# a runtime "scenario disabled" marker in the JSON output.
chunked_fast_slow = [
  "nativelink-service/chunked_fast_slow",
  "nativelink-store/chunked_fast_slow",
  "nativelink-service/test-utils",
  "nativelink-store/test-utils",
]
# #538/#539: forwards the `bench-trace` feature into `nativelink-service`
# and `nativelink-store` so the W3 chunked-v2 hot-path probes
# (`_w3_probe_*_start = Instant::now()` + matching `info!` emits) fire
# during bench runs. Default OFF; the standard `just bench-data-plane`
# recipe does NOT enable this — production parity (no probes) is the
# baseline. Enable for ad-hoc deep-dive runs:
#   cargo run --release --bin data_plane_bench -p nativelink-benchmarks \
#     --features chunked_fast_slow,bench-trace -- --filter w3
# Verification: `strings target/release/data_plane_bench |
#   grep -c 'w3_probe'` is 0 without the feature, >0 with.
bench-trace = [
  "nativelink-service/bench-trace",
  "nativelink-store/bench-trace",
]

[dependencies]
bytes = { version = "1.10.1", default-features = false }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.35", features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
], default-features = false }
futures = { version = "0.3.31", default-features = false }
hostname = { version = "0.4.0", default-features = false }
# #585: match production allocator. `src/bin/nativelink.rs:90-91` installs
# mimalloc as the global allocator; the bench previously used system malloc,
# which diverges 5-20% on hot allocation paths (Bytes per chunk, MemoryStore
# moka churn). Mirroring production removes that source of measurement
# noise. Version pinned to the same `0.1.44` + `override`,`v3` features as
# the workspace declaration in the root `Cargo.toml`.
mimalloc = { version = "0.1.44", default-features = false, features = ["override", "v3"] }
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-service = { path = "../nativelink-service" }
nativelink-store = { path = "../nativelink-store" }
nativelink-util = { path = "../nativelink-util" }
# #541: the W3 / W3f cells construct the three production durability
# sinks (stable_digests pusher, failed_writes inserter, chunked_in_flight
# refcount map) inline so the chunked-v2 commit path pays the same
# per-iter bookkeeping cost it pays in production. The
# `ChunkedInFlightMap` type alias in `nativelink-store` is
# `Arc<parking_lot::Mutex<HashMap<...>>>`; constructing it requires
# `parking_lot::Mutex` directly. Pinned to the same `0.12.3` the
# nativelink-* crates depend on so the lockfile doesn't bifurcate.
parking_lot = { version = "0.12.3", default-features = false }
# Used by the A2 (AC update) cells to serialize an `ActionResult` proto
# before calling `update_oneshot` — mirrors the `prost::Message::encode`
# call in `nativelink-service/src/ac_server.rs::inner_update_action_result`.
prost = { version = "0.14.3", default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
sha2 = { version = "0.10.8", default-features = false, features = ["asm"] }
tempfile = { version = "3.15.0", default-features = false }
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "macros",
  "parking_lot",
  "rt-multi-thread",
  "time",
], default-features = false }
tokio-stream = { version = "0.1.17", features = ["net"], default-features = false }
tonic = { version = "0.14.5", features = [
  "transport",
], default-features = false }
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "env-filter"] }

# Linux-only: used by the R1 cold cell to detect tmpfs (statfs) and to
# best-effort evict cold blobs from the kernel page cache via
# `posix_fadvise(FADV_DONTNEED)` before timing reads. On non-Linux the
# cell falls back to "in_process_only" semantics with the tag set
# accordingly. Same dep version (`0.2.177`) as `nativelink-util` to
# avoid lockfile churn.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.177", default-features = false }

[lints]
workspace = true
