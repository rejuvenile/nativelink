#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-worker"
version = "1.0.0"

[features]
nix = []
pprof = ["nativelink-util/pprof"]
quic = ["dep:tonic-h3", "dep:quinn", "dep:h3-quinn", "dep:rcgen", "dep:rustls", "dep:socket2", "nativelink-util/quic", "nativelink-store/quic"]
failpoints = ["dep:fail", "fail/failpoints", "nativelink-store/failpoints", "nativelink-util/failpoints"]
# Test-only constructors (e.g. `BlobsAvailableState::from_test_args`).
# Production builds MUST NOT enable this feature.
test-utils = ["nativelink-store/test-utils"]

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-metric = { path = "../nativelink-metric" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-service = { path = "../nativelink-service" }
nativelink-store = { path = "../nativelink-store" }
nativelink-util = { path = "../nativelink-util" }

fail = { version = "0.5", optional = true }

async-lock = { version = "3.4.0", features = ["std"], default-features = false }
bytes = { version = "1.10.1", default-features = false }
filetime = { version = "0.2.25", default-features = false }
formatx = { version = "0.2.3", default-features = false }
futures = { version = "0.3.31", default-features = false }
hostname = { version = "0.4.0", default-features = false }
libc = { version = "0.2", default-features = false }
opentelemetry = { version = "0.31.0", default-features = false }
parking_lot = { version = "0.12.3", default-features = false }
prost = { version = "0.14.3", default-features = false }
prost-types = { version = "0.14.3", default-features = false }
relative-path = { version = "2.0.0", default-features = false, features = [
  "alloc",
  "std",
] }
scopeguard = { version = "1.2.0", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_json5 = { version = "0.2.1", default-features = false }
shlex = { version = "1.3.0", default-features = false }
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "process",
  "rt-multi-thread",
  "signal",
], default-features = false }
tokio-stream = { version = "0.1.17", default-features = false, features = [
  "fs",
] }
tonic = { version = "0.14.5", features = [
  "gzip",
  "tls-aws-lc",
  "transport",
], default-features = false }
tracing = { version = "0.1.41", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = [
  "serde",
  "v4",
] }
tonic-h3 = { version = "0.0.5", default-features = false, features = ["quinn"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
h3-quinn = { version = "0.0.10", default-features = false, optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
socket2 = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
nativelink-macro = { path = "../nativelink-macro" }
async-trait = { version = "0.1.88", default-features = false }
fail = { version = "0.5", features = ["failpoints"] }
# Layered on top of the regular tokio dep to add the `test-util` feature
# (gates `tokio::time::pause` / `start_paused`). Required by the FL-681
# deferred-upload retry-backoff tests in `running_actions_manager.rs` to
# measure the read-side vs remote-write backoff without wall-clock waits.
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "process",
  "rt-multi-thread",
  "signal",
  "test-util",
], default-features = false }

hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hyper = { version = "1.6.0", default-features = false }
pretty_assertions = { version = "1.4.1", features = [
  "std",
], default-features = false }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
serial_test = { version = "3.2.0", features = [
  "async",
], default-features = false }
tempfile = { version = "3.15.0", default-features = false }
tonic-prost = { version = "0.14.5", default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }

[package.metadata.cargo-machete]
# Used by nativelink_test macro
ignored = ["tracing-test"]

[[test]]
name = "blobs_in_stable_storage_handler_test"
required-features = ["test-utils"]

[[test]]
# (FL-688 v3 Stage A) No periodic full-snapshot heartbeat: uses
# MockWorkerApiClient + MockRunningActionsManager and the
# `send_periodic_blobs_available_for_test` seam, all gated behind
# `cfg(any(test, feature = "test-utils"))`.
name = "blobs_available_no_heartbeat_test"
required-features = ["test-utils"]

[[test]]
name = "bis_chunk_handler_test"
required-features = ["test-utils"]

[[test]]
# (FL-688 v3 §3.8) Uses `BlobsAvailableState::from_test_args` + the
# test-only resend-buffer accessors, all gated behind
# `cfg(any(test, feature = "test-utils"))`.
name = "blobs_available_ack_test"
required-features = ["test-utils"]

[[test]]
# (FL-688 v3 §3.8 drain-on-ack flip) End-to-end convergence proof for the
# per-tick replay reader. Drives `send_periodic_blobs_available_for_test` +
# `test_record_added_digest` + the resend-buffer accessors, all gated
# behind `cfg(any(test, feature = "test-utils"))`, plus the real
# server-side `BlobsAvailableAccumulator` + `BlobLocalityMap`.
name = "blobs_available_replay_test"
required-features = ["test-utils"]

[[test]]
# (#97) `bis_chunked_dispatch_arm_round_trips_ack` constructs a
# `BlobsAvailableState::from_test_args`, which is gated behind
# `cfg(any(test, feature = "test-utils"))`. Cfg-test alone doesn't
# propagate from the lib into integration tests, so we need the
# feature explicitly here.
name = "local_worker_test"
required-features = ["test-utils"]

[[test]]
name = "download_to_directory_mirror_test"
required-features = ["test-utils"]

[[test]]
name = "end_to_end_mirror_reconciliation_test"
required-features = ["test-utils"]

[[test]]
# (#FL-688 §4) Drives the production backfill handler
# `handle_upload_missing_blobs` via the
# `handle_upload_missing_blobs_for_test` seam (gated behind `test-utils`)
# and `MockRunningActionsManager::set_cas_store`, both `cfg(test-utils)`.
name = "backfill_upload_requeue_test"
required-features = ["test-utils"]

[[test]]
# (#FL-688 B) End-to-end wire-header seam: drives the production backfill
# handler over FastSlowStore{slow: real GrpcStore → in-proc tonic server} and
# asserts the upload RPC carries `x-nativelink-worker=1`. Uses the same
# `handle_upload_missing_blobs_for_test` / `MockRunningActionsManager` seams
# (gated behind `test-utils`).
name = "backfill_is_worker_header_seam_test"
required-features = ["test-utils"]

[[test]]
# `bis_ac_routing_test` constructs `BlobsAvailableState::from_test_args` with an
# `ac_mirror_target`, gated behind `cfg(any(test, feature = "test-utils"))`.
# Without this `[[test]]` entry the default `cargo test -p nativelink-worker`
# invocation red-fails with E0599 on the constructor. Mirror the pattern used by
# the other BIS tests above.
name = "bis_ac_routing_test"
required-features = ["test-utils"]

[[test]]
# (#99 S2) Worker-crate seam test for the chunked BlobsAvailable emit
# path. Pulls in `tests/utils/local_worker_test_utils.rs` whose
# `MockRunningActionsManager` import path requires the same `test-utils`
# feature gate as the other utils-using tests above.
name = "blobs_available_chunked_handler_test"
required-features = ["test-utils"]

[[test]]
# (#O15) Pulls in `tests/utils/local_worker_test_utils.rs`; gated
# behind `test-utils` like the other utils-using tests above.
name = "ac_write_detach_test"
required-features = ["test-utils"]

[[test]]
# (FU-8) O5 concurrency contract: `o5_overlap_c_runs_while_b2_blocked` calls
# `install_batch_read_test_gate()` which is gated behind `test-utils`.
# The default `cargo test -p nativelink-worker` build (no features) would
# fail with E0425 on the missing symbol; this stanza ensures the test is
# only compiled and run when the feature is present.
name = "running_actions_manager_test"
required-features = ["test-utils"]

[[test]]
# (O2) Control-plane channel capacity tests: constant-value guard,
# concurrency-without-serialization proof, and FIFO ordering verification.
# No test-utils required — uses the real WorkerApiClientWrapper directly.
name = "o2_channel_capacity_test"

[[test]]
# (#FL-688 W6) Drives the REAL `spawn_upload_to_remote` give-up arm
# end-to-end via the `spawn_upload_to_remote_for_test` JoinHandle seam,
# which is gated behind `cfg(any(test, feature = "test-utils"))`.
name = "w6_sync_giveup_requeue_test"
required-features = ["test-utils"]

[[test]]
# (M1 publish-closure seam) Uses `utils::local_worker_test_utils::setup_local_worker`,
# which calls `LocalWorker::set_ac_write_semaphore_for_test` — gated behind
# `cfg(any(test, feature = "test-utils"))`. Without this entry a plain
# `cargo test -p nativelink-worker` builds the auto-discovered target and fails.
name = "kill_upload_tail_publish_seam_test"
required-features = ["test-utils"]
