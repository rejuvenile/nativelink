syntax = "proto3";

package com.github.trace_machina.nativelink.remote_execution;

import "com/github/trace_machina/nativelink/remote_execution/worker_api.proto";

/// #212 v4.5: NativeLink-owned extensions to the standard REAPI CAS-side
/// surface. Lives in its OWN service (NOT WorkerApi) so it can be
/// registered on the same listener as the upstream Bazel `cas` /
/// `bytestream` services — the worker's only outbound channel from
/// `GrpcStore` is to the configured CAS endpoint (e.g. port 50071 in
/// production), and the WorkerApi service is registered on a DIFFERENT
/// listener (e.g. port 50061), so worker→server `WriteChunked` calls
/// MUST be routed through this service to reach the CAS-port handler.
///
/// `WriteChunk` and `WriteChunkedResponse` are reused from
/// `worker_api.proto` (the proto package is the same; the messages are
/// shared schema). Only the routing changes.
service CasExtensions {
    /// #212 chunked streaming-write RPC. Worker (or any peer that we
    /// control both sides of, per design Q1=(b)) opens a client-streaming
    /// upload of one CAS blob as a sequence of `WriteChunk` messages.
    /// Server admits each chunk to a per-blob driver task that performs
    /// `pwrite`-at-offset on a sparse partial file, tracks coverage
    /// in an in-memory bitmap, and on the `finish_chunk=true` message
    /// commits the partial via atomic rename + end-to-end SHA-256
    /// verification. Returns the committed digest + size on success.
    ///
    /// Behind `chunked_fast_slow` feature flag (default OFF). The server
    /// returns `Code::Unimplemented` if the feature is off; clients must
    /// gate calls on a capability discovery mechanism (Phase 2.6).
    ///
    /// **Single-writer-per-digest:** if another stream is concurrently
    /// writing the SAME digest, this RPC rejects with `Code::Aborted`
    /// + a `BackpressureSignal` retry hint. For multi-writer chunk-race
    /// semantics (cross-writer chunk dedup, out-of-order commit) use
    /// `WriteChunkedV2` instead.
    rpc WriteChunked(stream WriteChunk) returns (WriteChunkedResponse);

    /// #494-v3 Phase 2: bidi-streaming chunked-write RPC with per-digest
    /// multi-writer chunk-race semantics. Up to N writers may concurrently
    /// upload the SAME digest; the server admits chunks per-offset and
    /// emits per-chunk acks back through the response stream. Bit-identical
    /// chunks (per the position-based `chunked_client::collect_and_hash_chunks`
    /// chunker invariant) make per-chunk dedup safe — any chunk at offset
    /// O for digest D has exactly one valid byte-sequence, so the writer
    /// that lands first wins; concurrent writers' duplicate-offset
    /// chunks are discarded as `RACING_LOSER`.
    ///
    /// Wire shape:
    /// - Request stream: same `WriteChunk` schema as v1; server learns
    ///   the digest from the first frame.
    /// - Response stream: zero or more `WriteChunkedAck` frames followed
    ///   by exactly ONE `WriteChunkedResponse` final frame on success.
    ///   On error, the server returns the gRPC `Status` and may have
    ///   emitted zero or more acks before tearing down.
    ///
    /// Wasted bandwidth bound: up to ~256 MiB/writer/digest (one full
    /// blob worth of `RACING_LOSER` acks if a slow writer races a fast
    /// writer to every chunk). Acceptable per #494-v3 design 2026-05-15.
    ///
    /// Backwards compatibility: clients that don't speak v2 keep using
    /// the unary `WriteChunked` RPC; servers that don't support v2 return
    /// `Code::Unimplemented` and clients fall back.
    rpc WriteChunkedV2(stream WriteChunk) returns (stream WriteChunkedFrame);
}
