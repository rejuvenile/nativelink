syntax = "proto3";

package com.github.trace_machina.nativelink.remote_execution;

import "build/bazel/remote/execution/v2/remote_execution.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

/// This API describes how schedulers communicate with Worker nodes.
///
/// When a worker node comes online it must be pre-configured with the
/// endpoint of the scheduler it will register with. Once the worker
/// connects to the scheduler it must send a `ConnectWorkerRequest`
/// command to the scheduler. The scheduler will then use this information
/// to determine which jobs the worker can process.
service WorkerApi {
    /// Registers this worker and informs the scheduler what properties
    /// this worker supports. The response must be listened on the client
    /// side for updates from the server.  This is performed as a single
    /// bi-directional call to ensure that the worker is always talking to the
    /// same scheduler instance even if there's a load balancer in front.
    /// The first message on the UpdateForScheduler stream will be a
    /// ConnectWorkerRequest which will notify the scheduler of the available
    /// properties and the first response will be a ConnectionResult to tell
    /// the worker what worker ID to place in action results.
    rpc ConnectWorker(stream UpdateForScheduler) returns (stream UpdateForWorker);

    // #212 v4.5: WriteChunked moved to the CasExtensions service in
    // cas_extensions.proto so it routes via the worker's outbound
    // CAS-endpoint channel. The WorkerApi-listener (port 50061) is
    // never reachable from a worker's GrpcStore (which only knows the
    // configured CAS endpoint, port 50071). The schema messages
    // `WriteChunk` and `WriteChunkedResponse` remain defined below
    // because they are still in the same proto package and are
    // referenced by the new service.
}

/// Request object for keep alive requests.
message KeepAliveRequest {
    reserved 1; // NextId.
    /// CPU utilization percentage (0-100), sampled every 100ms.
    /// 0 means unknown (old workers that don't report load).
    uint32 cpu_load_pct = 2;
    /// Performance-core CPU utilization percentage (0-100).
    /// 0 means unknown (Linux or non-heterogeneous CPU).
    uint32 p_core_load_pct = 3;
    /// Efficiency-core CPU utilization percentage (0-100).
    /// 0 means unknown. 100 when no E-cores exist (P-core-only CPU).
    uint32 e_core_load_pct = 4;
}

/// Request object for going away requests.
message GoingAwayRequest {
    reserved 1; // NextId.
}

/// Represents the initial request sent to the scheduler informing the
/// scheduler about this worker's capabilities and metadata.
message ConnectWorkerRequest {
    /// The list of properties this worker can support. The exact
    /// implementation is driven by the configuration matrix between the
    /// worker and scheduler.
    ///
    /// The scheduler may reject this worker if any property keys that
    /// the scheduler is not configured to support, or may simply ignore
    /// the unsupported properties.
    ///
    /// The details on how to use this property can be found here:
    /// https://github.com/TraceMachina/nativelink/blob/3147265047544572e3483c985e4aab0f9fdded38/nativelink-config/src/cas_server.rs
    repeated build.bazel.remote.execution.v2.Platform.Property properties = 1;

    /// Prefix to use for worker IDs. This is primarily used for debugging
    /// or for other systems to identify workers. The scheduler will always
    /// append this prefix to the assigned worker_id followed by a UUIDv6.
    string worker_id_prefix = 2;

    /// Maximum number of inflight tasks this worker can cope with at one time
    /// The default (0) means unlimited.
    uint64 max_inflight_tasks = 3;

    /// This worker's CAS gRPC endpoint for peer blob serving.
    /// If set, other workers can fetch blobs directly from this worker.
    /// Example: "grpc://192.168.100.5:50081"
    string cas_endpoint = 5;

    /// Process-lifetime identifier for this worker, generated fresh at
    /// process start and stable across reconnects within a single run.
    /// The scheduler uses this to detect a NEW process registering on
    /// a recycled CAS endpoint (e.g. after OOM / kill -9 / panic) and
    /// wipe its prior locality_map entries — those entries point to
    /// `mirror_blobs` that lived only in the dead process's memory.
    ///
    /// Backward compatibility: workers built before this field exists
    /// will leave it as the proto3 default `0`. The scheduler treats
    /// `0` as "always different" (conservative wipe on reconnect) so
    /// stale locality data from the old binary cannot survive.
    /// (#141: boot_epoch_id one-way wipe on worker restart)
    uint64 boot_epoch_id = 7;

    /// Identifier for the worker's binary build, computed by the worker
    /// at startup. The current implementation reads `/proc/self/exe`
    /// (or `current_exe()` on macOS) and emits a truncated SHA-256 hex
    /// digest of the binary contents (first 16 hex chars / 64 bits).
    /// Empty string ("") for legacy workers built before this field
    /// existed, OR for any worker that failed to read its own binary
    /// at startup (best-effort; failure does NOT crash the worker).
    ///
    /// The scheduler validates this against its configured
    /// `compatible_build_shas` allowlist (`WorkerApiConfig`); on
    /// mismatch the connection is rejected with
    /// `Code::FailedPrecondition`. The validation is OPT-IN — if the
    /// allowlist is empty/None on the server, all build SHAs (including
    /// "") are accepted.
    ///
    /// (#216: stale-worker detection — server rejects workers on
    /// incompatible builds)
    string build_sha = 8;

    reserved 4;
    reserved 6;
}

/// Per-digest info reported by workers in BlobsAvailableNotification.
/// The previous `last_access_timestamp` field has been retired now that the
/// scheduler trusts the locality map until explicit eviction; the tag is
/// reserved so old workers stay wire-compatible.
message BlobDigestInfo {
    /// The digest of the blob.
    build.bazel.remote.execution.v2.Digest digest = 1;
    reserved 2;
    reserved "last_access_timestamp";
}

/// Notification that blobs are available on a worker for peer serving.
message BlobsAvailableNotification {
    /// The worker's CAS endpoint where these blobs can be fetched.
    string worker_cas_endpoint = 1;
    /// The digests of newly available blobs (kept for backward compat / simple notifications).
    repeated build.bazel.remote.execution.v2.Digest digests = 2;
    /// If true, this is a full snapshot of all blobs in the worker's cache.
    /// The server should replace its entire view for this endpoint with the
    /// contents of this message (digest_infos + digests). If false, this is
    /// an incremental update (new blobs only).
    bool is_full_snapshot = 3;
    /// Digests that have been evicted from the worker since the last update.
    /// Only meaningful when is_full_snapshot == false.
    repeated build.bazel.remote.execution.v2.Digest evicted_digests = 4;
    /// Per-digest info with LRU timestamps. When present, the server should
    /// prefer this over the plain `digests` field.
    repeated BlobDigestInfo digest_infos = 5;
    /// CPU utilization percentage (0-100), sampled every 100ms.
    /// 0 means unknown (old workers that don't report load).
    uint32 cpu_load_pct = 6;
    /// Digests of input root directories that are cached in this worker's
    /// directory cache. The scheduler can give routing preference to workers
    /// that already have the action's input_root_digest cached.
    /// Also used for the full subtree snapshot (when is_full_subtree_snapshot=true,
    /// this contains ALL directory digests including subtrees).
    repeated build.bazel.remote.execution.v2.Digest cached_directory_digests = 7;

    /// Delta-encoded subtree updates since last notification.
    /// When a cache entry is added, send ALL directory digests in its merkle tree.
    /// When a cache entry is evicted, send ALL directory digests that were removed
    /// (only those no longer present in ANY cached entry's merkle tree).
    repeated build.bazel.remote.execution.v2.Digest added_subtree_digests = 8;
    repeated build.bazel.remote.execution.v2.Digest removed_subtree_digests = 9;

    /// True on the first notification after (re)connect — scheduler should
    /// replace its cached_subtree_digests state rather than applying a delta.
    /// In this case, cached_directory_digests (field 7) contains the full set
    /// of all subtree digests.
    bool is_full_subtree_snapshot = 10;
    /// Performance-core CPU utilization percentage (0-100).
    /// 0 means unknown (Linux or non-heterogeneous CPU).
    uint32 p_core_load_pct = 11;
    /// Efficiency-core CPU utilization percentage (0-100).
    /// 0 means unknown. 100 when no E-cores exist (P-core-only CPU).
    uint32 e_core_load_pct = 12;

    /// Digests of blobs the worker is holding pinned in memory as a server
    /// mirror (received via x-nativelink-mirror writes). The worker has no
    /// disk copy and the server may not have a stable copy yet — the worker
    /// is the only durable holder.
    ///
    /// On receiving these, the server MUST:
    ///   1. Register them in the locality map (so reads can find them),
    ///   2. For digests it does not already have stably stored, request an
    ///      `UploadMissingBlobs` so the worker uploads the bytes back to the
    ///      server's slow store.
    /// Once the server has stably stored a digest it will broadcast a
    /// `BlobsInStableStorage` for it; only that signal causes the worker to
    /// drop the pin. This protects mirror blobs across server restarts —
    /// the worker holds the only copy until the server is ready to receive.
    repeated build.bazel.remote.execution.v2.Digest pinned_mirror_digests = 13;

    /// Current `mirror_blobs` total bytes held in memory on this worker.
    /// Reported on every BlobsAvailable so the server's mirror writer
    /// (`WorkerProxyStore`) can pre-check capacity before consuming a
    /// source stream. `0` is reported by workers that don't have a CAS
    /// server / mirror store (the absence of a pin map is indistinguishable
    /// from "currently empty"); the server's picker treats `0` as
    /// unknown when paired with `mirror_max_bytes = 0`.
    uint64 mirror_used_bytes = 14;
    /// Configured `MIRROR_BLOBS_MAX_BYTES` cap on this worker. `0`
    /// means unknown — the picker disables the capacity filter for
    /// this endpoint.
    uint64 mirror_max_bytes = 15;

    /// CURRENT snapshot of dispatcher-pushed mirror pins per source store.
    /// Sorted by `store_id` ASCII so the server can binary-search per
    /// FastSlowStore's `store_id` slice in `observe_pinned_mirror_ack`.
    ///
    /// DIFFERENT SEMANTICS from field 13 (`pinned_mirror_digests`).
    /// Field 13 carries the per-tick DELTA of newly-acquired mirror
    /// digests; the server reaction registers locality entries AND
    /// triggers `request_missing_blob_uploads` (BACKFILL_COOLDOWN
    /// bypass). Field 16 carries the FULL CURRENT snapshot of pins
    /// the dispatcher pushed; the server reaction broadcasts to all
    /// registered FastSlowStores via `observe_pinned_mirror_ack`,
    /// each of which binary-searches its own `store_id` region and
    /// removes server-side `EphemeralServerSidePin` entries that are
    /// now confirmed held on the worker.
    ///
    /// Both fields coexist on the wire and have distinct lifetimes —
    /// do NOT conflate.
    repeated MirrorPinEntry pinned_mirror_entries = 16;

    /// Worker-local AC entries the worker has just written to its AC
    /// FastSlowStore's fast tier (and that may still be in flight to the
    /// AC slow tier on the server). Sorted by `store_id` ASCII so the
    /// server-side registry insertion is deterministic. Reuses the
    /// `MirrorPinEntry` shape — only the field-number / semantic channel
    /// differs from `pinned_mirror_entries` (field 16).
    ///
    /// CRITICAL: this field is HARD-PARTITIONED from `pinned_mirror_entries`
    /// at every consumer. AC pins MUST NOT route into the CAS-shared
    /// `BlobLocalityMap` because `action_digest` IS by REAPI design the
    /// same digest as the Action proto in CAS — registering AC pins
    /// against the locality map would cause the server's CAS upload
    /// short-circuits (`bytestream_server::write` /
    /// `cas_server::batch_update_blobs`) to silently skip uploads of
    /// the Action proto bytes, producing permanent data loss. The
    /// server-side AC pin registry is intentionally a separate
    /// data structure with no CAS-side reader.
    ///
    /// Read-side wiring (a future commit) will land an AC peer-fetch
    /// path that consults this registry directly. With no consumer
    /// today, the registry exists purely to (a) establish the wire
    /// channel before the read-side change, and (b) allow
    /// observability tooling to surface AC pin distribution per worker.
    repeated MirrorPinEntry pinned_ac_mirror_entries = 17;
}

/// One entry of `BlobsAvailableNotification.pinned_mirror_entries`.
/// Identifies a server-side dispatcher-pushed mirror pin by `(store_id,
/// digest)`. The `store_id` matches the source FastSlowStore that
/// `SmallBlobDispatcher` pushed the blob from; the server's broadcast
/// to all registered FastSlowStores routes via this string.
message MirrorPinEntry {
    /// The digest the worker now holds in its `mirror_blobs` map.
    build.bazel.remote.execution.v2.Digest digest = 1;
    /// The source FastSlowStore identifier (matches the per-store config
    /// `store_id`). Used by `observe_pinned_mirror_ack` to scope the
    /// unpin to the SOURCE store. Validated server-side as non-empty +
    /// `[a-zA-Z_][a-zA-Z0-9_]*` (Rust-ident rules; relaxed from the
    /// original lowercase-only spec to accept production names like
    /// `cas_STORE`; see #168).
    string store_id = 2;
}

/// One blob entry in a `BatchWriteSmallBlobsRequest`. Carries the digest,
/// payload bytes, and source `store_id` so the worker can route the write
/// to the correct `mirror_blobs` slot keyed by `(store_id, digest)`.
message SmallBlobEntry {
    /// The digest of the blob being pushed. The worker MUST verify
    /// `data.len() == digest.size_bytes()` (the existing
    /// `insert_mirror_blob` invariant) before accepting.
    build.bazel.remote.execution.v2.Digest digest = 1;
    /// The blob bytes. Capped at `SMALL_BLOB_THRESHOLD` per the
    /// dispatcher precondition (16 KiB by default).
    bytes data = 2;
    /// The source FastSlowStore identifier so the worker can key the
    /// resulting `mirror_blobs` entry by `(store_id, digest)`. Empty or
    /// invalid `store_id` causes the worker to reject the entry.
    string store_id = 3;
}

/// A batch of small-blob writes pushed from the server's
/// `SmallBlobDispatcher` to a worker. The worker writes each entry into
/// `mirror_blobs` keyed by `(store_id, digest)`. The dispatcher uses
/// zero-window opportunistic coalesce, so a single batch may contain
/// 1..N entries from a short producer burst.
message BatchWriteSmallBlobsRequest {
    /// The blob entries in this batch. Bounded by `max_batch_bytes`
    /// (default 256 KiB ⇒ ~16 entries at 16 KiB max).
    repeated SmallBlobEntry blobs = 1;
}

/// Notification that blobs have been evicted from a worker.
message BlobsEvictedNotification {
    /// The worker's CAS endpoint from which these blobs were evicted.
    string worker_cas_endpoint = 1;
    /// The digests of evicted blobs.
    repeated build.bazel.remote.execution.v2.Digest digests = 2;
}

/// Request to touch (update access time) blobs on a worker to prevent eviction.
message TouchBlobsRequest {
    /// The digests of blobs to touch.
    repeated build.bazel.remote.execution.v2.Digest digests = 1;
}

/// Sent by the server to a worker requesting upload of blobs that are
/// present on the worker but missing from the server's CAS. The worker
/// should read each blob from its local FilesystemStore and upload it
/// to the server via the existing GrpcStore (slow store) connection.
message UploadMissingBlobsRequest {
    /// Digests of blobs the server needs the worker to upload.
    repeated build.bazel.remote.execution.v2.Digest digests = 1;
}

/// A hint that a specific digest is available on one or more peer workers.
message PeerHint {
    /// The digest available on peers.
    build.bazel.remote.execution.v2.Digest digest = 1;
    /// gRPC endpoints of workers that have this blob.
    repeated string peer_endpoints = 2;
}

/// One chunk of a streaming peer-hints emission. Carries up to
/// `PEER_HINTS_PER_CHUNK` `PeerHint` entries plus the operation_id the
/// hints were generated for (informational only — the worker does NOT key
/// any state by operation_id; hints register directly into the worker's
/// global `peer_locality_map` as chunks arrive). `sequence` is monotonic
/// 0,1,2,... within one stream and `is_last` marks the terminal chunk.
///
/// Direct-merge design (2026-04-24): there is no per-action buffer, no
/// chunk-count field on `StartExecute`, no race between chunk arrival and
/// action dispatch. Chunks may arrive before, after, or interleaved with
/// `StartAction` for any operation_id; each chunk's hints become available
/// as soon as it's processed.
message PeerHintsChunk {
    /// Up to PEER_HINTS_PER_CHUNK hints (worker-side default: 256).
    repeated PeerHint peer_hints = 1;
    /// The scheduler-side operation_id these hints were generated for.
    /// Diagnostics-only; the worker doesn't key state on it.
    string operation_id = 2;
    /// Monotonic sequence within one operation_id's hint stream.
    uint32 sequence = 3;
    /// True on the FINAL chunk of one operation_id's stream. The final
    /// chunk MAY be empty (when `peer_hints.len() % PEER_HINTS_PER_CHUNK
    /// == 0`); receivers MUST tolerate that.
    bool is_last = 4;
}

/// One chunk of a streaming `BlobsInStableStorage` broadcast (task #97).
/// Carries up to `BIS_DIGESTS_PER_CHUNK` (server-side default: 4096 →
/// ~128 KiB on the wire) `Digest` entries plus a server-allocated
/// `broadcast_id` that identifies the broadcast-event the chunk belongs
/// to. The `(broadcast_id, sequence)` pair is what the worker acks via
/// `Update::BisAck` (see `UpdateForScheduler` below); the server uses it
/// to drop unacked chunks from its per-worker resend buffer.
///
/// Direct-merge design (mirrors task #98): there is no per-broadcast
/// buffer on the worker side — each chunk's digests are unpinned
/// immediately as the chunk arrives, and the worker emits a per-chunk
/// ack as soon as the unpins land. `is_last` marks the terminal chunk
/// of one broadcast; the empty-input case still emits a single
/// `is_last = true` chunk so the worker always sees a terminal marker
/// for diagnostics. Chunks of the SAME broadcast may arrive out of order
/// (after a reconnect-driven resend); each is independently meaningful,
/// and unpins are idempotent.
message BlobsInStableStorageChunk {
    /// Up to BIS_DIGESTS_PER_CHUNK digests (server-side default: 4096).
    repeated build.bazel.remote.execution.v2.Digest digests = 1;
    /// Server-allocated identifier of the broadcast event this chunk
    /// belongs to. Monotonic per-server-process; resets on server
    /// restart (workers see a brand-new sequence and ack normally).
    uint64 broadcast_id = 2;
    /// Monotonic sequence within one broadcast_id (0, 1, 2, ...).
    uint32 sequence = 3;
    /// True on the FINAL chunk of one broadcast_id's stream. The final
    /// chunk MAY be empty when `digests.len() % BIS_DIGESTS_PER_CHUNK
    /// == 0` (or the broadcast carried zero digests at all); receivers
    /// MUST tolerate that.
    bool is_last = 4;
    /// Server-generation nonce. Random u64 chosen at server startup;
    /// echoed back by the worker in the matching `BisAck.server_instance_token`.
    /// Without this, a worker holding a stale `BisAck { broadcast_id =
    /// 42 }` sent across a server bounce can drop an unrelated chunk
    /// from the new server's resend buffer (the new server resets
    /// `next_bis_broadcast_id` to 1 on startup → broadcast_id collisions
    /// across server-instance boundaries are guaranteed). The server
    /// silently discards acks whose token mismatches; the chunk simply
    /// retries on the next ack of a same-instance chunk. Field 5 is
    /// safe (BlobsInStableStorageChunk has no reserved tags). A value
    /// of 0 means "uninitialised / pre-#97-fixup worker"; the server
    /// MAY accept legacy acks during a fleet rev (currently fleet
    /// rev's all-at-once so 0 means a bug).
    uint64 server_instance_token = 5;
    /// Which worker-side store this chunk's digests belong to. Empty
    /// string ("") OR omitted (proto3 default) MUST be interpreted by
    /// the worker as "CAS server FastSlowStore" — the historic single-
    /// store wire shape, preserved for forward compatibility with
    /// pre-AC-BIS workers / servers. Non-empty `store_id` SHOULD match
    /// a configured AC store name on the worker (e.g. `"AC_MAIN_STORE"`);
    /// the worker routes the unpin to that store's
    /// `dispatched_mirror_pins` index via
    /// `FastSlowStore::remove_local_ac_pins`. Unknown / non-matching
    /// `store_id` is logged at `warn!` and the chunk is acked (so the
    /// server's resend buffer drains) — being asked to unpin against a
    /// store this worker doesn't know about is benign on the worker
    /// side.
    ///
    /// CRITICAL: the worker MUST route AC chunks to AC stores ONLY.
    /// Routing an AC chunk to the CAS FSS's `remove_mirror_blobs`
    /// would walk the CAS `mirror_blobs` byte map (zero overlap with
    /// AC entries) and would also walk the CAS `dispatched_mirror_pins`
    /// — wrong index. AC chunks have a separate handler.
    string store_id = 6;
}

/// A streaming-message envelope shared across the cas→worker, scheduler→
/// worker, and worker→scheduler chunk producers. Exactly ONE of the
/// `oneof payload` arms is set; receivers route on the arm.
///
/// Today's payloads (added incrementally per the streaming-design plan):
///   * `peer_hints` — task #98 (PR2)
///   * `blobs_in_stable_storage` — task #97 (PR1, this PR)
/// Reserved for follow-up PRs:
///   * `blobs_available` — task #99 (PR3)
message ChunkedMessage {
    oneof payload {
        PeerHintsChunk peer_hints = 1;
        BlobsInStableStorageChunk blobs_in_stable_storage = 2;
    }
}

/// The result of an ExecutionRequest.
message ExecuteResult {
    /// The `instance_name` this task was initially assigned to. This is set by the client
    /// that initially sent the job as part of the BRE protocol.
    string instance_name = 1;

    /// The operation ID that was executed.
    string operation_id = 2;

    /// The actual response data.
    oneof result {
        /// Result of the execution. See `build.bazel.remote.execution.v2.ExecuteResponse`
        /// for details.
        build.bazel.remote.execution.v2.ExecuteResponse execute_response = 3;

        /// An internal error. This is only present when an internal error happened that
        /// was not recoverable. If the execution job failed but at no fault of the worker
        /// it should not use this field and should send the error via execute_response.
        google.rpc.Status internal_error = 4;
    }

    reserved 5; // NextId.
}

/// The result of an ExecutionComplete.
message ExecuteComplete {
    /// The operation ID that was executed.
    string operation_id = 1;
    /// CPU utilization percentage (0-100), sampled every 100ms.
    /// 0 means unknown (old workers that don't report load).
    uint32 cpu_load_pct = 2;
    /// Performance-core CPU utilization percentage (0-100).
    /// 0 means unknown (Linux or non-heterogeneous CPU).
    uint32 p_core_load_pct = 3;
    /// Efficiency-core CPU utilization percentage (0-100).
    /// 0 means unknown. 100 when no E-cores exist (P-core-only CPU).
    uint32 e_core_load_pct = 4;
}

/// Result sent back from the server when a node connects.
message ConnectionResult {
    /// The worker ID to place in the action results generated by this worker.
    string worker_id = 1;

    reserved 2; // NextId.
}

/// Sent by the server to workers to confirm that blobs have been
/// persisted to stable storage (FilesystemStore, not just MemoryStore).
/// Workers should unpin matching blobs from their local CAS.
message BlobsInStableStorage {
    repeated build.bazel.remote.execution.v2.Digest digests = 1;
}

/// Request to kill a running operation sent from the scheduler to a worker.
message KillOperationRequest {
    /// The the operation id for the operation to be killed.
    string operation_id = 1;
    reserved 2; // NextId.
}
/// Communication from the scheduler to the worker.
message UpdateForWorker {
    oneof update {
        /// This will be sent only as the first item in the stream after the node
        /// has connected.
        ConnectionResult connection_result = 1;

        /// Message used to let the worker know that it is still alive as well
        /// as check to see if the worker is still alive. The worker
        /// may close the connection if the scheduler has not sent any messages
        /// after some amount of time (configured in the scheduler's
        /// configuration).
        google.protobuf.Empty keep_alive = 2;

        /// Informs the worker about some work it should begin performing the
        /// requested action.
        StartExecute start_action = 3;

        /// Informs the worker that it has been disconnected from the pool.
        /// The worker may discard any outstanding work that is being executed.
        google.protobuf.Empty disconnect = 4;

        /// Instructs the worker to kill a specific running operation.
        KillOperationRequest kill_operation_request = 5;

        /// Instructs the worker to touch (update access time) on blobs
        /// to prevent premature eviction.
        TouchBlobsRequest touch_blobs = 7;

        /// Confirms that blobs have been persisted to stable storage.
        /// Workers should unpin matching blobs from their local CAS.
        BlobsInStableStorage blobs_in_stable_storage = 8;

        /// Requests the worker to upload specific blobs that the server
        /// is missing from its CAS. Sent in response to BlobsAvailable.
        UploadMissingBlobsRequest upload_missing_blobs = 9;

        /// Pushes a batch of small CAS/AC blobs from the server's
        /// `SmallBlobDispatcher` to the worker. The worker writes each
        /// `SmallBlobEntry` into `mirror_blobs` keyed by
        /// `(store_id, digest)`. The worker subsequently advertises the
        /// current snapshot via field 16 `pinned_mirror_entries` on the
        /// next `BlobsAvailableNotification`, which causes the server's
        /// per-store `EphemeralServerSidePin` set to release matching
        /// pins.
        ///
        /// Backward compatibility: workers built before this field
        /// exists treat unknown variants as ignorable warnings (the
        /// catch-all in `local_worker.rs` `Update::*` match returns
        /// `Ok(())` rather than `?`-propagating). NO capability flag
        /// is required.
        BatchWriteSmallBlobsRequest batch_write_small_blobs = 10;
        /// One chunk of a streaming protocol message. Today carries
        /// `PeerHintsChunk` (task #98); future PRs add other payload
        /// arms (`BlobsInStableStorageChunk`, `BlobsAvailableChunk`).
        /// Receivers MUST be prepared to see chunks for an operation
        /// before, after, or interleaved with `start_action` for the
        /// same operation_id (no ordering invariant — each chunk's
        /// payload is independently meaningful).
        ChunkedMessage chunked_message = 11;
    }
    reserved 6; // Previously NextId, now reserved.
}

/// Acknowledgement of one BlobsInStableStorageChunk delivery (task #97).
/// Sent by the worker after every chunk it processes (success path AND
/// the no-op path where every digest was already unpinned). The
/// scheduler uses `(broadcast_id, sequence)` to drop the matching chunk
/// from its per-worker resend buffer; chunks NOT acked when the
/// connection closes are replayed on the next ConnectWorker.
///
/// Independent ack channel rather than coopting BlobsAvailable's
/// `bis_ack_seq`: BIS broadcasts have per-chunk granularity (sequence
/// inside a broadcast_id) that is independent of BlobsAvailable's
/// per-snapshot cadence; collapsing them would require the worker to
/// emit a BlobsAvailable per chunk (chatty + couples two protocols)
/// or the server to wait for the next BlobsAvailable to learn an ack
/// landed (delays the resend buffer's release by up to one snapshot
/// interval). Per-chunk ack is the simpler primitive.
message BisAck {
    /// Server-allocated broadcast_id from the original chunk.
    uint64 broadcast_id = 1;
    /// Sequence within the broadcast that this ack covers.
    uint32 sequence = 2;
    /// Echo of `BlobsInStableStorageChunk.server_instance_token`. The
    /// scheduler silently drops acks whose token does not match the
    /// CURRENT server-process token — this guards against a worker
    /// holding a stale ack across a server bounce dropping an
    /// unrelated chunk from the new server's resend buffer. Per
    /// red-team finding #5 on #97. A value of 0 means
    /// "uninitialised / pre-fixup worker"; the server treats 0 as
    /// always-mismatched (today; legacy compat would make it
    /// always-accepted).
    uint64 server_instance_token = 3;
}

/// Communication from the worker to the scheduler.
message UpdateForScheduler {
    oneof update {
        /// The initial request sent to the scheduler informing it of the
        /// supported properties of this worker.
        ConnectWorkerRequest connect_worker_request = 1;

        /// Message used to let the scheduler know that it is still alive as
        /// well as check to see if the scheduler is still alive. The scheduler
        /// may close the connection if the worker has not sent any messages
        /// after some amount of time (configured in the scheduler's
        /// configuration).
        KeepAliveRequest keep_alive_request = 2;

        /// Informs the scheduler that the service is going offline and
        /// should stop issuing any new actions on this worker.
        ///
        /// The worker may stay connected even after sending this command
        /// and may even send an `ExecuteResult` after sending this command.
        /// It is up to the scheduler implementation to decide how to handle
        /// this case.
        ///
        /// Any job that was running on this instance likely needs to be
        /// executed again, but up to the scheduler on how or when to handle
        /// this case.
        GoingAwayRequest going_away_request = 3;

        /// Informs the scheduler about the result of an execution request.
        ExecuteResult execute_result = 4;

        /// Notify that the execution has completed, but result is uploading.
        ExecuteComplete execute_complete = 5;

        /// Notifies the scheduler that new blobs are available on this worker.
        BlobsAvailableNotification blobs_available = 7;

        /// Notifies the scheduler that blobs have been evicted from this worker.
        BlobsEvictedNotification blobs_evicted = 8;

        /// Acknowledges one BlobsInStableStorageChunk delivery so the
        /// scheduler can drop the matching chunk from its per-worker
        /// resend buffer (task #97).
        BisAck bis_ack = 9;
    }
    reserved 6; // Previously NextId, now reserved.
}

message StartExecute {
    /// The action information used to execute job.
    build.bazel.remote.execution.v2.ExecuteRequest execute_request = 1;

    /// Id of the operation.
    string operation_id = 4;

    /// The time at which the command was added to the queue to allow population
    /// of the ActionResult.
    google.protobuf.Timestamp queued_timestamp = 3;

    /// The post-computed platform properties that the scheduler has reserved for
    /// the action.
    build.bazel.remote.execution.v2.Platform platform = 5;

    /// The ID of the worker that is executing the action.
    string worker_id = 6;

    /// Pre-resolved input directory tree from the scheduler.
    /// The scheduler already resolves the tree for locality scoring; including
    /// it here lets the worker skip its own GetTree RPC. Parallel arrays:
    /// resolved_directory_digests[i] is the digest of resolved_directories[i].
    /// Empty when the scheduler failed to resolve the tree or it exceeded the
    /// size threshold (worker falls back to its normal GetTree RPC).
    repeated build.bazel.remote.execution.v2.Directory resolved_directories = 9;
    repeated build.bazel.remote.execution.v2.Digest resolved_directory_digests = 10;

    /// Server-computed list of input blob digests the worker is believed to
    /// be missing, based on the locality map snapshot at dispatch time.
    /// When present, the worker can skip its own has_with_results check for
    /// these digests and immediately begin fetching, saving 5-50ms of
    /// existence-check round-trip. If the hints are stale (e.g. a blob was
    /// evicted between snapshot and fetch), the worker falls back to its
    /// normal error-recovery path.
    repeated build.bazel.remote.execution.v2.Digest missing_digests = 11;

    reserved 8; // Previously `peer_hints`; replaced by streaming
                // `ChunkedMessage::PeerHintsChunk` in #98 (no
                // backwards-compat per user directive 2026-04-24).
    reserved 12; // NextId.
}

/// This is a special message used to save actions into the CAS that can be used
/// by programs like bb_browswer to inspect the history of a build.
/// Note: Ensure this is always compatible with:
/// https://github.com/buildbarn/bb-remote-execution/blob/e95e066eb624dc9099682394ec18c12e218e8fc4/pkg/proto/cas/cas.proto#L23
message HistoricalExecuteResponse {
    reserved 2;

    build.bazel.remote.execution.v2.Digest action_digest = 1;
    build.bazel.remote.execution.v2.ExecuteResponse execute_response = 3;
}

/// Wire-stable detail message attached to a `tonic::Status` with
/// `Code::ResourceExhausted` to discriminate #212 Q8 backpressure
/// rejections from genuine dead-channel ResourceExhausted signals
/// (the historic h2 ENHANCE_YOUR_CALM mapping handled by
/// `looks_like_dead_channel` in `nativelink-store/src/grpc_store.rs`).
///
/// Phase 1 only adds the message; Phase 2 will emit it from the
/// FastSlowStore admission path AND tighten `looks_like_dead_channel`
/// to require its absence before classifying a `ResourceExhausted` as
/// dead-channel. Without this discriminator, every per-blob mpsc-full
/// event would evict the underlying h2 channel and reproduce the
/// production #147 stale-channel-reuse trace.
///
/// Wire stability: per design §3 wire-stability commitment, the field
/// tags AND the `Reason` enum values are CONTRACTUAL once a release
/// emits this proto. Changes are additive only; no value
/// reassignment.
message BackpressureSignal {
    enum Reason {
        REASON_UNSPECIFIED = 0;
        /// Global byte budget (`Arc<Semaphore>` with 4 GiB cap per Q4)
        /// exhausted. Caller should retry after `retry_after_ms`.
        GLOBAL_CHUNK_BUDGET_EXHAUSTED = 1;
        /// Per-blob mpsc(16) full. Caller should retry after
        /// `retry_after_ms`; backoff target is shorter than the global
        /// case because per-blob queues drain faster.
        PER_BLOB_MPSC_FULL = 2;
        /// #212 Phase 2.6: a `MemoryStore` write would have forced
        /// eviction of a recently-inserted blob to make room for the
        /// new write. Operator opted into emission via the
        /// `MemoryStore::enable_emit_backpressure` runtime kill-switch
        /// (default OFF preserves the historic silent-evict behavior).
        /// Caller should retry after `retry_after_ms`.
        MEMORY_STORE_AT_CAPACITY = 3;
        /// #212 Phase 2.5/2.7 fixup B1: the global pinned-bytes budget
        /// (`PinBudget`, default 4 GiB cap) is exhausted. Each in-flight
        /// chunked-driver pin holds bytes until commit; under slow-tier
        /// pause (txg / FS busy) pinned bytes grow at upload rate × pause
        /// duration. The cap prevents the #203-shape OOM cascade. Caller
        /// should retry after `retry_after_ms` once existing chunked
        /// commits drain.
        PINNED_BYTES_EXHAUSTED = 4;
    }
    Reason reason = 1;
    /// Server-suggested backoff hint in milliseconds. Client may apply
    /// jitter or its own backoff curve. Zero = no specific hint.
    uint64 retry_after_ms = 2;
}

/// #212 Phase 2.2: one chunk of a `WriteChunked` client-streaming
/// upload. The first message identifies the blob via `digest`; every
/// subsequent message in the stream MUST carry the SAME `digest` (the
/// server validates and rejects with `InvalidArgument` on mismatch).
///
/// `chunk_offset` MUST be a multiple of `CHUNK_SIZE` (1 MiB per design
/// Q3=(a)). `chunk_bytes.len()` MUST be exactly `CHUNK_SIZE` for every
/// chunk EXCEPT the FINAL chunk (`finish_chunk=true`), where the final
/// chunk's length is the trailing remainder
/// (`expected_size mod CHUNK_SIZE`, or `CHUNK_SIZE` if size is an
/// exact multiple).
///
/// `chunk_sha256` is the SHA-256 of `chunk_bytes` (per design §8.3.1).
/// The server validates per-chunk on arrival (on `spawn_blocking` per
/// #213 perf-opt NMA1) and rejects with `Code::InvalidArgument` on
/// mismatch.
///
/// `finish_chunk=true` marks the FINAL chunk. Triggers the per-blob
/// driver's commit path: wait for all chunks to land, atomic rename,
/// end-to-end SHA-256 verification.
message WriteChunk {
    build.bazel.remote.execution.v2.Digest digest = 1;
    uint64 chunk_offset = 2;
    // `chunk_bytes` is decoded as `bytes::Bytes` via prost (`#[prost(bytes = "bytes")]`
    // in the matching `.pb.rs`). The wire format is unchanged — only the
    // Rust-side in-memory representation differs (refcounted `Bytes` vs
    // allocated `Vec<u8>`), which eliminates the per-retry full memcpy
    // that the chunked-write client would otherwise pay (#212 Phase 2.4
    // fixup B1 part 2).
    bytes chunk_bytes = 3;
    bytes chunk_sha256 = 4;
    bool finish_chunk = 5;
}

/// #212 Phase 2.2: server response to a complete `WriteChunked` stream.
/// Returned ONCE on success after the per-blob driver's commit path
/// has run (synchronous-commit option α — design ambiguity resolved
/// in Phase 2.2/2.3 implementation). The caller (worker, or any peer
/// the server trusts via the existing worker auth path) may immediately
/// reference the blob via `has` after receiving this response.
///
/// On stream error (per-chunk SHA-256 mismatch, length mismatch,
/// end-to-end SHA-256 mismatch, mid-stream disconnect, ResourceExhausted
/// admission) the server returns the error via the gRPC status; this
/// message is only emitted on the success path.
message WriteChunkedResponse {
    build.bazel.remote.execution.v2.Digest committed_digest = 1;
    uint64 committed_size = 2;
}
