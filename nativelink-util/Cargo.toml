#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
edition = "2024"
name = "nativelink-util"
version = "1.6.1"

[features]
io-uring = ["dep:tokio-epoll-uring", "dep:io-uring"]
pprof = ["dep:pprof", "dep:axum", "dep:serde_json"]
quic = ["dep:tonic-h3", "dep:h3-util", "dep:quinn", "dep:h3-quinn", "dep:rustls", "dep:socket2"]
failpoints = ["dep:fail", "fail/failpoints"]
# #44 fix-up B3: gates `StreamingBlobInner::bytes_written_atomic`,
# `append_chunk_for_test`, and `InFlightBlobMap::insert_for_test` so they
# are NOT linked into production builds. These accessors bypass the
# Layer A admission cap (which is the load-bearing OVERSHOOT defense
# at the writer-side seam) and exist only to forge the bypass scenario
# in #44 Layer B/C regression tests. Cfg-gating prevents accidental
# production use of a primitive whose entire job is to violate the
# `bytes_written <= expected_size_on_store` invariant.
test-utils = []

[dependencies]
nativelink-config = { path = "../nativelink-config" }
nativelink-error = { path = "../nativelink-error" }
nativelink-metric = { path = "../nativelink-metric" }
nativelink-proto = { path = "../nativelink-proto" }

fail = { version = "0.5", optional = true }

async-trait = { version = "0.1.88", default-features = false }
backtrace = { version = "0.3", default-features = false, features = ["std"] }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bincode = { version = "2.0.1", default-features = false, features = [
  "alloc",
  "serde",
] }
bitflags = { version = "2.9.0", default-features = false }
blake3 = { version = "1.8.0", features = ["mmap", "rayon"], default-features = false }
bytes = { version = "1.10.1", default-features = false }
futures = { version = "0.3.31", features = [
  "async-await",
], default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
http = { version = "1.3.1", default-features = false }
http-body = { version = "1.0.1", default-features = false }
humantime = { version = "2.3.0", default-features = false }
hyper = { version = "1.6.0", default-features = false }
hyper-util = { version = "0.1.11", default-features = false }
dashmap = { version = "6", default-features = false }
libc = { version = "0.2.177", default-features = false }
moka = { version = "0.12", features = ["sync"], default-features = false }
mock_instant = { version = "0.5.3", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry-appender-tracing = { version = "0.32.0", default-features = false }
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "grpc-tonic",
  "logs",
  "metrics",
  "trace",
  "zstd-tonic",
] }
opentelemetry-semantic-conventions = { version = "0.32.0", default-features = false, features = [
  "default",
  "semconv_experimental",
] }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
parking_lot = { version = "0.12.3", features = [
  "arc_lock",
  "send_guard",
], default-features = false }
pin-project = { version = "1.1.10", default-features = false }
pin-project-lite = { version = "0.2.16", default-features = false }
prost = { version = "0.14.4", default-features = false }
prost-types = { version = "0.14.4", default-features = false, features = [
  "std",
] }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
rayon = { version = "1.10.0", default-features = false }
rlimit = { version = "0.10.2", default-features = false }
serde = { version = "1.0.219", default-features = false }
sha2 = { version = "0.10.8", default-features = false, features = ["asm"] }
smallvec = { version = "1.13", default-features = false, features = ["const_generics", "union"] }
tempfile = { version = "3.20.0", default-features = false }
tokio = { version = "1.52.2", features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "signal",
], default-features = false }
tokio-stream = { version = "0.1.17", features = [
  "fs",
], default-features = false }
tokio-util = { version = "0.7.14", default-features = false }
tonic = { version = "0.14.5", features = [
  "router",
  "tls-native-roots",
  "tls-aws-lc",
  "transport",
], default-features = false }
tower = { version = "0.5.2", default-features = false, features = ["buffer", "reconnect"] }
tracing = { version = "0.1.41", default-features = false }
tracing-appender = { version = "0.2", default-features = false }
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = [
  "metrics",
] }
tracing-subscriber = { version = "0.3.19", features = [
  "ansi",
  "env-filter",
  "json",
  "registry",
], default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [] }
# FIXME: Replace with version once https://github.com/TrueLayer/ginepro/pull/77 is fixed
ginepro = { git = "https://github.com/mstyura/ginepro", rev = "d08cdeff6300edfb46204b3b9fbde3f3355db35f", default-features = false }
url = { version = "2.5.7", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = [
  "serde",
  "v4",
  "v6",
] }
walkdir = { version = "2.5.0", default-features = false }
tonic-h3 = { version = "0.0.5", default-features = false, features = ["quinn"], optional = true }
h3-util = { version = "0.0.5", default-features = false, features = ["quinn"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
h3-quinn = { version = "0.0.10", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
socket2 = { version = "0.5", default-features = false, optional = true }
axum = { version = "0.8.3", default-features = false, features = ["http1", "query", "tokio"], optional = true }
pprof = { version = "0.15.0", default-features = false, features = ["flamegraph", "prost-codec"], optional = true }
serde_json = { version = "1.0.140", default-features = false, features = ["alloc"], optional = true }
wincode = { version = "0.5.4", default-features = false, features = ["derive"] }

[dev-dependencies]
anyhow = { version = "1.0.100", default-features = false }
nativelink-macro = { path = "../nativelink-macro" }
fail = { version = "0.5", features = ["failpoints"] }
tokio = { version = "1.52.2", features = ["macros", "test-util"], default-features = false }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
  "gen-tonic",
  "metrics",
] }

axum = { version = "0.8.3", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["async_tokio"] }
http-body-util = { version = "0.1.3", default-features = false }
pretty_assertions = { version = "1.4.1", features = [
  "std",
], default-features = false }
rand = { version = "0.9.0", default-features = false, features = [
  "thread_rng",
] }
serde_json = { version = "1.0.140", default-features = false }
serde_json5 = { version = "0.2.1", default-features = false }
serial_test = { version = "3.2.0", default-features = false, features = [
  "async",
] }
tonic-prost = { version = "0.14.6", default-features = false }
tracing-test = { version = "0.2.5", default-features = false, features = [
  "no-env-filter",
] }

[[bench]]
name = "fs_io_bench"
harness = false
required-features = ["io-uring"]

# #44 Layer A/B symmetric overshoot defense tests. Uses the
# `bytes_written_atomic` accessor (gated behind `test-utils`) to
# forge a Layer-A bypass at the producer side and prove Layer B's
# reader emission cap fires. Run with:
#   `cargo test -p nativelink-util --features test-utils \
#       --test streaming_blob_overshoot_defense_test`
[[test]]
name = "streaming_blob_overshoot_defense_test"
required-features = ["test-utils"]

[target.'cfg(target_os = "linux")'.dependencies]
tokio-epoll-uring = { path = "../tokio-epoll-uring/tokio-epoll-uring", optional = true }
io-uring = { version = "0.6.0", optional = true }

[package.metadata.cargo-machete]
# Used by nativelink_test macro
ignored = ["tracing-test"]
